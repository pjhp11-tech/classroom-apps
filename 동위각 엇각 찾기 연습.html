<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>각도 탐정단 - 동위각과 엇각을 찾아라!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#EAF3FF;
    --bg2:#FDF3E7;
    --ink:#2B2D42;
    --ink-soft:#5A5F7A;
    --card:#FFFFFF;
    --primary:#3A5BFF;
    --primary-dark:#2740CC;
    --accent:#FF7A3D;
    --accent-soft:#FFE3D1;
    --good:#22B573;
    --bad:#FF4D6D;
    --line-blue:#2A4BDB;
    --line-gray:#8A8FA6;
    --card-border:#E3E8F5;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; padding:0; overflow:hidden;
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, #FFF3DD 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, #DCEBFF 0%, transparent 45%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
  }
  .jua{font-family:'Jua','Noto Sans KR',sans-serif;}
  #app{
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:1.2vh 1.2vw;
  }
  .screen{ display:none; width:100%; height:100%; align-items:center; justify-content:center; }
  .screen.active{ display:flex; }

  /* ---------- TITLE SCREEN ---------- */
  #screen-title .panel{
    background:var(--card);
    border-radius:28px;
    box-shadow:0 18px 40px rgba(40,60,120,0.15);
    padding:4vh 5vw;
    max-width:640px;
    width:92%;
    text-align:center;
    border:2px solid var(--card-border);
  }
  .badge-icon{
    width:76px;height:76px;margin:0 auto 1.2vh;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),#FFB347);
    border-radius:50%;
    box-shadow:0 8px 18px rgba(255,122,61,0.35);
  }
  #screen-title h1{
    font-size:clamp(22px,4vh,34px);
    margin:0.4vh 0 0.6vh;
    color:var(--primary-dark);
    letter-spacing:-0.5px;
  }
  #screen-title p.sub{
    color:var(--ink-soft);
    font-size:clamp(13px,2vh,16px);
    margin:0 0 2vh;
    line-height:1.55;
  }
  .rule-box{
    background:#F5F8FF;
    border:1.5px dashed #C6D3F5;
    border-radius:16px;
    padding:1.6vh 1.6vw;
    margin-bottom:2.2vh;
    text-align:left;
    font-size:clamp(12.5px,1.9vh,15px);
    color:var(--ink);
    line-height:1.75;
  }
  .rule-box b{color:var(--primary-dark);}
  #start-btn{
    font-family:'Jua','Noto Sans KR',sans-serif;
    font-size:clamp(16px,2.6vh,22px);
    background:linear-gradient(135deg,var(--primary),#5B7CFF);
    color:#fff;
    border:none;
    padding:1.5vh 5vw;
    border-radius:100px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(58,91,255,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #start-btn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 14px 26px rgba(58,91,255,0.45); }
  #start-btn:active{ transform:translateY(0) scale(0.98); }

  /* ---------- GAME SCREEN ---------- */
  #screen-game{ flex-direction:column; }
  .game-wrap{
    width:100%; height:100%;
    max-width:980px;
    display:flex; flex-direction:column;
    gap:1.1vh;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card);
    border-radius:16px;
    padding:1.1vh 1.6vw;
    box-shadow:0 6px 16px rgba(40,60,120,0.08);
    border:1.5px solid var(--card-border);
    flex-shrink:0;
  }
  .topbar .stat{ text-align:center; }
  .topbar .stat .label{ font-size:clamp(9px,1.2vh,11px); color:var(--ink-soft); }
  .topbar .stat .value{ font-family:'Jua',sans-serif; font-size:clamp(15px,2.4vh,22px); color:var(--primary-dark); }
  #score-value.warn{ color:var(--bad); }
  .progress-track{
    flex:1; margin:0 1.4vw; height:10px; background:#EDF1FC; border-radius:8px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--accent),#FFB347); border-radius:8px; transition:width .3s ease; }

  .question-bar{
    flex-shrink:0;
    background:linear-gradient(135deg,#FFF1E6,#FFE6D2);
    border:1.5px solid #FFD3AE;
    border-radius:14px;
    padding:1vh 1.6vw;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:clamp(13px,2.1vh,18px);
    text-align:center;
  }
  .question-bar b.target-letter{
    font-family:'Jua',sans-serif; color:var(--accent); font-size:1.25em;
  }
  .question-bar .step-name{
    font-family:'Jua',sans-serif; color:var(--primary-dark);
  }
  .step-dots{ display:flex; gap:6px; margin-left:6px; }
  .step-dots span{
    width:9px;height:9px;border-radius:50%; background:#F3D2B8; display:inline-block;
  }
  .step-dots span.done{ background:var(--good); }
  .step-dots span.now{ background:var(--accent); box-shadow:0 0 0 3px rgba(255,122,61,0.25); }

  .diagram-area{
    flex:2 1 0;
    min-height:0;
    background:var(--card);
    border-radius:18px;
    border:1.5px solid var(--card-border);
    box-shadow:0 6px 16px rgba(40,60,120,0.08);
    display:flex; align-items:center; justify-content:center;
    padding:0.5vh;
  }
  #svg-diagram{ width:auto; height:100%; max-width:100%; }

  .answer-grid{
    flex:1 1 0;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-auto-rows:1fr;
    gap:1vh 0.9vw;
  }
  .card-btn{
    font-family:'Jua',sans-serif;
    font-size:clamp(20px,4.2vh,32px);
    background:var(--card);
    border:2.5px solid var(--card-border);
    border-radius:16px;
    padding:0;
    cursor:pointer;
    color:var(--primary-dark);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
    box-shadow:0 5px 12px rgba(40,60,120,0.08);
  }
  .card-btn.none-card{ font-size:clamp(15px,2.6vh,20px); }
  .card-btn:hover{ transform:translateY(-3px); border-color:var(--primary); box-shadow:0 8px 16px rgba(58,91,255,0.18); }
  .card-btn:active{ transform:translateY(0); }
  .card-btn.correct{ background:var(--good); border-color:var(--good); color:#fff; }
  .card-btn.wrong{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .card-btn.disabled{ pointer-events:none; opacity:0.55; }
  .card-btn.reveal{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  /* ---------- RESULT SCREEN ---------- */
  #screen-result .panel{
    background:var(--card);
    border-radius:28px;
    box-shadow:0 18px 40px rgba(40,60,120,0.15);
    padding:4vh 5vw;
    max-width:560px; width:92%;
    text-align:center;
    border:2px solid var(--card-border);
  }
  #screen-result .medal{ font-size:clamp(40px,7vh,64px); margin-bottom:0.6vh; }
  #screen-result h2{ font-family:'Jua',sans-serif; color:var(--primary-dark); font-size:clamp(20px,3.2vh,28px); margin:0.2vh 0; }
  #result-score{ font-family:'Jua',sans-serif; font-size:clamp(44px,9vh,72px); color:var(--accent); margin:1vh 0; }
  #result-msg{ color:var(--ink-soft); font-size:clamp(13px,2vh,16px); margin-bottom:2vh; }
  .result-details{
    display:flex; justify-content:center; gap:6vw;
    margin-bottom:2.4vh;
  }
  .result-details div{ text-align:center; }
  .result-details .num{ font-family:'Jua',sans-serif; font-size:clamp(18px,2.8vh,24px); color:var(--primary-dark); }
  .result-details .lab{ font-size:clamp(11px,1.6vh,13px); color:var(--ink-soft); }
  #retry-btn{
    font-family:'Jua',sans-serif;
    font-size:clamp(15px,2.4vh,20px);
    background:linear-gradient(135deg,var(--primary),#5B7CFF);
    color:#fff; border:none; padding:1.4vh 4.5vw; border-radius:100px; cursor:pointer;
    box-shadow:0 10px 22px rgba(58,91,255,0.35);
    transition:transform .15s ease;
  }
  #retry-btn:hover{ transform:translateY(-2px) scale(1.03); }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE SCREEN -->
  <section id="screen-title" class="screen active">
    <div class="panel">
      <div class="badge-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2.4"/>
          <line x1="16.2" y1="16.2" x2="21.5" y2="21.5" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="jua">각도 탐정단</h1>
      <p class="sub">평행선과 한 직선이 만나서 생기는 8개의 각! <br>맞꼭지각·동위각·엇각을 순서대로 찾아내는 탐정이 되어보자.</p>
      <div class="rule-box">
        📐 8개의 각 중 <b>하나</b>가 문제로 제시돼요.<br>
        🔎 그 각의 <b>맞꼭지각 → 동위각 → 엇각</b>을 순서대로 골라요.<br>
        🧩 카드는 <b>a~h, 없음</b> 총 9개 중에서 선택해요.<br>
        🏆 총 <b>10문제</b>! 1000점 만점, 틀리면 <b>-50점</b>, 1초마다 <b>-1점</b>이 깎여요.
      </div>
      <button id="start-btn" onclick="startGame()">게임 시작</button>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen">
    <div class="game-wrap">
      <div class="topbar">
        <div class="stat">
          <div class="label">문제</div>
          <div class="value"><span id="round-value">1</span>/10</div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="stat">
          <div class="label">시간</div>
          <div class="value" id="time-value">0초</div>
        </div>
        <div class="stat">
          <div class="label">점수</div>
          <div class="value" id="score-value">1000</div>
        </div>
      </div>

      <div class="question-bar">
        <span>∠<b class="target-letter" id="target-letter">a</b>의</span>
        <span class="step-name" id="step-name">맞꼭지각</span>
        <span>을(를) 고르세요</span>
        <div class="step-dots">
          <span id="dot-0"></span><span id="dot-1"></span><span id="dot-2"></span>
        </div>
      </div>

      <div class="diagram-area">
        <svg id="svg-diagram" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="answer-grid" id="answer-grid"></div>
    </div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="screen-result" class="screen">
    <div class="panel">
      <div class="medal" id="result-medal">🏅</div>
      <h2 class="jua">탐정 활동 결과</h2>
      <div id="result-score" class="jua">1000</div>
      <div id="result-msg">최고의 각도 탐정이에요!</div>
      <div class="result-details">
        <div><div class="num" id="result-correct">30/30</div><div class="lab">정답 수</div></div>
        <div><div class="num" id="result-time">0초</div><div class="lab">걸린 시간</div></div>
      </div>
      <button id="retry-btn" onclick="restartGame()">다시 도전하기</button>
    </div>
  </section>

</div>

<script>
/* ===================== 데이터 정의 ===================== */
// 슬롯: 0~3 = P점(위쪽 평행선과 횡단선의 교점) TL,TR,BR,BL
//       4~7 = Q점(아래쪽 평행선과 횡단선의 교점) TL,TR,BR,BL
const VERTICAL = {0:2,2:0, 1:3,3:1, 4:6,6:4, 5:7,7:5};
const CORRESPOND = {0:4,4:0, 1:5,5:1, 2:6,6:2, 3:7,7:3};
const ALTERNATE = {2:4,4:2, 3:5,5:3}; // 나머지는 없음

const STEP_NAMES = ['맞꼭지각','동위각','엇각'];
const STEP_TABLES = [VERTICAL, CORRESPOND, ALTERNATE];

/* 도형 좌표 */
const P = {x:265, y:110};
const Q = {x:435, y:270};
const LINE_X0 = 40, LINE_X1 = 660;
const TRANS_X0 = 170, TRANS_Y0 = 20, TRANS_X1 = 530, TRANS_Y1 = 360;

const OFFSETS = { // 라벨을 교점에서 얼마나 떨어뜨려 표시할지 (TL,TR,BR,BL)
  TL:{dx:-46,dy:-26}, TR:{dx:46,dy:-26}, BR:{dx:46,dy:26}, BL:{dx:-46,dy:26}
};
const POS_ORDER = ['TL','TR','BR','BL']; // slot%4 -> POS_ORDER index

const transAngleDeg = Math.atan2(Q.y-P.y, Q.x-P.x) * 180/Math.PI; // 횡단선의 각도

function wedgeRange(pos){
  // 각 위치(TL,TR,BR,BL)에 대응하는 부채꼴 각도 범위 반환
  if(pos==='BR') return [0, transAngleDeg];
  if(pos==='BL') return [transAngleDeg, 180];
  if(pos==='TL') return [180, transAngleDeg+180];
  if(pos==='TR') return [transAngleDeg+180, 360];
}

/* ===================== 게임 상태 ===================== */
let state = {};

function resetState(){
  state = {
    round:1, totalRounds:10,
    subStep:0, // 0,1,2
    labels:[], // slot index -> 'a'~'h'
    targetSlot:0,
    score:1000,
    wrongCount:0,
    correctCount:0,
    elapsed:0,
    timerId:null,
    locked:false
  };
}

function shuffleLabels(){
  const letters = ['a','b','c','d','e','f','g','h'];
  for(let i=letters.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [letters[i],letters[j]] = [letters[j],letters[i]];
  }
  return letters; // index -> slot 0..7
}

/* ===================== 화면 전환 ===================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  resetState();
  showScreen('screen-game');
  startTimer();
  newRound();
}

function restartGame(){
  showScreen('screen-title');
}

/* ===================== 타이머 & 점수 ===================== */
function startTimer(){
  state.timerId = setInterval(()=>{
    state.elapsed += 1;
    state.score = Math.max(0, state.score - 1);
    updateTopbar();
  },1000);
}
function stopTimer(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId=null; }
}

function updateTopbar(){
  document.getElementById('round-value').textContent = state.round;
  document.getElementById('time-value').textContent = state.elapsed + '초';
  const scoreEl = document.getElementById('score-value');
  scoreEl.textContent = state.score;
  scoreEl.classList.toggle('warn', state.score <= 300);
  const totalSteps = (state.round-1)*3 + state.subStep;
  const pct = Math.min(100, Math.round((totalSteps/30)*100));
  document.getElementById('progress-fill').style.width = pct+'%';
}

/* ===================== 라운드 진행 ===================== */
function newRound(){
  state.labels = shuffleLabels();
  state.targetSlot = Math.floor(Math.random()*8);
  state.subStep = 0;
  state.locked = false;
  renderQuestionBar();
  renderDiagram();
  renderAnswerGrid();
  updateTopbar();
}

function renderQuestionBar(){
  document.getElementById('target-letter').textContent = state.labels[state.targetSlot];
  document.getElementById('step-name').textContent = STEP_NAMES[state.subStep];
  for(let i=0;i<3;i++){
    const dot = document.getElementById('dot-'+i);
    dot.classList.remove('done','now');
    if(i < state.subStep) dot.classList.add('done');
    else if(i === state.subStep) dot.classList.add('now');
  }
}

function polar(cx,cy,r,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}

function sectorPath(cx,cy,r,a0,a1){
  const p0 = polar(cx,cy,r,a0);
  const p1 = polar(cx,cy,r,a1);
  const largeArc = (a1-a0) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 1 ${p1.x} ${p1.y} Z`;
}

function renderDiagram(){
  const svg = document.getElementById('svg-diagram');
  let html = '';

  // 평행선 두 개
  html += `<line x1="${LINE_X0}" y1="${P.y}" x2="${LINE_X1}" y2="${P.y}" stroke="var(--line-blue)" stroke-width="3.5" stroke-linecap="round"/>`;
  html += `<line x1="${LINE_X0}" y1="${Q.y}" x2="${LINE_X1}" y2="${Q.y}" stroke="var(--line-blue)" stroke-width="3.5" stroke-linecap="round"/>`;
  // 평행 표시 화살표 (line1, line2 각각)
  [P.y, Q.y].forEach(y=>{
    const cx = LINE_X0 + 70;
    html += `<path d="M ${cx-7} ${y-7} L ${cx+5} ${y} L ${cx-7} ${y+7}" stroke="var(--line-blue)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  // 횡단선
  html += `<line x1="${TRANS_X0}" y1="${TRANS_Y0}" x2="${TRANS_X1}" y2="${TRANS_Y1}" stroke="var(--line-gray)" stroke-width="3.5" stroke-linecap="round"/>`;

  // 교점 점
  html += `<circle cx="${P.x}" cy="${P.y}" r="4.5" fill="var(--ink)"/>`;
  html += `<circle cx="${Q.x}" cy="${Q.y}" r="4.5" fill="var(--ink)"/>`;

  // 8개 각 부채꼴 표시 (모든 각을 옅은 색으로, 제시된 각만 진하게 강조)
  for(let slot=0; slot<8; slot++){
    const point = slot < 4 ? P : Q;
    const pos = POS_ORDER[slot % 4];
    const [a0,a1] = wedgeRange(pos);
    const isTarget = slot === state.targetSlot;
    if(isTarget){
      html += `<path d="${sectorPath(point.x, point.y, 32, a0, a1)}" fill="var(--accent)" fill-opacity="0.32" stroke="var(--accent)" stroke-width="2.5"/>`;
    } else {
      html += `<path d="${sectorPath(point.x, point.y, 26, a0, a1)}" fill="#EAF0FF" fill-opacity="0.9" stroke="#B9C6EE" stroke-width="1.5"/>`;
    }
  }

  // 8개 라벨
  for(let slot=0; slot<8; slot++){
    const point = slot < 4 ? P : Q;
    const pos = POS_ORDER[slot % 4];
    const off = OFFSETS[pos];
    const lx = point.x + off.dx;
    const ly = point.y + off.dy;
    const letter = state.labels[slot];
    const isTarget = slot === state.targetSlot;
    html += `<circle cx="${lx}" cy="${ly}" r="16.5" fill="${isTarget?'var(--accent)':'#FFFFFF'}" stroke="${isTarget?'var(--accent)':'#8FA3E0'}" stroke-width="2.4"/>`;
    html += `<text x="${lx}" y="${ly+6}" text-anchor="middle" font-family="Jua" font-size="18" fill="${isTarget?'#fff':'var(--primary-dark)'}">${letter}</text>`;
  }

  // 평행선 이름표
  html += `<text x="${LINE_X0-2}" y="${P.y-10}" font-size="13" fill="var(--ink-soft)" font-family="Gowun Dodum">l</text>`;
  html += `<text x="${LINE_X0-2}" y="${Q.y-10}" font-size="13" fill="var(--ink-soft)" font-family="Gowun Dodum">m</text>`;

  svg.innerHTML = html;
}

function renderAnswerGrid(){
  const grid = document.getElementById('answer-grid');
  const letters = ['a','b','c','d','e','f','g','h','없음'];
  grid.innerHTML = '';
  letters.forEach(letter=>{
    const btn = document.createElement('button');
    btn.className = 'card-btn' + (letter==='없음' ? ' none-card' : '');
    btn.textContent = letter;
    btn.onclick = ()=> handleAnswer(letter, btn);
    grid.appendChild(btn);
  });
}

function correctAnswerForCurrentStep(){
  const table = STEP_TABLES[state.subStep];
  const answerSlot = table[state.targetSlot];
  if(answerSlot === undefined) return '없음';
  return state.labels[answerSlot];
}

function handleAnswer(letter, btnEl){
  if(state.locked) return;
  state.locked = true;

  const correct = correctAnswerForCurrentStep();
  const buttons = document.querySelectorAll('.card-btn');
  buttons.forEach(b=>b.classList.add('disabled'));

  if(letter === correct){
    btnEl.classList.add('correct');
    state.correctCount++;
  } else {
    btnEl.classList.add('wrong');
    state.score = Math.max(0, state.score - 50);
    state.wrongCount++;
    // 정답 카드도 함께 표시
    buttons.forEach(b=>{
      if(b.textContent === correct) b.classList.add('reveal');
    });
  }
  updateTopbar();

  setTimeout(()=>{
    state.subStep++;
    if(state.subStep < 3){
      state.locked = false;
      renderQuestionBar();
      renderDiagram();
      renderAnswerGrid();
    } else {
      state.round++;
      if(state.round > state.totalRounds){
        endGame();
      } else {
        newRound();
      }
    }
  }, 700);
}

/* ===================== 게임 종료 ===================== */
function endGame(){
  stopTimer();
  showScreen('screen-result');
  document.getElementById('result-score').textContent = state.score;
  document.getElementById('result-correct').textContent = state.correctCount + '/30';
  document.getElementById('result-time').textContent = state.elapsed + '초';

  let medal, msg;
  if(state.score >= 900){ medal='🏆'; msg='완벽해요! 최고의 각도 탐정이에요!'; }
  else if(state.score >= 700){ medal='🥇'; msg='훌륭해요! 각도 실력이 뛰어나요!'; }
  else if(state.score >= 500){ medal='🥈'; msg='좋아요! 조금만 더 연습하면 완벽해져요.'; }
  else { medal='🥉'; msg='다시 도전해서 실력을 키워봐요!'; }

  document.getElementById('result-medal').textContent = medal;
  document.getElementById('result-msg').textContent = msg;
}

/* 초기 상태 세팅 */
resetState();
</script>
