<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>평행사변형의 성질 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#EAFBF3;
    --bg-b:#E3F1FF;
    --paper:#5FBE8A;
    --paper-dark:#2E8A5C;
    --paper-line:#1E6B44;
    --paper-soft:#DFF6EA;
    --accent:#FF8B5E;
    --accent-dark:#E96A3A;
    --blue:#4C9BDE;
    --blue-dark:#2E76B8;
    --ink:#1E3A34;
    --muted:#5C7A72;
    --card:#FFFFFF;
    --card-line:#D7EEE3;
    --danger:#EE6B6B;
    --good:#2EA36B;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,255,255,.6), transparent 40%),
      linear-gradient(150deg,var(--bg-a),var(--bg-b));
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
  }
  .app{
    min-height:100vh;
    min-height:100dvh; /* 모바일 주소창을 뺀 실제 보이는 높이 */
    width:100%;
    display:flex;
    flex-direction:column;
    padding:14px 22px 16px;
    gap:10px;
  }
  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .topbar h1{
    font-family:'Gowun Dodum',sans-serif;
    font-size:clamp(18px,2.1vw,26px);
    margin:0;
    color:var(--paper-dark);
    display:flex;
    align-items:center;
    gap:8px;
    letter-spacing:-0.3px;
  }
  .topbar h1 .leaf{font-size:1.1em;}
  .progress{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .pdot{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px 6px 8px;
    border-radius:999px;
    background:#fff;
    border:1.5px solid var(--card-line);
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    transition:all .25s ease;
  }
  .pdot .num{
    width:20px;height:20px;border-radius:50%;
    background:var(--card-line);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  .pdot.active{background:var(--paper);border-color:var(--paper-dark);color:#fff;}
  .pdot.active .num{background:#fff;color:var(--paper-dark);}
  .pdot.done{background:var(--paper-soft);border-color:var(--paper);color:var(--paper-dark);}
  .pdot.done .num{background:var(--paper);color:#fff;}

  /* ---------- main stage ---------- */
  .stage-wrap{
    flex:1 1 auto;
    display:flex;
    gap:16px;
    min-height:0;
  }
  .panel{
    flex:0 0 30%;
    max-width:340px;
    background:var(--card);
    border:1.5px solid var(--card-line);
    border-radius:22px;
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:0 10px 26px -14px rgba(30,90,60,.25);
    min-height:0;
    overflow:auto;
  }
  .panel .eyebrow{
    font-size:12px;font-weight:700;color:var(--accent-dark);
    background:#FFF0E7;display:inline-block;padding:3px 10px;border-radius:999px;
    width:fit-content;
  }
  .panel h2{
    font-family:'Gowun Dodum',sans-serif;
    font-size:clamp(17px,1.6vw,21px);
    margin:2px 0 2px;
    color:var(--ink);
    line-height:1.3;
  }
  .panel p{
    font-size:13.5px;
    line-height:1.6;
    color:var(--muted);
    margin:0;
  }
  .panel .task-btn{
    margin-top:6px;
    border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    font-weight:700;
    font-size:14px;
    padding:12px 16px;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 8px 16px -8px rgba(233,106,58,.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .panel .task-btn:hover{transform:translateY(-1px);box-shadow:0 10px 18px -8px rgba(233,106,58,.7);}
  .panel .task-btn:active{transform:translateY(0);}
  .panel .task-btn[disabled]{
    background:#E4E4E4;color:#999;box-shadow:none;cursor:not-allowed;
  }
  .status-line{
    margin-top:auto;
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:700;
    padding:10px 12px;
    border-radius:12px;
    min-height:20px;
  }
  .status-line.idle{background:#F3F6F5;color:var(--muted);}
  .status-line.wait{background:#FFF6E9;color:#B5750F;}
  .status-line.ok{background:#E9F9F0;color:var(--good);}
  .status-line.bad{background:#FDEDED;color:var(--danger);}

  .found-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .found-item{
    font-size:13px;font-weight:700;color:var(--paper-dark);
    background:var(--paper-soft);
    border:1.3px solid #BEE7D2;
    border-radius:10px;
    padding:6px 10px;
  }

  .canvas-wrap{
    flex:1 1 auto;
    background:var(--card);
    border:1.5px solid var(--card-line);
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 10px 26px -14px rgba(30,90,60,.25);
    min-height:0;
    overflow:hidden;
  }
  .canvas-wrap::before{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 90% 90%, rgba(95,190,138,.07), transparent 55%),
      radial-gradient(circle at 6% 10%, rgba(76,155,222,.07), transparent 50%);
    pointer-events:none;
  }
  svg#stage{width:92%;height:88%;display:block;touch-action:none;}

  .cutline{stroke:#B23A3A;stroke-width:2.4;stroke-dasharray:7 6;}
  .scissors{font-size:20px;}
  .paperpiece{filter:drop-shadow(0 6px 10px rgba(20,70,45,.28));}
  .fixedpiece{filter:drop-shadow(0 4px 8px rgba(20,70,45,.18));}
  .vlabel{font-family:'Gowun Dodum',sans-serif;font-weight:700;font-size:22px;fill:var(--ink);}
  .movable{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;}
  .movable:active{cursor:grabbing;}
  .sideHit{stroke:transparent;stroke-width:16;cursor:pointer;fill:none;}
  .sideLine{stroke:var(--paper-line);stroke-width:3;fill:none;}
  .sideLine.sel{stroke:var(--blue);stroke-width:5;}
  .sideLine.correct{stroke:var(--good);stroke-width:5;}
  .wedgeHit{cursor:pointer;fill:rgba(76,155,222,0.001);}
  .wedge{fill:rgba(76,155,222,.18);stroke:var(--blue);stroke-width:1.4;pointer-events:none;}
  .wedge.sel{fill:rgba(76,155,222,.42);}
  .wedge.correct{fill:rgba(46,163,107,.42);stroke:var(--good);}

  /* ---------- footer ---------- */
  .navbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .navbar button{
    border:1.6px solid var(--card-line);
    background:#fff;
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    padding:10px 22px;
    border-radius:12px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .navbar button:hover{border-color:var(--paper);color:var(--paper-dark);}
  .navbar button#nextBtn{
    background:var(--paper-dark);color:#fff;border-color:var(--paper-dark);
  }
  .navbar button#nextBtn:hover{background:var(--paper);border-color:var(--paper);}
  .navbar button#nextBtn[disabled]{background:#E4E4E4;border-color:#E4E4E4;color:#999;cursor:not-allowed;}
  .navbar button#prevBtn[disabled]{opacity:0;pointer-events:none;}
  .navhint{font-size:12.5px;color:var(--muted);font-weight:600;}

  .conclusion-box{
    background:var(--paper-soft);
    border:1.4px solid #BEE7D2;
    border-radius:14px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--paper-dark);
    font-weight:700;
  }
  .grid-pattern-rect{fill:url(#gridPat);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1><span class="leaf">🍃</span>평행사변형에는 어떤 성질이 있을까?</h1>
    <div class="progress" id="progress"></div>
  </div>

  <div class="stage-wrap">
    <aside class="panel" id="panel"></aside>
    <section class="canvas-wrap">
      <svg id="stage" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridPat" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M16 0 L0 0 0 16" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/>
          </pattern>
        </defs>
        <g id="sceneRoot"></g>
      </svg>
    </section>
  </div>

  <div class="navbar">
    <button id="prevBtn">← 이전</button>
    <div class="navhint" id="navhint"></div>
    <button id="nextBtn">다음 →</button>
  </div>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById('stage');
const sceneRoot = document.getElementById('sceneRoot');
const panel = document.getElementById('panel');
const progressEl = document.getElementById('progress');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const navhint = document.getElementById('navhint');

const STEPS = [
  {key:'cut',   label:'①'},
  {key:'split', label:'②'},
  {key:'overlap',label:'③'},
  {key:'q1',    label:'Q1'},
  {key:'q2',    label:'Q2'},
  {key:'done',  label:'✓'},
];
let stepIdx = 0;
const doneFlags = {cut:false, split:false, overlap:false, q1:false, q2:false};

function el(tag, attrs={}, parent=null){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function clearScene(){ sceneRoot.innerHTML=''; }
function setViewBox(v){ svg.setAttribute('viewBox', v); }

function anglePath(V,P1,P2,r){
  function towards(V,P,r){
    const dx=P.x-V.x, dy=P.y-V.y, len=Math.hypot(dx,dy);
    return {x:V.x+dx/len*r, y:V.y+dy/len*r};
  }
  const A1=towards(V,P1,r), A2=towards(V,P2,r);
  const cross=(A1.x-V.x)*(A2.y-V.y)-(A1.y-V.y)*(A2.x-V.x);
  const sweep = cross>0?1:0;
  return `M ${V.x} ${V.y} L ${A1.x} ${A1.y} A ${r} ${r} 0 0 ${sweep} ${A2.x} ${A2.y} Z`;
}
function pts(arr){ return arr.map(p=>p.x+','+p.y).join(' '); }
function labelAt(parent, p, text, dx=0, dy=0){
  el('text',{x:p.x+dx,y:p.y+dy,class:'vlabel','text-anchor':'middle'},parent).textContent=text;
}
// HTML span for a segment name with an overline, e.g. ol('AB') -> AB with a bar on top
function ol(id){ return `<span style="text-decoration:overline;text-underline-offset:2px;">${id}</span>`; }
// Build an SVG <text> where each token can optionally be overlined (for segment names)
function svgTextTokens(parent, x, y, tokens, extraAttrs={}){
  const t = el('text',{x,y,class:'vlabel','text-anchor':'middle',...extraAttrs},parent);
  tokens.forEach(tok=>{
    const tspan = el('tspan',{},t);
    if(tok.ol) tspan.setAttribute('style','text-decoration:overline;');
    tspan.textContent = tok.text;
  });
  return t;
}

/* ============ progress bar ============ */
function renderProgress(){
  progressEl.innerHTML='';
  STEPS.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className='pdot' + (i===stepIdx?' active':'') + (isStepDone(s.key) && i!==stepIdx ? ' done':'');
    d.innerHTML = `<span class="num">${s.label}</span>${stepTitleShort(s.key)}`;
    progressEl.appendChild(d);
  });
}
function stepTitleShort(k){
  return ({cut:'모양 만들기',split:'대각선 자르기',overlap:'겹쳐보기',q1:'변 탐구',q2:'각 탐구',done:'정리'})[k];
}
function isStepDone(k){
  if(k==='done') return false;
  return doneFlags[k];
}

/* ============ nav control ============ */
function setStatus(msg, kind){
  statusBox.className = 'status-line ' + kind;
  statusBox.innerHTML = msg;
}
let statusBox;

function updateNav(){
  prevBtn.disabled = stepIdx===0;
  const key = STEPS[stepIdx].key;
  if(key==='done'){ nextBtn.style.visibility='hidden'; navhint.textContent=''; }
  else{
    nextBtn.style.visibility='visible';
    const ok = doneFlags[key];
    nextBtn.disabled = !ok;
    navhint.textContent = ok ? '' : '먼저 활동을 완료해 보세요';
  }
}
prevBtn.addEventListener('click',()=>{ if(stepIdx>0){ stepIdx--; render(); }});
nextBtn.addEventListener('click',()=>{ if(stepIdx<STEPS.length-1){ stepIdx++; render(); }});

/* ============ geometry (shared coords) ============ */
// Parallelogram ABCD produced in step 1/2
const A = {x:230,y:80}, B={x:150,y:220}, C={x:550,y:220}, D={x:630,y:80};

/* =====================================================================
   STEP 1 : rectangle -> cut triangle -> slide -> parallelogram
===================================================================== */
function renderCut(){
  setViewBox('0 0 760 340');
  clearScene();
  panel.innerHTML = `
    <div class="eyebrow">STEP 1</div>
    <h2>색종이를 잘라 평행사변형 만들기</h2>
    <p>직사각형 색종이에 비스듬한 선을 긋고, 그 선을 따라 잘라 왼쪽 조각을 오른쪽으로 옮겨 붙이면 평행사변형이 됩니다.<br><br>
    가위 버튼을 눌러 직접 잘라 옮겨 보세요.</p>
    <button class="task-btn" id="cutBtn">✂️ 잘라서 옮기기</button>
    <div class="status-line idle" id="statusBox">아직 자르지 않았어요.</div>
  `;
  statusBox = document.getElementById('statusBox');

  const P1={x:150,y:80}, P2={x:550,y:80}, P3={x:550,y:220}, P4={x:150,y:220};
  const Ptop={x:230,y:80};

  // background grid rectangle
  el('rect',{x:150,y:80,width:400,height:140,class:'grid-pattern-rect',opacity:0.35},sceneRoot);
  el('rect',{x:150,y:80,width:400,height:140,fill:'none',stroke:'#BFD9CC','stroke-width':1.5},sceneRoot);

  // fixed trapezoid (stays put)
  const trapezoid = el('polygon',{points:pts([Ptop,P2,P3,P4]),fill:'var(--paper)',stroke:'var(--paper-line)','stroke-width':2.5,class:'paperpiece'},sceneRoot);

  // moving triangle
  const moveGroup = el('g',{class:'paperpiece'},sceneRoot);
  moveGroup.style.transition='transform 1.1s cubic-bezier(.4,.2,.2,1)';
  moveGroup.style.transform='translate(0px,0px)';
  el('polygon',{points:pts([P1,Ptop,P4]),fill:'var(--accent)',stroke:'var(--accent-dark)','stroke-width':2.5},moveGroup);
  el('line',{x1:Ptop.x,y1:Ptop.y,x2:P4.x,y2:P4.y,class:'cutline'},moveGroup);
  el('text',{x:(P1.x+Ptop.x)/2, y:60, class:'scissors','text-anchor':'middle'},moveGroup).textContent='✂️';

  const labelsG = el('g',{opacity:0},sceneRoot);
  labelAt(labelsG, {x:Ptop.x-14,y:Ptop.y-12}, 'A');
  labelAt(labelsG, {x:P4.x-16,y:P4.y+22}, 'B');
  labelAt(labelsG, {x:P3.x+16,y:P3.y+22}, 'C');
  labelAt(labelsG, {x:Ptop.x+400+16,y:Ptop.y-12}, 'D');

  document.getElementById('cutBtn').addEventListener('click', function(){
    this.disabled = true;
    setStatus('자르는 중… 조각을 옮기고 있어요.', 'wait');
    moveGroup.style.transform = 'translate(400px,0px)';
    setTimeout(()=>{
      labelsG.style.transition='opacity .6s ease';
      labelsG.style.opacity=1;
      setStatus('평행사변형 ABCD가 완성되었어요! 🎉', 'ok');
      doneFlags.cut = true;
      renderProgress(); updateNav();
    }, 1150);
  });

  renderProgress(); updateNav();
}

/* =====================================================================
   STEP 2 : cut parallelogram along diagonal AC
===================================================================== */
function renderSplit(){
  setViewBox('0 0 760 340');
  clearScene();
  panel.innerHTML = `
    <div class="eyebrow">STEP 2</div>
    <h2>대각선 AC를 따라 자르기</h2>
    <p>완성된 평행사변형 ABCD에 대각선 AC를 그은 뒤, 그 선을 따라 잘라 두 개의 삼각형을 만들어 봅시다.</p>
    <button class="task-btn" id="splitBtn">✂️ 대각선 자르기</button>
    <div class="status-line idle" id="statusBox">아직 자르지 않았어요.</div>
  `;
  statusBox = document.getElementById('statusBox');

  el('polygon',{points:pts([A,B,C,D]),fill:'var(--paper-soft)',stroke:'var(--paper-line)','stroke-width':1.5,'stroke-dasharray':'4 4'},sceneRoot);
  const diag = el('line',{x1:A.x,y1:A.y,x2:C.x,y2:C.y,class:'cutline'},sceneRoot);

  const triABC = el('g',{class:'paperpiece'},sceneRoot);
  triABC.style.transition='transform 1s ease';
  el('polygon',{points:pts([A,B,C]),fill:'var(--paper)',stroke:'var(--paper-line)','stroke-width':2.5},triABC);
  labelAt(triABC,{x:A.x-14,y:A.y-10},'A');
  labelAt(triABC,{x:B.x-16,y:B.y+22},'B');
  labelAt(triABC,{x:C.x+18,y:C.y+10},'C');

  const triACD = el('g',{class:'paperpiece'},sceneRoot);
  triACD.style.transition='transform 1s ease';
  el('polygon',{points:pts([A,C,D])},triACD).setAttribute('fill','var(--accent)');
  triACD.lastChild.setAttribute('stroke','var(--accent-dark)');
  triACD.lastChild.setAttribute('stroke-width','2.5');
  labelAt(triACD,{x:A.x-14,y:A.y-10},'A');
  labelAt(triACD,{x:C.x+18,y:C.y+10},'C');
  labelAt(triACD,{x:D.x+16,y:D.y-10},'D');

  document.getElementById('splitBtn').addEventListener('click', function(){
    this.disabled = true;
    setStatus('자르는 중…', 'wait');
    diag.style.transition='opacity .4s ease';
    diag.style.opacity=0;
    triABC.style.transform='translate(-26px,26px)';
    triACD.style.transform='translate(26px,-26px)';
    setTimeout(()=>{
      setStatus('삼각형 ABC와 삼각형 ACD로 나뉘었어요!', 'ok');
      doneFlags.split = true;
      renderProgress(); updateNav();
    },1050);
  });

  renderProgress(); updateNav();
}

/* =====================================================================
   STEP 3 : drag & rotate to overlap the two triangles
===================================================================== */
function renderOverlap(){
  setViewBox('0 0 820 320');
  clearScene();
  panel.innerHTML = `
    <div class="eyebrow">STEP 3</div>
    <h2>두 삼각형을 포개어 보기</h2>
    <p>초록 삼각형(고정)과 주황 삼각형(이동)은 평행사변형을 대각선으로 자른 조각이에요.<br><br>
    <b>① 회전 버튼</b>으로 방향을 맞추고,<br><b>② 드래그</b>해서 초록 삼각형 위에 정확히 포개어 보세요.</p>
    <button class="task-btn" id="rotBtn" style="background:linear-gradient(135deg,var(--blue),var(--blue-dark));box-shadow:0 8px 16px -8px rgba(46,118,184,.6);">🔄 180˚ 회전하기</button>
    <div class="status-line idle" id="statusBox">삼각형을 드래그해서 포개어 보세요.</div>
  `;
  statusBox = document.getElementById('statusBox');

  // fixed target triangle ABC
  const fA={x:150,y:100}, fB={x:102,y:184}, fC={x:342,y:184};
  el('polygon',{points:pts([fA,fB,fC]),fill:'var(--paper)',stroke:'var(--paper-line)','stroke-width':2.5,class:'fixedpiece'},sceneRoot);
  const fixedLabels = el('g',{},sceneRoot);
  labelAt(fixedLabels,{x:fA.x,y:fA.y-14},'A');
  labelAt(fixedLabels,{x:fB.x-18,y:fB.y+18},'B');
  labelAt(fixedLabels,{x:fC.x+18,y:fC.y+18},'C');

  // movable triangle (local coords)
  const mA={x:520,y:100}, mC={x:712,y:184}, mD={x:760,y:100};
  const movable = el('g',{class:'paperpiece movable'},sceneRoot);
  el('polygon',{points:pts([mA,mC,mD]),fill:'var(--accent)',stroke:'var(--accent-dark)','stroke-width':2.5},movable);
  labelAt(movable,{x:mA.x,y:mA.y-14},'A');
  labelAt(movable,{x:mC.x+16,y:mC.y+18},'C');
  labelAt(movable,{x:mD.x+16,y:mD.y-6},'D');

  const cx=(mA.x+mC.x+mD.x)/3, cy=(mA.y+mC.y+mD.y)/3;
  const targetCx=(fA.x+fB.x+fC.x)/3, targetCy=(fA.y+fB.y+fC.y)/3;
  const reqTx = targetCx-cx, reqTy = targetCy-cy;

  let angle=0, tx=0, ty=0, dragging=false, start=null, snapped=false;
  function applyTransform(){
    movable.setAttribute('transform',`translate(${tx},${ty}) rotate(${angle},${cx},${cy})`);
  }
  applyTransform();

  document.getElementById('rotBtn').addEventListener('click', ()=>{
    if(snapped) return;
    angle = angle===0 ? 180 : 0;
    movable.style.transition='transform .5s ease';
    applyTransform();
    setTimeout(()=>movable.style.transition='',520);
  });

  function toSvgPoint(clientX,clientY){
    const pt = svg.createSVGPoint();
    pt.x=clientX; pt.y=clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  movable.addEventListener('pointerdown',(e)=>{
    if(snapped) return;
    e.preventDefault();
    dragging=true;
    movable.setPointerCapture(e.pointerId);
    const p = toSvgPoint(e.clientX,e.clientY);
    start = {x:p.x-tx, y:p.y-ty};
    setStatus('놓으면 위치를 확인할게요…','wait');
  });
  movable.addEventListener('pointermove',(e)=>{
    if(!dragging) return;
    const p = toSvgPoint(e.clientX,e.clientY);
    tx = p.x-start.x; ty = p.y-start.y;
    applyTransform();
  });
  function endDrag(){
    if(!dragging) return;
    dragging=false;
    const dist = Math.hypot(tx-reqTx, ty-reqTy);
    if(angle===180 && dist<45){
      tx=reqTx; ty=reqTy;
      movable.style.transition='transform .35s ease';
      applyTransform();
      snapped=true;
      movable.classList.remove('movable');
      setStatus('정확히 포개졌어요! 두 삼각형은 합동입니다 🎉','ok');
      doneFlags.overlap = true;
      renderProgress(); updateNav();
    } else if(angle!==180){
      setStatus('방향이 안 맞아요. 회전 버튼을 눌러보세요!','bad');
    } else {
      setStatus('조금만 더 가까이 옮겨보세요!','bad');
    }
  }
  movable.addEventListener('pointerup', endDrag);
  movable.addEventListener('pointercancel', endDrag);

  renderProgress(); updateNav();
}

/* =====================================================================
   Q1 : find equal sides
===================================================================== */
function renderQ1(){
  setViewBox('0 0 800 300');
  clearScene();
  panel.innerHTML = `
    <div class="eyebrow">생각해보기 1</div>
    <h2>길이가 같은 변을 모두 찾아보자</h2>
    <p>평행사변형 ABCD는 대각선 ${ol('AC')}를 따라 자른 두 삼각형(초록 △ABC, 주황 △ACD)을 붙인 모양이에요. 두 삼각형이 합동이었다는 걸 떠올리며, <b>같은 길이</b>라고 생각하는 두 변을 순서대로 클릭해 보세요.</p>
    <div class="found-list" id="foundList"></div>
    <div class="status-line idle" id="statusBox">두 변을 선택해 보세요.</div>
  `;
  statusBox = document.getElementById('statusBox');
  const foundListEl = document.getElementById('foundList');

  // show the parallelogram as its two triangle pieces glued back together
  el('polygon',{points:pts([A,B,C]),fill:'var(--paper-soft)',stroke:'none'},sceneRoot);
  el('polygon',{points:pts([A,C,D]),fill:'#FFEEE3',stroke:'none'},sceneRoot);
  el('line',{x1:A.x,y1:A.y,x2:C.x,y2:C.y,stroke:'#B9A38F','stroke-width':2,'stroke-dasharray':'6 5'},sceneRoot);
  const g = el('g',{},sceneRoot);
  labelAt(g,{x:A.x-16,y:A.y-8},'A');
  labelAt(g,{x:B.x-18,y:B.y+22},'B');
  labelAt(g,{x:C.x+18,y:C.y+22},'C');
  labelAt(g,{x:D.x+18,y:D.y-8},'D');

  const sides = [
    {id:'AB', p1:A, p2:B},
    {id:'BC', p1:B, p2:C},
    {id:'CD', p1:C, p2:D},
    {id:'DA', p1:D, p2:A},
  ];
  const correctPairs = [['AB','CD'],['BC','DA']];
  const lines = {};
  sides.forEach(s=>{
    const grp = el('g',{},g);
    el('line',{x1:s.p1.x,y1:s.p1.y,x2:s.p2.x,y2:s.p2.y,class:'sideLine',id:'line-'+s.id},grp);
    el('line',{x1:s.p1.x,y1:s.p1.y,x2:s.p2.x,y2:s.p2.y,class:'sideHit'},grp).addEventListener('click',()=>select(s.id));
    lines[s.id]=document.getElementById('line-'+s.id);
  });

  let selected=null; const found=[];
  function isCorrectPair(a,b){ return correctPairs.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a)); }
  function alreadyFound(a,b){ return found.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a)); }

  function select(id){
    if(found.flat().includes(id)) return;
    if(!selected){
      selected=id;
      lines[id].classList.add('sel');
      setStatus(ol(id)+' 변을 선택했어요. 짝이 되는 변을 골라보세요.','wait');
      return;
    }
    if(selected===id){ return; }
    if(isCorrectPair(selected,id) && !alreadyFound(selected,id)){
      lines[selected].classList.remove('sel'); lines[selected].classList.add('correct');
      lines[id].classList.add('correct');
      found.push([selected,id]);
      const item=document.createElement('div');
      item.className='found-item';
      item.innerHTML = `✔ ${ol(selected)} = ${ol(id)}`;
      foundListEl.appendChild(item);
      setStatus('맞아요! 두 변의 길이가 같아요.','ok');
      selected=null;
      if(found.length===correctPairs.length){
        doneFlags.q1=true;
        const box=document.createElement('div');
        box.className='conclusion-box';
        box.innerHTML=`정리: 평행사변형에서 마주 보는 두 변의 길이는 서로 같다. (${ol('AB')} = ${ol('CD')}, ${ol('BC')} = ${ol('DA')})`;
        panel.appendChild(box);
        renderProgress(); updateNav();
      }
    } else {
      lines[selected].classList.add('sel');
      setStatus('음, 그 두 변은 길이가 다를 것 같아요. 다시 선택해 보세요.','bad');
      setTimeout(()=>{ if(lines[selected])lines[selected].classList.remove('sel'); },550);
      selected=null;
    }
  }

  renderProgress(); updateNav();
}

===================================================================== */
function renderQ2(){
  setViewBox('0 0 800 300');
  clearScene();
  panel.innerHTML = `
    <div class="eyebrow">생각해보기 2</div>
    <h2>크기가 같은 각을 모두 찾아보자</h2>
    <p>평행사변형 ABCD는 대각선 ${ol('AC')}를 따라 자른 두 삼각형(초록 △ABC, 주황 △ACD)을 붙인 모양이에요. 두 삼각형이 합동이었다는 걸 떠올리며, <b>크기가 같다</b>고 생각하는 두 각을 순서대로 클릭해 보세요.</p>
    <div class="found-list" id="foundList"></div>
    <div class="status-line idle" id="statusBox">두 각을 선택해 보세요.</div>
  `;
  statusBox = document.getElementById('statusBox');
  const foundListEl = document.getElementById('foundList');

  el('polygon',{points:pts([A,B,C]),fill:'var(--paper-soft)',stroke:'none'},sceneRoot);
  el('polygon',{points:pts([A,C,D]),fill:'#FFEEE3',stroke:'none'},sceneRoot);
  el('line',{x1:A.x,y1:A.y,x2:C.x,y2:C.y,stroke:'#B9A38F','stroke-width':2,'stroke-dasharray':'6 5'},sceneRoot);
  const outline = el('polygon',{points:pts([A,B,C,D]),fill:'none',stroke:'var(--paper-line)','stroke-width':2},sceneRoot);
  const g = el('g',{},sceneRoot);

  const verts = [
    {id:'A', V:A, n1:D, n2:B, lx:A.x-18, ly:A.y-14},
    {id:'B', V:B, n1:A, n2:C, lx:B.x-20, ly:B.y+24},
    {id:'C', V:C, n1:B, n2:D, lx:C.x+18, ly:C.y+24},
    {id:'D', V:D, n1:C, n2:A, lx:D.x+18, ly:D.y-14},
  ];
  const correctPairs = [['A','C'],['B','D']];
  const wedges={};
  verts.forEach(v=>{
    const path = el('path',{d:anglePath(v.V,v.n1,v.n2,32),class:'wedge',id:'wedge-'+v.id},g);
    const hit = el('path',{d:anglePath(v.V,v.n1,v.n2,32),class:'wedgeHit'},g);
    hit.addEventListener('click',()=>select(v.id));
    wedges[v.id]=path;
    labelAt(g,{x:v.lx,y:v.ly},v.id);
  });

  let selected=null; const found=[];
  function isCorrectPair(a,b){ return correctPairs.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a)); }
  function alreadyFound(a,b){ return found.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a)); }

  function select(id){
    if(found.flat().includes(id)) return;
    if(!selected){
      selected=id;
      wedges[id].classList.add('sel');
      setStatus('∠'+id+'을(를) 선택했어요. 짝이 되는 각을 골라보세요.','wait');
      return;
    }
    if(selected===id) return;
    if(isCorrectPair(selected,id) && !alreadyFound(selected,id)){
      wedges[selected].classList.remove('sel'); wedges[selected].classList.add('correct');
      wedges[id].classList.add('correct');
      found.push([selected,id]);
      const item=document.createElement('div');
      item.className='found-item';
      item.textContent = `✔ ∠${selected} = ∠${id}`;
      foundListEl.appendChild(item);
      setStatus('정답이에요! 두 각의 크기가 같아요.','ok');
      selected=null;
      if(found.length===correctPairs.length){
        doneFlags.q2=true;
        const box=document.createElement('div');
        box.className='conclusion-box';
        box.textContent='정리: 평행사변형에서 마주 보는 두 각의 크기는 서로 같다. (∠A = ∠C, ∠B = ∠D)';
        panel.appendChild(box);
        renderProgress(); updateNav();
      }
    } else {
      wedges[selected].classList.add('sel');
      setStatus('음, 그 두 각은 크기가 다를 것 같아요. 다시 선택해 보세요.','bad');
      setTimeout(()=>{ if(wedges[selected])wedges[selected].classList.remove('sel'); },550);
      selected=null;
    }
  }

  renderProgress(); updateNav();
}
