<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기둥의 부피 탐구</title>
<style>
:root{--bg:#f3f9ff;--card:#fff;--ink:#1f3347;--sub:#5d7389;--line:#d5e5f3;--blue:#2f8fe0;--blue-soft:#e3f1fd;--mint:#2bb58f;--mint-soft:#dcf6ec;--sun:#ffb938;--sun-soft:#fff3d6;--red:#ef6a6a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Malgun Gothic",sans-serif;font-size:18px;line-height:1.9}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:28px;margin:6px 0 2px;color:var(--blue)}
.lead{color:var(--sub);margin:0 0 14px;font-size:16px;line-height:1.5}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:8px 16px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.ok:not(.on){background:var(--mint-soft);border-color:var(--mint)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.main{max-width:820px;margin:0 auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 20px}
.card h2{margin:0 0 6px;font-size:21px;color:var(--ink)}
.prog{font-size:15px;color:var(--sub);margin-bottom:8px}
.bar{height:8px;background:var(--blue-soft);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .4s}
.art{float:right;margin:0 0 6px 12px;width:130px}
p{margin:0 0 8px}
.fm{background:var(--bg);border-radius:12px;padding:6px 14px;margin:6px 0;font-size:19px}
.box{background:var(--sun-soft);border:2px solid var(--sun)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;font-size:.85em;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:2px solid currentColor}
.bl{display:inline-block;vertical-align:baseline;min-width:3.2em;text-align:center;border-bottom:3px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:0 8px;margin:0 3px;line-height:1.5;color:var(--ink)}
.bl.lock{background:#eef2f6;border-color:#c5d0da;color:#9fb0bf;letter-spacing:.08em}
.bl input::placeholder{color:#b8a67a;opacity:1;letter-spacing:.08em}
.bl.act{color:var(--ink);box-shadow:0 0 0 3px #ffd98a;background:#fffbe9;border-color:var(--sun);animation:pl 1.2s infinite}
.bl.done{color:#0c7a5c;background:var(--mint-soft);border-color:var(--mint)}
.bl input{font:inherit;color:var(--ink);background:transparent;border:0;outline:0;text-align:center;padding:0;margin:0;line-height:1.5;min-width:3em;max-width:100%}
.bl.bad{animation:sh .4s;border-color:var(--red);background:#ffe6e6}
@keyframes pl{50%{box-shadow:0 0 0 6px #ffe9b8}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.bl{animation:none!important}}
.sp2 .pj[data-j="0"]{transform:translate(30px,6px)}.sp2 .pj[data-j="1"]{transform:translate(-30px,-6px)}
.ctl{display:flex;gap:8px;margin-top:10px}
.ctl button,.next{font:inherit;font-size:16px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:12px;cursor:pointer}
.next{background:var(--mint);border-color:var(--mint);color:#fff;margin-top:8px}
.msg{min-height:26px;margin-top:8px;font-size:16px;line-height:1.4;text-align:center}
.good{color:#0c7a5c}.no{color:var(--red)}
.xb{background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;text-align:center}
.pj{transition:transform .6s cubic-bezier(.3,.8,.3,1)}
.split .pj[data-j="0"]{transform:translate(34px,0)}.split .pj[data-j="1"]{transform:translate(0,14px)}.split .pj[data-j="2"]{transform:translate(-34px,0)}
.cap{font-size:16px;line-height:1.5;color:var(--sub)}
.tb{font-size:16px;line-height:1.7;text-align:left;display:inline-block}
.rt{height:10px;background:#dbe6ef;border-radius:8px;overflow:hidden;margin:4px 0}.rt i{display:block;height:100%;background:var(--mint)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bl input:focus-visible{outline:none}
</style>
</head>
<body>
<div class="wrap">
<h1>📦 기둥의 부피 탐구</h1>
<p class="lead">노란색 빈칸에 알맞은 말을 직접 쓰고 Enter를 눌러 보세요. 맞히면 다음 빈칸으로 넘어가고, 마지막 빈칸까지 맞히면 '다음 화면으로 넘어가기' 버튼이 나타나요.</p>
<div class="tabs" id="tabs"></div>
<div class="main">
 <div class="card" id="left"></div>
</div>
</div>
<script>
const FR='<span class="fr"><i>1</i><i>2</i></span>';
const S1='<svg class="art" viewBox="0 0 130 100"><polygon points="10,30 70,30 100,10 40,10" fill="#eaf4fc" stroke="#2f8fe0" stroke-width="2"/><polygon points="10,30 70,30 70,85 10,85" fill="#f9d4d4" stroke="#2f8fe0" stroke-width="2"/><polygon points="70,30 100,10 100,65 70,85" fill="#e5ebf0" stroke="#2f8fe0" stroke-width="2"/><polygon points="10,30 70,30 40,10" fill="#f4a9a9" stroke="#ef6a6a" stroke-width="2"/><line x1="40" y1="10" x2="70" y2="85" stroke="#1f3347" stroke-width="2"/></svg>';
const S2='<svg class="art" viewBox="0 0 130 100"><polygon points="20,35 60,15 105,35 90,55 35,55" fill="#d6f2e8" stroke="#2bb58f" stroke-width="2"/><polygon points="20,35 35,55 35,88 20,68" fill="#bfe8d9" stroke="#2bb58f" stroke-width="2"/><polygon points="35,55 90,55 90,88 35,88" fill="#cdeee2" stroke="#2bb58f" stroke-width="2"/><polygon points="90,55 105,35 105,68 90,88" fill="#aee0cd" stroke="#2bb58f" stroke-width="2"/><line x1="60" y1="15" x2="35" y2="55" stroke="#2bb58f"/><line x1="60" y1="15" x2="90" y2="55" stroke="#2bb58f"/></svg>';
const S3='<svg class="art" viewBox="0 0 130 100"><path d="M20 25v55a45 14 0 0 0 90 0V25" fill="#fff7d6" stroke="#2f8fe0" stroke-width="2.5"/><ellipse cx="65" cy="25" rx="45" ry="14" fill="#fff0b3" stroke="#2f8fe0" stroke-width="2.5"/><polygon points="30,24 45,17 65,15 88,17 105,24 88,33 45,33" fill="none" stroke="#2bb58f" stroke-width="2"/></svg>';
const PARTS=[
{t:"1. 삼각기둥",q:"삼각기둥의 부피는 어떻게 구할까요?",art:'',b:
`<p>직육면체를 두 개의 삼각기둥으로 나누었을 때, 한 삼각기둥의 부피는 [[직육면체의 부피]]의 ${FR}이고, 삼각기둥의 밑넓이는 [[직육면체의 밑넓이]]의 ${FR}이다.</p>
<p>따라서 삼각기둥의 부피는 다음과 같이 구할 수 있다.</p>
<div class="fm">(삼각기둥의 부피) = ${FR} × ( [[직육면체의 부피]] )</div>
<div class="fm">= ${FR} × ( [[직육면체의 밑넓이]] ) × ( [[높이]] )</div>
<div class="fm">= ( [[삼각기둥의 밑넓이]] ) × ( [[높이]] )</div>`},
{t:"2. 각기둥",q:"각기둥의 부피는 어떻게 구할까요?",art:'',b:
`<p>사각기둥, 오각기둥, 육각기둥, …과 같은 각기둥은 여러 개의 [[삼각기둥]]으로 나눌 수 있으므로 각기둥의 부피는 나누어진 [[삼각기둥]]의 부피의 합으로 구할 수 있다.</p>
<p>이때 각기둥의 밑넓이는 나누어진 [[삼각기둥의 밑넓이]]의 합과 같으므로 각기둥의 부피는 다음과 같다.</p>
<div class="fm">(각기둥의 부피) = ( [[밑넓이]] ) × ( [[높이]] )</div>`},
{t:"3. 원기둥",q:"원기둥의 부피는 어떻게 구할까요?",art:'',b:
`<p>원기둥 안에 꼭 맞고 밑면이 정다각형인 [[각기둥]]을 만들고, 이 정다각형의 변의 개수를 한없이 늘려 가면 [[각기둥]]은 점점 더 [[원기둥]]에 가까워진다.</p>
<p>따라서 원기둥의 부피도 [[각기둥]]의 부피와 같은 방법으로 구할 수 있다.</p>
<div class="fm">(원기둥의 부피) = ( [[밑넓이]] ) × ( [[높이]] )</div>
<div class="fm box" style="text-align:center">(기둥의 부피) = ( [[밑넓이]] ) × ( [[높이]] )</div>`}
];
// 답 추출
PARTS.forEach(p=>{p.a=[];p.h=p.b.replace(/\[\[(.+?)\]\]/g,(m,w)=>{p.a.push(w);return `<span class="bl" data-i="${p.a.length-1}"></span>`})});
const $=id=>document.getElementById(id);
const nb=w=>'○'.repeat(w.replace(/ /g,'').length);
let cur=0,prog=PARTS.map(()=>0);
const done=i=>prog[i]>=PARTS[i].a.length;
function tabs(){
 $('tabs').innerHTML="";
 PARTS.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==cur?' on':'')+(done(i)?' ok':'');
  b.textContent=(done(i)?'✅ ':'')+p.t;b.disabled=i>0&&!done(i-1);b.onclick=()=>{cur=i;render()};$('tabs').appendChild(b)});
}
function render(){
 const p=PARTS[cur];
 $('left').innerHTML=`<h2>${p.q}</h2><div class="prog" id="pg"></div><div class="bar"><i id="br"></i></div>${p.art}${p.h}<div id="xt"></div><div class="msg" id="msg"></div><div id="fin"></div>`;
 tabs();paint(true);initX();
 window.scrollTo({top:0});
}
let busy=false;
function paint(focus){
 const p=PARTS[cur],n=prog[cur];
 document.querySelectorAll('#left .bl').forEach(el=>{
  const i=+el.dataset.i;
  if(i<n){el.className='bl done';el.textContent=p.a[i]}
  else if(i==n){
   if(!el.querySelector('input')){el.className='bl act';el.textContent='';el.appendChild(makeInput(i))}
  }
  else{el.className='bl lock';el.textContent=nb(p.a[i])}
 });
 $('pg').textContent=`빈칸 ${Math.min(n+1,p.a.length)} / ${p.a.length}`;
 $('br').style.width=(n/p.a.length*100)+'%';
 if(n>=p.a.length){
  const last=cur==PARTS.length-1;
  $('fin').innerHTML=last?'<div class="msg good" style="font-size:19px">🎉 모든 탐구 완료! 기둥의 부피 = 밑넓이 × 높이</div>':'<div class="msg good">🎉 잘했어요! 탐구를 마쳤어요.</div><button class="next" id="nx">다음 화면으로 넘어가기</button>';
  if(!last)$('nx').onclick=()=>{cur++;render()};
  tabs();
 }else if(focus){const inp=document.querySelector('#left .bl.act input');if(inp)inp.focus()}
}
function makeInput(i){
 const ans=PARTS[cur].a[i].replace(/ /g,''),inp=document.createElement('input');
 inp.type='text';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
 inp.setAttribute('aria-label','빈칸 '+(i+1));
 inp.style.width=(ans.length*1.25+1.4)+'em';inp.placeholder='○'.repeat(ans.length);
 const val=()=>inp.value.replace(/\s/g,'');
 const right=()=>{
  if(busy)return;busy=true;
  prog[cur]++;$('msg').innerHTML='<span class="good">⭕ 정답!</span>';
  inp.blur();busy=false;paint(true);
 };
 const wrong=()=>{
  if(busy)return;busy=true;
  const el=inp.parentNode;el.classList.add('bad');
  $('msg').innerHTML=`<span class="no">❌ 아쉬워요. 다시 도전해 보세요! 힌트: ${'○'.repeat(ans.length)}</span>`;
  setTimeout(()=>{el.classList.remove('bad');inp.value='';busy=false;inp.focus()},450);
 };
 const check=(final,composing)=>{
  const v=val();
  if(v===ans)right();
  else if(final?v.length>0:(!composing&&v.length>=ans.length))wrong();
 };
 inp.addEventListener('input',e=>check(false,e.isComposing));
 inp.addEventListener('compositionend',()=>check(false,false));
 inp.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.isComposing){e.preventDefault();check(true,false)}});
 return inp;
}
function initP1(){
 const P=[[60,62],[150,62],[195,36],[105,36]],H=60,b=P.map(v=>[v[0],v[1]+H]);
 const pt=a=>a.map(v=>v.join(',')).join(' ');
 const pg=(a,f)=>`<polygon points="${pt(a)}" fill="${f}" stroke="#2a4a66" stroke-width="1.8" stroke-linejoin="round"/>`;
 const ln=(a,c,d,w)=>`<line x1="${a[0][0]}" y1="${a[0][1]}" x2="${a[1][0]}" y2="${a[1][1]}" stroke="${c}" stroke-width="${w||1.5}"${d?' stroke-dasharray="4 3"':''}/>`;
 const pk='#f8c9c9',pk2='#f2b0b0',lb='#d7e9fa',lb2='#bcd9f3',gr='#5f7a90';
 const hid=[[P[3],b[3]],[b[3],b[0]],[b[3],b[2]]].map(e=>ln(e,gr,1)).join('');
 const cutB=ln([b[0],b[2]],gr,1);
 const mg=pg([P[0],P[1],b[1],b[0]],pk)+pg([P[1],P[2],b[2],b[1]],pk2)+pg([P[0],P[2],P[3]],lb)+pg([P[0],P[1],P[2]],pk)+hid+cutB+ln([P[0],P[2]],'#d94040',0,2.6);
 const p0=pg([P[0],P[1],b[1],b[0]],pk)+pg([P[1],P[2],b[2],b[1]],pk2)+pg([P[0],P[1],P[2]],pk)+cutB;
 const p1=pg([P[0],P[2],b[2],b[0]],lb2)+pg([P[0],P[2],P[3]],lb)+hid;
 $('xt').innerHTML=`<div class="xb"><svg id="ps" viewBox="0 0 260 150" style="width:100%;max-width:340px;cursor:pointer" role="button" tabindex="0" aria-label="직육면체 그림: 누르면 삼각기둥 2개로 나뉘고 다시 누르면 합쳐집니다"><g id="mg" style="transition:opacity .15s">${mg}</g><g id="sg" style="opacity:0"><g class="pj" data-j="1">${p1}</g><g class="pj" data-j="0">${p0}</g></g></svg><div class="cap" id="pc">👆 직육면체 그림을 눌러 보세요! (점선은 보이지 않는 모서리, 빨간 선은 자르는 선)</div></div>`;
 const ps=$('ps'),mgE=$('mg'),sgE=$('sg');
 const tg=()=>{const sp=ps.classList.toggle('sp2');
  if(sp){sgE.style.opacity=1;mgE.style.opacity=0}else setTimeout(()=>{if(!ps.classList.contains('sp2')){mgE.style.opacity=1;sgE.style.opacity=0}},650);
  $('pc').innerHTML=sp?'직육면체가 <b>삼각기둥 2개</b>로 나뉘었어요.<br>삼각기둥 1개의 부피는 직육면체 부피의 ½이에요. 다시 누르면 합쳐져요':'합쳐진 직육면체예요. 다시 눌러 나눠 보세요!'};
 ps.onclick=tg;ps.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();tg()}};
}
function initP2(){
 const R=60,cx=130,cy=44,H=66,K=.35;
 const pl=[0,1,2,3,4].map(i=>{const a=(-90+72*i)*Math.PI/180;return[R*Math.cos(a),R*Math.sin(a)]});
 const T=pl.map(p=>[+(cx+p[0]).toFixed(1),+(cy+K*p[1]).toFixed(1)]),B=T.map(v=>[v[0],+(v[1]+H).toFixed(1)]);
 const pt=a=>a.map(v=>v.join(',')).join(' ');
 const pg=(a,f)=>`<polygon points="${pt(a)}" fill="${f}" stroke="#2a4a66" stroke-width="1.7" stroke-linejoin="round"/>`;
 const ln=(a,b,d,c,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c||'#5f7a90'}" stroke-width="${w||1.4}"${d?' stroke-dasharray="4 3"':''}/>`;
 const fc=['#bfe8d9','#cfe5fb','#ffe7b0'],fd=['#a6dcc8','#b4d3f2','#fbd88a'];
 const TRI=[[0,1,2],[0,2,3],[0,3,4]];
 const prism=(t,j)=>{
  const cen=[0,1].map(k=>t.reduce((s,i)=>s+pl[i][k],0)/3);
  const ed=[[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]].map(e=>{const u=pl[e[0]],v=pl[e[1]];let nx=v[1]-u[1],ny=-(v[0]-u[0]);const mx=(u[0]+v[0])/2-cen[0],my=(u[1]+v[1])/2-cen[1];if(nx*mx+ny*my<0){nx=-nx;ny=-ny}return{e,vis:ny>0.01}});
  let s='',h='';
  ed.filter(x=>x.vis).sort((p,q)=>(T[p.e[0]][1]+T[p.e[1]][1])-(T[q.e[0]][1]+T[q.e[1]][1])).forEach(x=>{s+=pg([T[x.e[0]],T[x.e[1]],B[x.e[1]],B[x.e[0]]],fd[j])});
  s+=pg(t.map(i=>T[i]),fc[j]);
  ed.forEach(x=>{if(!x.vis)h+=ln(B[x.e[0]],B[x.e[1]],1)});
  t.forEach((v,k)=>{if(!ed[k].vis&&!ed[(k+2)%3].vis)h+=ln(T[v],B[v],1)});
  return s+h};
 const mg=[[1,2],[2,3],[3,4]].map(e=>pg([T[e[0]],T[e[1]],B[e[1]],B[e[0]]],'#dff3ea')).join('')+TRI.map((t,j)=>pg(t.map(i=>T[i]),fc[j])).join('')+ln(T[0],B[0],1)+ln(B[4],B[0],1)+ln(B[0],B[1],1)+ln(B[0],B[2],1)+ln(B[0],B[3],1)+ln(T[0],T[2],0,'#d94040',2.4)+ln(T[0],T[3],0,'#d94040',2.4);
 const sg=[0,2,1].map(j=>`<g class="pj" data-j="${j}">${prism(TRI[j],j)}</g>`).join('');
 $('xt').innerHTML=`<div class="xb"><svg id="ps" viewBox="0 0 260 150" style="width:100%;max-width:340px;cursor:pointer" role="button" tabindex="0" aria-label="오각기둥 그림: 누르면 삼각기둥 3개로 나뉘고 다시 누르면 합쳐집니다"><g id="mg">${mg}</g><g id="sg" style="opacity:0">${sg}</g></svg><div class="cap" id="pc">👆 오각기둥 그림을 눌러 보세요! (점선은 보이지 않는 모서리, 빨간 선은 자르는 선)</div></div>`;
 const ps=$('ps'),mgE=$('mg'),sgE=$('sg');
 const tg=()=>{const sp=ps.classList.toggle('split');
  if(sp){sgE.style.opacity=1;mgE.style.opacity=0}else setTimeout(()=>{if(!ps.classList.contains('split')){mgE.style.opacity=1;sgE.style.opacity=0}},650);
  $('pc').innerHTML=sp?'오각기둥이 <b>삼각기둥 3개</b>로 나뉘었어요.<br>(각기둥의 부피) = (삼각기둥 3개의 부피의 합) · 다시 누르면 합쳐져요':'합쳐진 오각기둥이에요. 다시 눌러 나눠 보세요!'};
 ps.onclick=tg;ps.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();tg()}};
}
function initX(){
 const x=$('xt');
 if(cur==0){initP1();return}
 if(0){
  const T=[[60,62],[150,62],[195,36],[105,36]],H=60,col=['#f8c9c9','#cfe5fb'],st=['#ef6a6a','#2f8fe0'];
  const pt=a=>a.map(v=>v.join(',')).join(' ');
  let g='';
  [[0,1,2],[0,2,3]].forEach((t,j)=>{
   let s='';
