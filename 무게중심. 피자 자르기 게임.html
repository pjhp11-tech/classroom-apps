<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피자 자르기 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tomato:#E2574C;
    --tomato-deep:#C1453B;
    --dough:#FFF3D6;
    --dough-dim:#FBE6B8;
    --basil:#6FAE5C;
    --basil-deep:#4F8C3F;
    --charcoal:#3A2E22;
    --gold:#F0B429;
    --cream-white:#FFFDF7;
    --check-a:#FFF9EA;
    --check-b:#FFE9AE;
    --crust:#E8B872;
    --crust-dark:#C98A3B;
    --cheese:#FFDD70;
    --sky:#7FC7E0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:
      repeating-linear-gradient(45deg, var(--check-a) 0 40px, var(--check-b) 40px 80px);
    font-family:'Space Grotesk', sans-serif;
    color:var(--charcoal);
  }
  #stage{
    width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 1.4vh 2vw;
  }

  /* ---------- HEADER ---------- */
  #header{
    width:100%; max-width:1100px;
    display:flex; align-items:center; justify-content:space-between;
    flex:0 0 auto;
    padding-bottom: 1vh;
    gap: 10px;
  }
  #titleblock{ display:flex; align-items:center; gap:10px; }
  #titleblock h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size: clamp(20px, 3vh, 32px);
    color:var(--tomato-deep);
    margin:0;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
    letter-spacing:0.5px;
  }
  #modeBadge{
    font-size: clamp(11px, 1.4vh, 13px);
    font-weight:700;
    background: var(--gold);
    color: var(--charcoal);
    border: 2px solid var(--charcoal);
    border-radius: 20px;
    padding: 4px 12px;
    white-space:nowrap;
  }
  #roundDots{
    display:flex; gap:6px;
  }
  .dot{
    width: clamp(14px, 1.8vh, 20px); height: clamp(14px, 1.8vh, 20px);
    border-radius:50%;
    background: rgba(58,46,34,0.12);
    border:2px solid rgba(58,46,34,0.3);
    transition: transform 0.2s;
  }
  .dot.active{ border-color: var(--gold); transform:scale(1.2); }
  .dot.great{ background: var(--gold); border-color: var(--gold); }
  .dot.good{ background: var(--basil); border-color: var(--basil); }
  .dot.bad{ background: var(--tomato); border-color: var(--tomato-deep); }

  /* ---------- MAIN PANEL ---------- */
  #panel{
    flex:1 1 auto;
    width:100%; max-width:1100px;
    display:flex; gap: 1.6vw;
    min-height:0;
  }

  #boardWrap{
    flex: 1 1 auto;
    min-width:0;
    background: var(--cream-white);
    border-radius: 18px;
    border: 6px solid var(--charcoal);
    box-shadow: 0 10px 0 rgba(0,0,0,0.15), inset 0 0 0 4px var(--gold);
    position:relative;
    display:flex;
    overflow:hidden;
  }
  #plate{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 50%, #fffdf5 0%, #fffdf5 55%, #f4ecd4 56%, #f4ecd4 100%);
  }
  canvas{
    position:relative;
    display:block;
    width:100%; height:100%;
    cursor: crosshair;
  }

  /* ---------- SIDE / SCORE ---------- */
  #side{
    flex:0 0 210px;
    display:flex; flex-direction:column; gap:1.2vh;
  }
  .card{
    background: var(--dough);
    border-radius:14px;
    border:4px solid var(--charcoal);
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    padding: 1.4vh 14px;
  }
  #timerCard .label, #scoreCard .label{
    font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    color: var(--tomato-deep); margin:0 0 6px;
  }
  #timerBarOuter{
    width:100%; height:14px; border-radius:8px;
    background: rgba(58,46,34,0.12);
    border:2px solid var(--charcoal);
    overflow:hidden;
  }
  #timerBarInner{
    height:100%; width:100%;
    background: linear-gradient(90deg, var(--basil), var(--gold));
    transition: width 0.05s linear;
  }
  #timerNum{
    font-family:'Space Grotesk';
    font-weight:700; font-size: 22px; margin-top:6px; text-align:right;
    color:var(--charcoal);
  }

  #pieRing{
    width: 92px; height:92px; border-radius:50%;
    margin: 6px auto 4px;
    display:flex; align-items:center; justify-content:center;
    background: conic-gradient(var(--dough-dim) 0deg 360deg);
    border: 4px solid var(--charcoal);
    position:relative;
  }
  #pieRing::after{
    content:"";
    position:absolute; width:64%; height:64%; border-radius:50%;
    background: var(--dough);
    border:2px dashed rgba(58,46,34,0.3);
  }
  #pieRingNum{
    position:relative; z-index:2;
    font-family:'Fraunces'; font-weight:900; font-size:22px;
  }
  #lastScoreLabel{
    text-align:center; font-size:12px; font-weight:600; color:var(--tomato-deep);
    margin-top:4px; min-height:15px;
  }

  #totalCard{ flex:1 1 auto; display:flex; flex-direction:column; }
  #totalNum{
    font-family:'Fraunces'; font-weight:900; font-size:34px; color:var(--tomato-deep);
    line-height:1;
  }
  #totalSub{ font-size:11px; color:#6b5a3a; margin-top:4px;}
  #avgLine{ font-size:13px; font-weight:700; margin-top:auto; padding-top:8px; border-top:2px dashed rgba(58,46,34,0.2); }

  /* ---------- MESSAGE OVERLAY on canvas ---------- */
  #canvasMsg{
    position:absolute; left:0; right:0; bottom: 4%;
    text-align:center; pointer-events:none;
    font-family:'Fraunces'; font-weight:900;
    font-size: clamp(18px, 3vh, 30px);
    color: var(--charcoal);
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    opacity:0; transition: opacity 0.25s;
  }
  #canvasMsg.show{ opacity:1; }

  #hint{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    font-size:12px; font-weight:600; color:#8a7a55;
    background:rgba(255,255,255,0.75); padding:4px 12px; border-radius:20px;
    pointer-events:none;
    max-width:88%; text-align:center;
  }

  /* ---------- FINAL OVERLAY ---------- */
  #finalOverlay{
    position:fixed; inset:0;
    background: rgba(58,46,34,0.68);
    display:none; align-items:center; justify-content:center;
    z-index:50;
  }
  #finalOverlay.show{ display:flex; }
  #finalCard{
    width:min(480px, 90vw);
    background: var(--dough);
    border-radius:20px;
    border:6px solid var(--charcoal);
    box-shadow: 0 14px 0 rgba(58,46,34,0.2);
    padding: 30px 34px;
    text-align:center;
  }
  #finalCard h2{
    font-family:'Fraunces'; font-weight:900; font-size:26px; margin:0 0 4px;
    color: var(--tomato-deep);
  }
  #finalCard .grade{
    font-family:'Fraunces'; font-weight:900; font-size:52px; margin: 10px 0;
    color: var(--basil-deep);
  }
  #finalCard .avg{
    font-size:15px; font-weight:600; color:#5a4a2e; margin-bottom:18px;
  }
  #finalBreakdown{
    display:flex; gap:6px; justify-content:center; margin-bottom:22px; flex-wrap:wrap;
  }
  #finalBreakdown div{
    width:28px; height:28px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:white;
    border:2px solid var(--charcoal);
  }
  #restartBtn{
    font-family:'Space Grotesk'; font-weight:700; font-size:15px;
    background: var(--tomato); color:white; border:3px solid var(--charcoal);
    border-radius:12px; padding:12px 26px; cursor:pointer;
    box-shadow: 0 5px 0 var(--charcoal);
  }
  #restartBtn:active{ transform: translateY(4px); box-shadow:none; }

  @media (max-height: 600px){
    #modeBadge{ display:none; }
  }

  /* ---------- TITLE SCREEN ---------- */
  #titleScreen{
    position:fixed; inset:0;
    background:
      repeating-linear-gradient(45deg, var(--check-a) 0 40px, var(--check-b) 40px 80px);
    display:flex; align-items:center; justify-content:center;
    z-index:60;
    transition: opacity 0.3s;
  }
  #titleScreen.hide{
    opacity:0; pointer-events:none;
  }
  #titleCard{
    width:min(500px, 90vw);
    background: var(--cream-white);
    border-radius:22px;
    border:6px solid var(--charcoal);
    box-shadow: 0 14px 0 rgba(58,46,34,0.18);
    padding: 32px 30px;
    text-align:center;
  }
  #titleEmoji{
    font-size: 52px;
    line-height:1;
    margin-bottom:6px;
  }
  #titleCard h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size: clamp(24px, 4vh, 36px);
    color: var(--tomato-deep);
    margin: 0 0 10px;
  }
  #titleDesc{
    font-size:13.5px; font-weight:600; color:#6b5a3a;
    line-height:1.6; margin: 0 0 20px;
  }
  #modeLabel{
    font-family:'Fraunces'; font-weight:700; font-size:15px;
    color: var(--charcoal); margin: 0 0 10px;
  }
  #modeButtons{
    display:flex; gap:10px;
  }
  .modeBtn{
    flex:1 1 0;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:'Space Grotesk';
    background: var(--dough);
    border: 3px solid var(--charcoal);
    border-radius: 14px;
    padding: 14px 8px;
    cursor:pointer;
    box-shadow: 0 4px 0 var(--charcoal);
    transition: transform 0.12s, background 0.12s;
  }
  .modeBtn:hover{ background: var(--gold); }
  .modeBtn:active{ transform: translateY(4px); box-shadow:none; }
  .modeBig{ font-weight:900; font-size:18px; color:var(--tomato-deep); }
  .modeSub{ font-weight:600; font-size:11px; color:#6b5a3a; }
</style>
</head>
<body>

<div id="titleScreen">
  <div id="titleCard">
    <div id="titleEmoji">🍕</div>
    <h1>피자 자르기 게임</h1>
    <p id="titleDesc">직선을 그어서 피자를 최대한 똑같은 넓이의 조각으로 나눠보세요!<br>총 10라운드 동안 점수를 모읍니다.</p>
    <p id="modeLabel">피자 조각 수 선택하기</p>
    <div id="modeButtons">
      <button class="modeBtn" data-pieces="2">
        <span class="modeBig">2조각</span>
        <span class="modeSub">선 1개 · 6초</span>
      </button>
      <button class="modeBtn" data-pieces="4">
        <span class="modeBig">4조각</span>
        <span class="modeSub">선 2개 · 10초</span>
      </button>
      <button class="modeBtn" data-pieces="6">
        <span class="modeBig">6조각</span>
        <span class="modeSub">선 3개 · 15초</span>
      </button>
    </div>
  </div>
</div>

<div id="stage">
  <div id="header">
    <div id="titleblock">
      <h1>🍕 피자 자르기</h1>
      <div id="modeBadge">2조각 모드</div>
    </div>
    <div id="roundDots"></div>
  </div>

  <div id="panel">
    <div id="boardWrap">
      <div id="plate"></div>
      <canvas id="cv"></canvas>
      <div id="hint">🖱️ 두 점을 클릭해 자를 선을 그으세요</div>
      <div id="canvasMsg"></div>
    </div>

    <div id="side">
      <div class="card" id="timerCard">
        <div class="label">남은 시간</div>
        <div id="timerBarOuter"><div id="timerBarInner"></div></div>
        <div id="timerNum">6.0s</div>
      </div>

      <div class="card" id="scoreCard">
        <div class="label">이번 판 점수</div>
        <div id="pieRing"><div id="pieRingNum">-</div></div>
        <div id="lastScoreLabel">첫 조각을 잘라보세요</div>
      </div>

      <div class="card" id="totalCard">
        <div class="label">누적 점수</div>
        <div id="totalNum">0</div>
        <div id="totalSub">/ 1000점 만점</div>
        <div id="avgLine">라운드 0 / 10</div>
      </div>
    </div>
  </div>
</div>

<div id="finalOverlay">
  <div id="finalCard">
    <h2>최종 결과</h2>
    <div class="grade" id="finalGrade">-</div>
    <div class="avg" id="finalAvg">평균 0점</div>
    <div id="finalBreakdown"></div>
    <button id="restartBtn">다시 도전하기</button>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const boardWrap = document.getElementById('boardWrap');
  const hint = document.getElementById('hint');
  const canvasMsg = document.getElementById('canvasMsg');
  const timerBarInner = document.getElementById('timerBarInner');
  const timerNum = document.getElementById('timerNum');
  const pieRing = document.getElementById('pieRing');
  const pieRingNum = document.getElementById('pieRingNum');
  const lastScoreLabel = document.getElementById('lastScoreLabel');
  const totalNum = document.getElementById('totalNum');
  const avgLine = document.getElementById('avgLine');
  const roundDots = document.getElementById('roundDots');
  const modeBadge = document.getElementById('modeBadge');
  const finalOverlay = document.getElementById('finalOverlay');
  const finalGrade = document.getElementById('finalGrade');
  const finalAvg = document.getElementById('finalAvg');
  const finalBreakdown = document.getElementById('finalBreakdown');
  const restartBtn = document.getElementById('restartBtn');
  const titleScreen = document.getElementById('titleScreen');

  const TOTAL_ROUNDS = 10;
  const MIN_CLICK_DIST = 14; // px, avoid degenerate double-click
  const ORD = ['첫','두','세'];
  const PIECE_COLORS = [
    'rgba(240,180,41,0.42)',
    'rgba(111,174,92,0.42)',
    'rgba(127,199,224,0.42)',
    'rgba(226,87,76,0.35)',
    'rgba(184,142,224,0.42)',
    'rgba(240,140,80,0.42)',
    'rgba(120,120,200,0.4)'
  ];

  const MODES = {
    2: { pieces:2, cuts:1, time:6,  label:'2조각 모드' },
    4: { pieces:4, cuts:2, time:10, label:'4조각 모드' },
    6: { pieces:6, cuts:3, time:15, label:'6조각 모드' },
  };
  let mode = MODES[2];

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0; // css pixel size of canvas

  let round = 0;
  let scores = [];
  let triangle = [];
  let roundActive = false;
  let timerStart = 0;
  let timerRAF = null;

  let linesDrawn = [];
  let currentClicks = [];
  let currentPolygons = [];
  let fixedPointActive = false;

  function clamp(x,a,b){ return Math.max(a, Math.min(b,x)); }

  // ---------- setup dots ----------
  function buildDots(){
    roundDots.innerHTML = '';
    for(let i=0;i<TOTAL_ROUNDS;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      roundDots.appendChild(d);
    }
  }

  function sizeCanvas(){
    const rect = boardWrap.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  // ---------- geometry helpers ----------
  function triArea(p){
    return Math.abs((p[1].x-p[0].x)*(p[2].y-p[0].y) - (p[2].x-p[0].x)*(p[1].y-p[0].y)) / 2;
  }
  function polyArea(poly){
    if(poly.length < 3) return 0;
    let s = 0;
    for(let i=0;i<poly.length;i++){
      const a = poly[i], b = poly[(i+1)%poly.length];
      s += a.x*b.y - b.x*a.y;
    }
    return Math.abs(s)/2;
  }
  function polyCentroid(poly){
    let a = 0, cx = 0, cy = 0;
    for(let i=0;i<poly.length;i++){
      const p0 = poly[i], p1 = poly[(i+1)%poly.length];
      const cross = p0.x*p1.y - p1.x*p0.y;
      a += cross;
      cx += (p0.x+p1.x)*cross;
      cy += (p0.y+p1.y)*cross;
    }
    a *= 0.5;
    if(Math.abs(a) < 1e-6){
      let sx=0, sy=0;
      poly.forEach(p=>{ sx+=p.x; sy+=p.y; });
      return { x: sx/poly.length, y: sy/poly.length };
    }
    return { x: cx/(6*a), y: cy/(6*a) };
  }
  function crossSign(p1,p2,p){
    return (p2.x-p1.x)*(p.y-p1.y) - (p2.y-p1.y)*(p.x-p1.x);
  }
  function segIntersect(p1,p2,a,b){
    const d1x = p2.x-p1.x, d1y = p2.y-p1.y;
    const d2x = b.x-a.x, d2y = b.y-a.y;
    const denom = d1x*d2y - d1y*d2x;
    if (Math.abs(denom) < 1e-9) return b;
    const t = ((a.x-p1.x)*d2y - (a.y-p1.y)*d2x) / denom;
    return { x: p1.x + t*d1x, y: p1.y + t*d1y };
  }
  function clipHalf(poly, p1, p2, keepPositive){
    const out = [];
    const n = poly.length;
    for(let i=0;i<n;i++){
      const curr = poly[i], next = poly[(i+1)%n];
      const cs = crossSign(p1,p2,curr);
      const ns = crossSign(p1,p2,next);
      const currIn = keepPositive ? cs >= 0 : cs <= 0;
      const nextIn = keepPositive ? ns >= 0 : ns <= 0;
      if(currIn) out.push(curr);
      if(currIn !== nextIn){
        out.push(segIntersect(p1,p2,curr,next));
      }
    }
    return out;
  }
  function lineIntersect(p1,p2,p3,p4){
    const d1x=p2.x-p1.x, d1y=p2.y-p1.y;
    const d2x=p4.x-p3.x, d2y=p4.y-p3.y;
    const denom = d1x*d2y - d1y*d2x;
    if(Math.abs(denom) < 1e-9) return null;
    const t = ((p3.x-p1.x)*d2y - (p3.y-p1.y)*d2x) / denom;
    return { x: p1.x + t*d1x, y: p1.y + t*d1y };
  }
  function insetPolygon(poly, offsets){
    const n = poly.length;
    const off = Array.isArray(offsets) ? offsets : new Array(n).fill(offsets);
    const centroid = poly.reduce((acc,p)=>({x:acc.x+p.x/n, y:acc.y+p.y/n}), {x:0,y:0});
    const offsetLines = [];
    for(let i=0;i<n;i++){
      const p1 = poly[i], p2 = poly[(i+1)%n];
      const ex = p2.x-p1.x, ey = p2.y-p1.y;
      const len = Math.hypot(ex,ey) || 1;
      let nx = -ey/len, ny = ex/len;
      const midx = (p1.x+p2.x)/2, midy = (p1.y+p2.y)/2;
      const toCx = centroid.x-midx, toCy = centroid.y-midy;
      if(nx*toCx + ny*toCy < 0){ nx = -nx; ny = -ny; }
      const d = off[i];
      offsetLines.push({p1:{x:p1.x+nx*d, y:p1.y+ny*d}, p2:{x:p2.x+nx*d, y:p2.y+ny*d}});
    }
    const out = [];
    for(let i=0;i<n;i++){
      const lineA = offsetLines[(i-1+n)%n];
      const lineB = offsetLines[i];
      const ip = lineIntersect(lineA.p1, lineA.p2, lineB.p1, lineB.p2);
      out.push(ip || poly[i]);
    }
    return out;
  }
  function cutPolygonsByLine(polygons, p1, p2){
    const result = [];
    polygons.forEach(poly=>{
      const A = clipHalf(poly,p1,p2,true);
      const B = clipHalf(poly,p1,p2,false);
      if(polyArea(A) > 1) result.push(A);
      if(polyArea(B) > 1) result.push(B);
    });
    return result.length ? result : polygons;
  }

  // ---------- triangle generation ----------
  function randomTriangle(){
    const margin = Math.min(W,H) * 0.10;
    const minArea = W*H*0.16;
    let pts, area, tries = 0;
    do {
      pts = [
        {x: margin + Math.random()*(W-2*margin), y: margin + Math.random()*(H-2*margin)},
        {x: margin + Math.random()*(W-2*margin), y: margin + Math.random()*(H-2*margin)},
        {x: margin + Math.random()*(W-2*margin), y: margin + Math.random()*(H-2*margin)},
      ];
      area = triArea(pts);
      tries++;
    } while(area < minArea && tries < 60);
    return pts;
  }

  // ---------- drawing ----------
  function clearCanvas(){
    ctx.clearRect(0,0,W,H);
  }

  function drawTriangleOutline(pts, fillColor, strokeColor, lw){
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    if(fillColor){ ctx.fillStyle = fillColor; ctx.fill(); }
    if(strokeColor){ ctx.strokeStyle = strokeColor; ctx.lineWidth = lw||3; ctx.stroke(); }
  }

  function drawPepperoniAt(x,y,s){
    ctx.beginPath();
    ctx.fillStyle = '#E2574C';
    ctx.arc(x,y, s*0.019, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = '#C1453B';
    ctx.arc(x,y, s*0.007, 0, Math.PI*2);
    ctx.fill();
    // little grease-blister texture dots
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.arc(x-s*0.006, y-s*0.006, s*0.003, 0, Math.PI*2);
    ctx.fill();
  }
  function drawOliveAt(x,y,s){
    const r = s*0.014;
    ctx.beginPath();
    ctx.ellipse(x,y, r, r*0.82, 0, 0, Math.PI*2);
    ctx.fillStyle = '#3A2E22';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x,y, r*0.42, r*0.32, 0, 0, Math.PI*2);
    ctx.fillStyle = '#FFDD70';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x-r*0.28, y-r*0.28, r*0.5, r*0.3, 0.4, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  function drawPepperAt(x,y,s,angle,colorIdx){
    const palette = [ ['#6FAE5C','#4F8C3F'], ['#E2574C','#A8362C'], ['#F0B429','#C98A3B'] ];
    const c = palette[colorIdx % palette.length];
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    const w = s*0.034, h = s*0.011;
    ctx.beginPath();
    ctx.moveTo(-w/2, 0);
    ctx.quadraticCurveTo(0, -h*1.9, w/2, 0);
    ctx.quadraticCurveTo(0, h*1.9, -w/2, 0);
    ctx.closePath();
    ctx.fillStyle = c[0];
    ctx.fill();
    ctx.strokeStyle = c[1];
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.restore();
  }
  function drawPizzaTexture(pts){
    const OUTLINE = '#3A2E22';
    const CRUST = '#E8B872';
    const CRUST_DARK = '#C98A3B';
    const CHEESE = '#FFDD70';

    // crust only on the longest edge (the pizza's outer rim); other two
    // edges are "cut" edges from the center, so no dough there
    const area = triArea(pts);
    const sideLens = [0,1,2].map(i=>{
      const a = pts[i], b = pts[(i+1)%3];
      return Math.hypot(b.x-a.x, b.y-a.y);
    });
    let crustEdge = 0;
    for(let i=1;i<3;i++) if(sideLens[i] > sideLens[crustEdge]) crustEdge = i;
    const maxSide = Math.max(...sideLens);
    const minAltitude = (2*area) / maxSide;
    const d = Math.max(6, Math.min(Math.min(W,H)*0.06, minAltitude*0.42));
    const offsets = [0,0,0];
    offsets[crustEdge] = d;

    const cheesePts = insetPolygon(pts, offsets);

    drawTriangleOutline(pts, CRUST, OUTLINE, 5);
    drawTriangleOutline(cheesePts, CHEESE, CRUST_DARK, 3);

    // pepperoni, clipped to the cheese area only
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cheesePts[0].x, cheesePts[0].y);
    for(let i=1;i<cheesePts.length;i++) ctx.lineTo(cheesePts[i].x, cheesePts[i].y);
    ctx.closePath();
    ctx.clip();
    let seed = round * 999 + 17;
    function rnd(){ seed = (seed*1103515245+12345) & 0x7fffffff; return (seed % 1000)/1000; }
    const A = cheesePts[0], B = cheesePts[1], C = cheesePts[2];
    const minDim = Math.min(W,H);
    // 삼각형 전체 면적에 고르게 퍼지도록 바리센트릭 격자(라티스) 위에
    // 토핑을 배치하고, 각 격자점을 살짝 흔들어(jitter) 자연스럽게 만든다.
    const n = 4; // (n+1)(n+2)/2 = 15개의 격자점
    for(let i=0; i<=n; i++){
      for(let j=0; j<=n-i; j++){
        const k = n - i - j;
        // 셀 크기만큼 바리센트릭 좌표를 흔들어 완전한 격자처럼 보이지 않게 함
        const jitter = 1/(n*2.2);
        let u = i/n + (rnd()-0.5)*jitter;
        let v = j/n + (rnd()-0.5)*jitter;
        let w = k/n + (rnd()-0.5)*jitter;
        u = Math.max(0.02, u); v = Math.max(0.02, v); w = Math.max(0.02, w);
        const sum = u+v+w;
        u/=sum; v/=sum; w/=sum;
        // 가끔 한두 개를 건너뛰어 너무 기계적인 느낌을 줄임 (밀도는 유지)
        if(rnd() < 0.08) continue;
        const x = u*A.x + v*B.x + w*C.x;
        const y = u*A.y + v*B.y + w*C.y;
        const roll = rnd();
        const angle = rnd()*Math.PI*2;
        const colorIdx = Math.floor(rnd()*3);
        if(roll < 0.35) drawPepperoniAt(x,y,minDim);
        else if(roll < 0.65) drawOliveAt(x,y,minDim);
        else drawPepperAt(x,y,minDim,angle,colorIdx);
      }
    }
    ctx.restore();
    drawTriangleOutline(pts, null, OUTLINE, 5);
  }

  function drawPieceLabels(polygons, totalArea){
    if(totalArea < 1e-6) return;
    polygons.forEach(poly=>{
      const c = polyCentroid(poly);
      const pct = Math.round((polyArea(poly)/totalArea)*100);
      const text = pct + '%';
      ctx.save();
      ctx.font = "700 15px 'Fraunces', serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(text).width;
      const padX = 9, padY = 6;
      const bw = tw + padX*2, bh = 15 + padY*2;
      const rx = c.x - bw/2, ry = c.y - bh/2, r = 9;
      ctx.beginPath();
      ctx.moveTo(rx+r, ry);
      ctx.arcTo(rx+bw, ry, rx+bw, ry+bh, r);
      ctx.arcTo(rx+bw, ry+bh, rx, ry+bh, r);
      ctx.arcTo(rx, ry+bh, rx, ry, r);
      ctx.arcTo(rx, ry, rx+bw, ry, r);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,253,247,0.94)';
      ctx.fill();
      ctx.strokeStyle = '#3A2E22';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#3A2E22';
      ctx.fillText(text, c.x, c.y+1);
      ctx.restore();
    });
  }

  function drawExtendedLine(p1, p2){
    ctx.beginPath();
    const dx = p2.x-p1.x, dy = p2.y-p1.y;
    const len = Math.hypot(dx,dy) || 1;
    const ux = dx/len, uy = dy/len;
    const ext = Math.max(W,H)*1.5;
    ctx.moveTo(p1.x-ux*ext, p1.y-uy*ext);
    ctx.lineTo(p2.x+ux*ext, p2.y+uy*ext);
    ctx.strokeStyle = '#3A2E22';
    ctx.lineWidth = 4;
    ctx.setLineDash([10,6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawScene(){
    clearCanvas();
    drawPizzaTexture(triangle);
    if(currentPolygons.length > 1){
      currentPolygons.forEach((poly,i)=>{
        drawTriangleOutline(poly, PIECE_COLORS[i%PIECE_COLORS.length], null);
      });
      drawTriangleOutline(triangle, null, '#3A2E22', 5);
    }
    linesDrawn.forEach(line=> drawExtendedLine(line.p1, line.p2));

    currentClicks.forEach((p,i)=>{
      const isFixed = fixedPointActive && i===0 && linesDrawn.length===2;
      ctx.beginPath();
      ctx.arc(p.x,p.y, isFixed?9:6, 0, Math.PI*2);
      ctx.fillStyle = isFixed ? '#F0B429' : '#3A2E22';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x,p.y, isFixed?13:9, 0, Math.PI*2);
      ctx.strokeStyle = isFixed ? '#3A2E22' : '#F0B429';
      ctx.lineWidth = 3;
      ctx.stroke();
    });
  }

  function drawFinalResult(){
    clearCanvas();
    drawPizzaTexture(triangle);
    currentPolygons.forEach((poly,i)=>{
      drawTriangleOutline(poly, PIECE_COLORS[i%PIECE_COLORS.length], null);
    });
    drawTriangleOutline(triangle, null, '#3A2E22', 5);
    linesDrawn.forEach(line=> drawExtendedLine(line.p1, line.p2));
    drawPieceLabels(currentPolygons, triArea(triangle));
  }

  // ---------- timer ----------
  function startTimer(limitSeconds){
    timerStart = performance.now();
    cancelAnimationFrame(timerRAF);
    function tick(now){
      const elapsed = (now - timerStart)/1000;
      const remain = Math.max(0, limitSeconds - elapsed);
      const pct = (remain/limitSeconds)*100;
      timerBarInner.style.width = pct + '%';
      timerNum.textContent = remain.toFixed(1) + 's';
      if(remain <= 0){
        onTimeout();
        return;
      }
      if(roundActive) timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }
  function stopTimer(){
    cancelAnimationFrame(timerRAF);
  }

  // ---------- scoring ----------
  function computeScore(polygons, totalArea, targetPieces){
    if(totalArea < 1e-6) return 0;
    const ideal = totalArea / targetPieces;
    let deviation = 0;
    polygons.forEach(p => { deviation += Math.abs(polyArea(p) - ideal); });
    const missing = Math.max(0, targetPieces - polygons.length);
    deviation += missing * ideal;
    const ratio = deviation / totalArea;
    return Math.round(clamp(100*(1-ratio), 0, 100));
  }

  function scoreTierClass(s){
    if(s >= 90) return 'great';
    if(s >= 60) return 'good';
    return 'bad';
  }
  function scoreColor(s){
    if(s >= 90) return '#F0B429';
    if(s >= 60) return '#6FAE5C';
    return '#E2574C';
  }
  function scoreLabel(s){
    if(s >= 97) return '완벽하게 잘랐어요! 🔪✨';
    if(s >= 85) return '거의 정확해요!';
    if(s >= 60) return '나쁘지 않아요';
    if(s >= 20) return '많이 빗나갔어요';
    return '조각을 제대로 못 나눴어요 😵';
  }

  function updateSideForRoundResult(s){
    pieRing.style.background = `conic-gradient(${scoreColor(s)} ${s*3.6}deg, var(--dough-dim) ${s*3.6}deg 360deg)`;
    pieRingNum.textContent = s;
    lastScoreLabel.textContent = scoreLabel(s);

    const total = scores.reduce((a,b)=>a+b,0);
    totalNum.textContent = total;
    const avg = scores.length ? (total/scores.length) : 0;
    avgLine.textContent = `라운드 ${scores.length} / ${TOTAL_ROUNDS} · 평균 ${avg.toFixed(1)}점`;

    const dots = roundDots.children;
    if(dots[scores.length-1]){
      dots[scores.length-1].classList.remove('active');
      dots[scores.length-1].classList.add(scoreTierClass(s));
    }
  }

  function finishRound(){
    roundActive = false;
    stopTimer();
    const s = computeScore(currentPolygons, triArea(triangle), mode.pieces);
    scores.push(s);
    drawFinalResult();
    updateSideForRoundResult(s);
    canvasMsg.textContent = `${s}점 — ${scoreLabel(s)}`;
    canvasMsg.classList.add('show');
    hint.style.opacity = '0';
    setTimeout(()=>{
      canvasMsg.classList.remove('show');
      nextRound();
    }, 1400);
  }

  function onTimeout(){
    finishRound();
  }

  function updateLineHint(){
    if(mode.cuts === 1){
      hint.textContent = '🖱️ 두 점을 클릭해 자를 선을 그으세요';
      return;
    }
    const nextIndex = linesDrawn.length; // 0-based index of the line being drawn now
    if(mode.pieces === 6 && nextIndex === 2){
      if(fixedPointActive){
        hint.textContent = '⚡ 앞선 두 선의 교점에서 시작해요 — 점 하나만 더 찍으세요';
      } else {
        hint.textContent = '두 선이 평행이라 교점이 없어요! 세 번째 선의 두 점을 새로 찍으세요';
      }
      return;
    }
    const ordWord = ORD[nextIndex] || (nextIndex+1)+'번째';
    hint.textContent = `🖱️ ${ordWord} 번째 선을 그으세요 (두 점 클릭) · 총 ${mode.cuts}개`;
  }

  function completeLine(){
    const line = { p1: currentClicks[0], p2: currentClicks[1] };
    linesDrawn.push(line);
    currentPolygons = cutPolygonsByLine(currentPolygons, line.p1, line.p2);

    if(linesDrawn.length >= mode.cuts){
      finishRound();
      return;
    }

    currentClicks = [];
    fixedPointActive = false;
    if(mode.pieces === 6 && linesDrawn.length === 2){
      const l0 = linesDrawn[0], l1 = linesDrawn[1];
      const ip = lineIntersect(l0.p1, l0.p2, l1.p1, l1.p2);
      if(ip){
        currentClicks = [ip];
        fixedPointActive = true;
      }
    }
    updateLineHint();
    drawScene();
  }

  // ---------- round flow ----------
  function nextRound(){
    round++;
    if(round > TOTAL_ROUNDS){
      showFinal();
      return;
    }
    linesDrawn = [];
    currentClicks = [];
    fixedPointActive = false;
    roundActive = true;
    triangle = randomTriangle();
    currentPolygons = [triangle];
    hint.style.opacity = '1';
    updateLineHint();
    const dots = roundDots.children;
    Array.from(dots).forEach(d=>d.classList.remove('active'));
    if(dots[round-1]) dots[round-1].classList.add('active');
    drawScene();
    startTimer(mode.time);
  }

  function showFinal(){
    finalOverlay.classList.add('show');
    const total = scores.reduce((a,b)=>a+b,0);
    const avg = total/scores.length;
    finalGrade.textContent = total;
    let gradeWord;
    if(avg>=95) gradeWord = '피자 장인 🍕👑';
    else if(avg>=80) gradeWord = '숙련된 셰프';
    else if(avg>=60) gradeWord = '수습 셰프';
    else if(avg>=35) gradeWord = '연습이 필요해요';
    else gradeWord = '피자집 알바 첫날';
    finalAvg.textContent = `평균 ${avg.toFixed(1)}점 · ${gradeWord}`;
    finalBreakdown.innerHTML = '';
    scores.forEach((s)=>{
      const d = document.createElement('div');
      d.style.background = scoreColor(s);
      d.textContent = s;
      finalBreakdown.appendChild(d);
    });
  }

  function resetGame(){
    round = 0;
    scores = [];
    finalOverlay.classList.remove('show');
    modeBadge.textContent = mode.label;
    buildDots();
    totalNum.textContent = '0';
    avgLine.textContent = '라운드 0 / 10';
    pieRing.style.background = 'conic-gradient(var(--dough-dim) 0deg 360deg)';
    pieRingNum.textContent = '-';
    lastScoreLabel.textContent = '첫 조각을 잘라보세요';
    sizeCanvas();
    nextRound();
  }

  // ---------- input ----------
  cv.addEventListener('click', (e)=>{
    if(!roundActive) return;
    const rect = cv.getBoundingClientRect();
    const p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    if(currentClicks.length >= 1){
      const last = currentClicks[currentClicks.length-1];
      const d = Math.hypot(p.x-last.x, p.y-last.y);
      if(d < MIN_CLICK_DIST) return; // ignore near-duplicate click
    }
    currentClicks.push(p);
    if(currentClicks.length === 2){
      completeLine();
    } else {
      drawScene();
    }
  });

  restartBtn.addEventListener('click', ()=>{
    finalOverlay.classList.remove('show');
    titleScreen.classList.remove('hide');
  });

  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = parseInt(btn.getAttribute('data-pieces'), 10);
      mode = MODES[p];
      titleScreen.classList.add('hide');
      resetGame();
    });
  });

  window.addEventListener('resize', ()=>{
    dpr = Math.max(1, window.devicePixelRatio || 1);
    sizeCanvas();
    if(roundActive) drawScene();
  });

  // ---------- boot ----------
  buildDots();
  window.addEventListener('load', ()=>{
    sizeCanvas();
  });
})();
</script>
</body>
</html>
