<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이 사각형, 평행사변형일까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#FFF3D6; --bg2:#FFE3B3; --bg3:#FFD9C7;
    --ink:#2B2438; --ink-soft:#6b6178;
    --card:#FFFDF7;
    --yes:#06A77D; --yes-soft:#DFF6EE;
    --no:#F2545B; --no-soft:#FDE6E4;
    --unknown:#6C63FF; --unknown-soft:#EAE8FF;
    --grid-line: rgba(43,36,56,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    background: radial-gradient(circle at 15% 10%, #FFF9E8 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, #FFE0D0 0%, transparent 50%),
                linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    display:flex; align-items:center; justify-content:center;
    padding:18px 14px;
    -webkit-text-size-adjust:100%;
    -webkit-overflow-scrolling:touch;
  }
  .app{width:100%; max-width:540px;}
  h1,h2,h3{font-family:'Fredoka', sans-serif; margin:0;}
  .card{
    background:var(--card);
    border-radius:24px;
    box-shadow:0 10px 0 rgba(43,36,56,0.08), 0 16px 32px rgba(43,36,56,0.10);
    border:3px solid var(--ink);
    padding:20px 22px;
    position:relative;
  }
  /* start */
  .start-emoji{font-size:40px; line-height:1; margin-bottom:4px;}
  .start-title{font-size:24px; font-weight:700; margin-bottom:8px;}
  .start-desc{font-size:14px; color:var(--ink-soft); line-height:1.5; margin-bottom:12px;}
  .rule-row{
    display:flex; align-items:flex-start;
    background:#FFF8EC; border:2px dashed #E9C98A; border-radius:14px;
    padding:9px 11px; margin-bottom:8px; font-size:12.5px; line-height:1.45;
  }
  .rule-row > *:not(:first-child){ margin-left:8px; }
  .rule-row b{font-family:'Fredoka'; font-weight:600;}
  .btn{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:16px;
    border:3px solid var(--ink); border-radius:14px; padding:11px 18px;
    cursor:pointer; background:var(--ink); color:#fff;
    box-shadow:0 5px 0 rgba(43,36,56,0.35);
    transition:transform .08s ease, box-shadow .08s ease;
    width:100%;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(43,36,56,0.35);}
  .btn-primary{margin-top:4px;}

  /* quiz */
  .top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .qcount{font-family:'Fredoka'; font-weight:600; font-size:13.5px; color:var(--ink-soft);}
  .progress-track{background:#F1E9D8; border-radius:999px; height:8px; width:100%; overflow:hidden; border:2px solid var(--ink);}
  .progress-fill{background:linear-gradient(90deg,#FFC24B,#F2545B); height:100%; border-radius:999px; transition:width .3s ease;}
  .score-pill{font-family:'Fredoka'; font-weight:600; font-size:12px; background:var(--ink); color:#fff; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .stage{
    position:relative;
    height:260px;
    height:min(48vh,320px);
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px), #FFFDF4;
    background-size:18px 18px;
    border:2px solid #EFE3C6; border-radius:16px;
    margin:8px 0 6px 0;
    display:flex; align-items:center; justify-content:center;
  }
  .stage svg{width:100%; height:100%; display:block;}
  .scale-note{text-align:center; font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;}
  .question-text{font-family:'Fredoka'; font-weight:600; font-size:18px; text-align:center; margin:2px 0 12px 0;}
  .choices{display:flex; height:64px;}
  .choices > *:not(:first-child){ margin-left:8px; }
  .choice-btn{
    flex:1; font-family:'Fredoka'; font-weight:600; font-size:15px;
    border-radius:14px; cursor:pointer; text-align:center;
    display:flex; align-items:center; justify-content:center;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .choice-btn.yes{background:var(--yes-soft); color:#046651; border:3px solid var(--yes); box-shadow:0 4px 0 #046651;}
  .choice-btn.no{background:var(--no-soft); color:#9c1f26; border:3px solid var(--no); box-shadow:0 4px 0 #9c1f26;}
  .choice-btn.unknown{background:var(--unknown-soft); color:#3b34a8; border:3px solid var(--unknown); box-shadow:0 4px 0 #3b34a8;}
  .choice-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.3);}
  .feedback-inline{
    flex:1; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka'; font-weight:700; font-size:16px; border:3px solid var(--ink);
    animation:pop .25s ease;
  }
  .feedback-inline.right{background:var(--yes-soft); color:#046651; border-color:var(--yes);}
  .feedback-inline.wrong{background:var(--no-soft); color:#9c1f26; border-color:var(--no);}
  @keyframes pop{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
  .explain-note{margin-top:7px; font-size:12.5px; color:var(--ink-soft); text-align:center; line-height:1.45; min-height:14px;}
  .explain-note b{color:var(--ink); font-family:'Fredoka'; font-weight:600;}

  /* result */
  .result-emoji{font-size:40px; text-align:center; margin-bottom:2px;}
  .result-score{font-family:'Fredoka'; font-weight:700; font-size:34px; text-align:center; margin:0;}
  .result-sub{text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:10px;}
  .result-msg{
    text-align:center; font-family:'Fredoka'; font-weight:600; font-size:14.5px;
    background:#FFF8EC; border:2px dashed #E9C98A; border-radius:14px; padding:9px; margin-bottom:12px;
  }
  .breakdown{display:flex; margin-bottom:12px;}
  .breakdown > *:not(:first-child){ margin-left:6px; }
  .bd-item{flex:1; text-align:center; border-radius:12px; padding:7px 4px; border:2px solid var(--ink);}
  .bd-item .n{font-family:'Fredoka'; font-weight:700; font-size:17px;}
  .bd-item .l{font-size:10px; color:var(--ink-soft);}
  .bd-yes{background:var(--yes-soft);} .bd-no{background:var(--no-soft);} .bd-unknown{background:var(--unknown-soft);}
  .review-grid{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-bottom:14px;}
  .dot{position:relative; width:100%; border-radius:7px; border:2px solid var(--ink); overflow:hidden;}
  .dot::before{content:''; display:block; padding-top:100%;}
  .dot span{position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; font-family:'Fredoka'; font-weight:600; font-size:10px; color:#fff;}
  .dot.right{background:var(--yes);} .dot.wrong{background:var(--no);}
</style>
</head>
<body>
<div class="app"><div class="card" id="cardRoot"></div></div>

<script>
/* ---------------------------------------------------------
   기본 유틸
--------------------------------------------------------- */
const LABELS = { yes:'맞다', no:'아니다', unknown:'모른다' };

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr){ return arr[randInt(0, arr.length-1)]; }
function fmtLen(v){
  const r = Math.round(v*10)/10;
  return (Number.isInteger(r) ? r : r.toFixed(1)) + 'cm';
}
function dist(p,q){ return Math.hypot(p[0]-q[0], p[1]-q[1]); }
function polarPoint(r, deg){ const t=deg*Math.PI/180; return [r*Math.cos(t), r*Math.sin(t)]; }

function isConvex(pts){
  const n=pts.length;
  let sign=0;
  for(let i=0;i<n;i++){
    const p0=pts[i], p1=pts[(i+1)%n], p2=pts[(i+2)%n];
    const v1=[p1[0]-p0[0], p1[1]-p0[1]];
    const v2=[p2[0]-p1[0], p2[1]-p1[1]];
    const cross = v1[0]*v2[1]-v1[1]*v2[0];
    if(Math.abs(cross)>1e-6){
      if(sign===0) sign = cross>0?1:-1;
      else if((cross>0?1:-1) !== sign) return false;
    }
  }
  return true;
}

function sideLengths(pts){
  const n=pts.length;
  return pts.map((p,i)=> dist(p, pts[(i+1)%n]));
}

function interiorAngles(pts){
  const n=pts.length;
  return pts.map((p,i)=>{
    const prev=pts[(i-1+n)%n], next=pts[(i+1)%n];
    const v1=[prev[0]-p[0], prev[1]-p[1]];
    const v2=[next[0]-p[0], next[1]-p[1]];
    const dot=v1[0]*v2[0]+v1[1]*v2[1];
    const m1=Math.hypot(v1[0],v1[1]), m2=Math.hypot(v2[0],v2[1]);
    let c=dot/(m1*m2); c=Math.max(-1,Math.min(1,c));
    return Math.acos(c)*180/Math.PI;
  });
}

function lineIntersect(p1,p2,p3,p4){
  const x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1],x3=p3[0],y3=p3[1],x4=p4[0],y4=p4[1];
  const denom = (x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(denom)<1e-9) return [(x1+x2+x3+x4)/4,(y1+y2+y3+y4)/4];
  const t = ((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/denom;
  return [x1+t*(x2-x1), y1+t*(y2-y1)];
}

function diagonalInfo(pts){
  const O = lineIntersect(pts[0],pts[2],pts[1],pts[3]);
  return { O, AO:dist(pts[0],O), OC:dist(pts[2],O), BO:dist(pts[1],O), OD:dist(pts[3],O) };
}

/* ---------------------------------------------------------
   사각형 생성기 (참인 평행사변형 / 아닌 사각형)
   꼭짓점 순서: A(0) B(1) C(2) D(3), 변i = 꼭짓점i - 꼭짓점(i+1)
   opposite side pairs: (0,2)=AB&CD, (1,3)=BC&DA
--------------------------------------------------------- */
function genParallelogramBase(){
  const AB = randInt(7,13);
  const AD = randInt(6,12);
  const theta = randInt(55,125);
  const rad = theta*Math.PI/180;
  const A=[0,0], B=[AB,0], D=[AD*Math.cos(rad), AD*Math.sin(rad)];
  const C=[B[0]+D[0]-A[0], B[1]+D[1]-A[1]];
  return { pts:[A,B,C,D], sideLen:[AB,AD,AB,AD], angleDeg:[theta,180-theta,theta,180-theta] };
}

function genConvexQuadRandom(){
  const baseAngles=[20,110,200,290];
  let pts=null;
  for(let tries=0; tries<15; tries++){
    const angs = baseAngles.map(a=> a + randInt(-20,20));
    const rs = angs.map(()=> randInt(6,11));
    const cand = angs.map((a,i)=> polarPoint(rs[i], a));
    if(isConvex(cand)){ pts=cand; break; }
    pts = cand;
  }
  return pts;
}

/* ---- YES: 실제 평행사변형, 조건 1~5 중 하나만 표시 ---- */
function genYES_Parallel(){
  const base = genParallelogramBase();
  return { pts:base.pts, sideLabels:[], angleLabels:[], parallelMarks:[0,1,2,3], diagonals:false,
    answer:'yes', explain:'두 쌍의 대변이 각각 평행해요. (조건 ①)' };
}
function genYES_SidesEqual(){
  const base = genParallelogramBase();
  const sideLabels = [0,1,2,3].map(i=>({sideIndex:i, text: fmtLen(base.sideLen[i])}));
  return { pts:base.pts, sideLabels, angleLabels:[], parallelMarks:[], diagonals:false,
    answer:'yes', explain:'두 쌍의 대변의 길이가 각각 같아요. (조건 ②)' };
}
function genYES_AnglesEqual(){
  const base = genParallelogramBase();
  const angleLabels = [0,1,2,3].map(i=>({vertexIndex:i, text: base.angleDeg[i] + '°'}));
  return { pts:base.pts, sideLabels:[], angleLabels, parallelMarks:[], diagonals:false,
    answer:'yes', explain:'두 쌍의 대각의 크기가 각각 같아요. (조건 ③)' };
}
function genYES_OnePairParallelEqual(){
  const base = genParallelogramBase();
  const sideLabels = [ {sideIndex:0, text: fmtLen(base.sideLen[0])}, {sideIndex:2, text: fmtLen(base.sideLen[2])} ];
  return { pts:base.pts, sideLabels, angleLabels:[], parallelMarks:[0,2], diagonals:false,
    answer:'yes', explain:'한 쌍의 대변이 평행하고, 그 길이도 같아요. (조건 ④)' };
}
function genYES_DiagonalsBisect(){
  const base = genParallelogramBase();
  const info = diagonalInfo(base.pts);
  const diagLabels = { AO:fmtLen(info.AO), OC:fmtLen(info.OC), BO:fmtLen(info.BO), OD:fmtLen(info.OD) };
  return { pts:base.pts, sideLabels:[], angleLabels:[], parallelMarks:[], diagonals:true, diagLabels,
    answer:'yes', explain:'두 대각선이 서로 다른 것을 이등분해요. (조건 ⑤)' };
}

/* ---- NO: 평행사변형이 될 수 없는 확실한 정보 ---- */
function genNO_SidesUnequal(){
  let pts, sides;
  for(let tries=0; tries<20; tries++){
    pts = genConvexQuadRandom();
    sides = sideLengths(pts);
    if(Math.abs(sides[0]-sides[2])>1.2 || Math.abs(sides[1]-sides[3])>1.2) break;
  }
  const sideLabels = [0,1,2,3].map(i=>({sideIndex:i, text: fmtLen(sides[i])}));
  return { pts, sideLabels, angleLabels:[], parallelMarks:[], diagonals:false,
    answer:'no', explain:'대변의 길이가 서로 달라요. 평행사변형이면 대변의 길이가 같아야 해요.' };
}
function genNO_AnglesUnequal(){
  let pts, angs;
  for(let tries=0; tries<20; tries++){
    pts = genConvexQuadRandom();
    angs = interiorAngles(pts);
    if(Math.abs(angs[0]-angs[2])>6 || Math.abs(angs[1]-angs[3])>6) break;
  }
  const angleLabels = [0,1,2,3].map(i=>({vertexIndex:i, text: Math.round(angs[i])+'°'}));
  return { pts, sideLabels:[], angleLabels, parallelMarks:[], diagonals:false,
    answer:'no', explain:'대각의 크기가 서로 달라요. 평행사변형이면 대각의 크기가 같아야 해요.' };
}
function genNO_DiagonalsNotBisect(){
  let pts, info;
  for(let tries=0; tries<20; tries++){
    pts = genConvexQuadRandom();
    info = diagonalInfo(pts);
    if(Math.abs(info.AO-info.OC)>1 || Math.abs(info.BO-info.OD)>1) break;
  }
  const diagLabels = { AO:fmtLen(info.AO), OC:fmtLen(info.OC), BO:fmtLen(info.BO), OD:fmtLen(info.OD) };
  return { pts, sideLabels:[], angleLabels:[], parallelMarks:[], diagonals:true, diagLabels,
    answer:'no', explain:'대각선이 서로를 이등분하지 않아요. 한 대각선의 두 부분 길이가 달라요.' };
}
function genNO_TrapezoidUnequalParallel(){
  const b = randInt(9,13);
  let c = randInt(5,9);
  if(Math.abs(c-b)<2) c = (b-3<3) ? b+3 : b-3;
  const h = randInt(5,8);
  const dx = randInt(-2,4);
  const A=[0,0], B=[b,0], D=[dx,h], C=[dx+c,h];
  const sideLabels = [ {sideIndex:0, text: fmtLen(b)}, {sideIndex:2, text: fmtLen(c)} ];
  return { pts:[A,B,C,D], sideLabels, angleLabels:[], parallelMarks:[0,2], diagonals:false,
    answer:'no', explain:'평행한 두 변의 길이가 서로 달라요. 평행사변형이려면 그 두 변의 길이도 같아야 해요.' };
}

/* ---- UNKNOWN: 조건 중 어느 하나도 완전히 확인되지 않음 ---- */
function genUNK_OnePairSides(){
  const b = randInt(10,14);
  const topLen = randInt(4,8);
  const h = randInt(5,8);
  const shift = (b-topLen)/2;
  const A=[0,0], B=[b,0], D=[shift,h], C=[shift+topLen,h];
  const pts=[A,B,C,D];
  const legLen = dist(A,D);
  const sideLabels = [ {sideIndex:1, text: fmtLen(dist(B,C))}, {sideIndex:3, text: fmtLen(legLen)} ];
  return { pts, sideLabels, angleLabels:[], parallelMarks:[], diagonals:false,
    answer:'unknown', explain:'한 쌍의 대변의 길이만 같아요. 나머지 정보가 없어서 평행사변형인지 알 수 없어요.' };
}
function genUNK_OnePairAngles(){
  const topH = randInt(6,8);
  const botH = randInt(3,5);
  const w = randInt(7,9);
  const A=[0, topH];
  const C=[0, -botH];
  const B=[w,0], D=[-w,0];
  const pts=[A,B,C,D];
  const angs = interiorAngles(pts);
  const angleLabels = [ {vertexIndex:1, text: Math.round(angs[1])+'°'}, {vertexIndex:3, text: Math.round(angs[3])+'°'} ];
  return { pts, sideLabels:[], angleLabels, parallelMarks:[], diagonals:false,
    answer:'unknown', explain:'한 쌍의 대각의 크기만 같아요. 나머지 정보가 없어서 평행사변형인지 알 수 없어요.' };
}
function genUNK_OnePairParallel(){
  const b = randInt(9,13);
  let c = randInt(5,9);
  if(Math.abs(c-b)<2) c = (b-3<3) ? b+3 : b-3;
  const h = randInt(5,8);
  const dx = randInt(-2,4);
  const A=[0,0], B=[b,0], D=[dx,h], C=[dx+c,h];
  return { pts:[A,B,C,D], sideLabels:[], angleLabels:[], parallelMarks:[0,2], diagonals:false,
    answer:'unknown', explain:'한 쌍의 대변이 평행하다는 것만 알아요. 길이가 같은지 몰라서 평행사변형인지 확실하지 않아요.' };
}
function genUNK_DiagonalsPartial(){
  let pts=null, info=null;
  for(let tries=0; tries<20; tries++){
    const a = randInt(6,9);
    const A=[-a,0], C=[a,0];
    const angleB = randInt(45,135);
    const rB = randInt(5,8);
    const B = polarPoint(rB, angleB);
    const t = 1.3 + Math.random()*0.5;
    const D = [-t*B[0], -t*B[1]];
    const cand = [A,B,C,D];
    if(isConvex(cand)){ pts=cand; info=diagonalInfo(cand); break; }
    pts=cand; info=diagonalInfo(cand);
  }
  const diagLabels = { AO:fmtLen(info.AO), OC:fmtLen(info.OC) };
  return { pts, sideLabels:[], angleLabels:[], parallelMarks:[], diagonals:true, diagLabels,
    answer:'unknown', explain:'한 대각선만 서로를 이등분해요. 나머지 대각선 정보가 없어서 평행사변형인지 알 수 없어요.' };
}

const YES_GENS = [genYES_Parallel, genYES_SidesEqual, genYES_AnglesEqual, genYES_OnePairParallelEqual, genYES_DiagonalsBisect];
const NO_GENS = [genNO_SidesUnequal, genNO_AnglesUnequal, genNO_DiagonalsNotBisect, genNO_TrapezoidUnequalParallel];
const UNKNOWN_GENS = [genUNK_OnePairSides, genUNK_OnePairAngles, genUNK_OnePairParallel, genUNK_DiagonalsPartial];

function generateQuestionSet(){
  const counts = shuffle(['yes','yes','yes','yes','yes','yes','yes','no','no','no','no','no','no','unknown','unknown','unknown','unknown','unknown','unknown','unknown']);
  const list = counts.map(cat=>{
    if(cat==='yes') return pick(YES_GENS)();
    if(cat==='no') return pick(NO_GENS)();
    return pick(UNKNOWN_GENS)();
  });
  return shuffle(list);
}

/* ---------------------------------------------------------
   그리기
--------------------------------------------------------- */
function rotatePointsN(points, thetaDeg){
  const t=thetaDeg*Math.PI/180;
  const n=points.length;
  const cx=points.reduce((s,p)=>s+p[0],0)/n;
  const cy=points.reduce((s,p)=>s+p[1],0)/n;
  return points.map(([x,y])=>{
    const dx=x-cx, dy=y-cy;
    return [cx+dx*Math.cos(t)-dy*Math.sin(t), cy+dx*Math.sin(t)+dy*Math.cos(t)];
  });
}
function fitToViewbox(points, VBW, VBH, margin){
  const xs=points.map(p=>p[0]), ys=points.map(p=>p[1]);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const w=(maxX-minX)||1, h=(maxY-minY)||1;
  const scale = Math.min((VBW-2*margin)/w, (VBH-2*margin)/h);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const vcx=VBW/2, vcy=VBH/2;
  return points.map(p=>[ (p[0]-cx)*scale+vcx, (p[1]-cy)*scale+vcy ]);
}
function labelBox(x,y,text){
  const w = Math.max(42, text.length*10+12);
  return `<g><rect x="${(x-w/2).toFixed(1)}" y="${(y-12).toFixed(1)}" width="${w}" height="22" rx="11" fill="#FFFDF4" stroke="#2B2438" stroke-width="1.5"></rect><text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="12.5" fill="#2B2438">${text}</text></g>`;
}
function angleMarkupQuad(i, proj, text){
  const n=4;
  const p=proj[i]; const prev=proj[(i-1+n)%n]; const next=proj[(i+1)%n];
  const v1=[prev[0]-p[0], prev[1]-p[1]]; const m1=Math.hypot(v1[0],v1[1])||1; const u1=[v1[0]/m1, v1[1]/m1];
  const v2=[next[0]-p[0], next[1]-p[1]]; const m2=Math.hypot(v2[0],v2[1])||1; const u2=[v2[0]/m2, v2[1]/m2];
  const aStart=Math.atan2(u1[1],u1[0]);
  const aEndRaw=Math.atan2(u2[1],u2[0]);
  let delta = aEndRaw-aStart;
  while(delta>Math.PI) delta-=2*Math.PI;
  while(delta<-Math.PI) delta+=2*Math.PI;
  const r=25, steps=14; let d='';
  for(let k=0;k<=steps;k++){ const a=aStart+delta*k/steps; const x=p[0]+r*Math.cos(a), y=p[1]+r*Math.sin(a); d+=(k===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' '; }
  const arc = `<path d="${d.trim()}" fill="none" stroke="#D9A441" stroke-width="2.5" stroke-linecap="round"></path>`;
  // bisector of the two edges, pointing INTO the interior angle at this vertex
  let bis=[u1[0]+u2[0], u1[1]+u2[1]];
  let blen=Math.hypot(bis[0],bis[1]);
  if(blen<1e-6){ bis=[-u1[1], u1[0]]; blen=Math.hypot(bis[0],bis[1])||1; }
  const bisDir=[bis[0]/blen, bis[1]/blen];
  // the label sits OUTSIDE the shape, along the opposite (exterior) bisector, well clear of the vertex
  const lx=p[0]-bisDir[0]*46, ly=p[1]-bisDir[1]*46;
  const txt = `<text x="${lx.toFixed(1)}" y="${(ly+4.5).toFixed(1)}" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="#B8863C">${text}</text>`;
  return arc+txt;
}
function arrowMark(pos, dirDeg){
  const s=7;
  return `<polygon points="${-s},${-s} ${s},0 ${-s},${s}" fill="#2B2438" transform="translate(${pos[0].toFixed(1)},${pos[1].toFixed(1)}) rotate(${dirDeg.toFixed(1)})"></polygon>`;
}
function arrowMarks(mid, dirDeg, count){
  let out=''; const gap=11;
  for(let k=0;k<count;k++){
    const offset=(k-(count-1)/2)*gap;
    const rad=dirDeg*Math.PI/180;
    const pos=[mid[0]+offset*Math.cos(rad), mid[1]+offset*Math.sin(rad)];
    out+=arrowMark(pos, dirDeg);
  }
  return out;
}

function buildQuadSVG(q, seedIdx){
  let pts = q.pts.map(p=>p.slice());
  pts = rotatePointsN(pts, ((seedIdx*41)%70)-35);
  const VBW=420, VBH=300, margin=80;
  const proj = fitToViewbox(pts, VBW, VBH, margin);
  const pointsStr = proj.map(p=>p.join(',')).join(' ');

  let marksSVG='';
  (q.parallelMarks||[]).forEach(sideIndex=>{
    const p1=proj[sideIndex], p2=proj[(sideIndex+1)%4];
    const mid=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
    const dirDeg = Math.atan2(p2[1]-p1[1], p2[0]-p1[0])*180/Math.PI;
    const count = (sideIndex===1||sideIndex===3) ? 2 : 1;
    marksSVG += arrowMarks(mid, dirDeg, count);
  });

  const cx=(proj[0][0]+proj[1][0]+proj[2][0]+proj[3][0])/4;
  const cy=(proj[0][1]+proj[1][1]+proj[2][1]+proj[3][1])/4;

  let diagSVG='', diagLabelsSVG='';
  if(q.diagonals){
    diagSVG = `<line x1="${proj[0][0].toFixed(1)}" y1="${proj[0][1].toFixed(1)}" x2="${proj[2][0].toFixed(1)}" y2="${proj[2][1].toFixed(1)}" stroke="#B8863C" stroke-width="2" stroke-dasharray="5,4"></line>
                <line x1="${proj[1][0].toFixed(1)}" y1="${proj[1][1].toFixed(1)}" x2="${proj[3][0].toFixed(1)}" y2="${proj[3][1].toFixed(1)}" stroke="#B8863C" stroke-width="2" stroke-dasharray="5,4"></line>`;
    const O = lineIntersect(proj[0],proj[2],proj[1],proj[3]);
    const segs = [
      {vertex:proj[0], other:O, key:'AO'},
      {vertex:proj[2], other:O, key:'OC'},
      {vertex:proj[1], other:O, key:'BO'},
      {vertex:proj[3], other:O, key:'OD'}
    ];
    segs.forEach(seg=>{
      if(q.diagLabels && q.diagLabels[seg.key]!==undefined){
        const dx=seg.other[0]-seg.vertex[0], dy=seg.other[1]-seg.vertex[1];
        const len=Math.hypot(dx,dy)||1;
        const ux=dx/len, uy=dy/len;
        const t=Math.min(len*0.42, 40);
        const bx=seg.vertex[0]+ux*t, by=seg.vertex[1]+uy*t;
        // push further AWAY from the shape's centroid (same idea as side labels) -
        // this keeps each segment's label anchored near its own corner and drifting
        // outward, rather than drifting toward whichever direction happens to be
        // perpendicular to the diagonal (which could point straight at a neighboring label).
        const odx=bx-cx, ody=by-cy; const olen=Math.hypot(odx,ody)||1;
        const ox=odx/olen, oy=ody/olen;
        const lx=bx+ox*34, ly=by+oy*34;
        diagLabelsSVG += labelBox(lx,ly,q.diagLabels[seg.key]);
      }
    });
  }

  let sideLabelsSVG='';
  (q.sideLabels||[]).forEach(sl=>{
    const p1=proj[sl.sideIndex], p2=proj[(sl.sideIndex+1)%4];
    const mid=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
    const dir0=[mid[0]-cx, mid[1]-cy]; const len=Math.hypot(dir0[0],dir0[1])||1; const dir=[dir0[0]/len,dir0[1]/len];
    const lx=mid[0]+dir[0]*28, ly=mid[1]+dir[1]*28;
    sideLabelsSVG += labelBox(lx,ly, sl.text);
  });

  let angleLabelsSVG='';
  (q.angleLabels||[]).forEach(al=>{
    angleLabelsSVG += angleMarkupQuad(al.vertexIndex, proj, al.text);
  });

  let dots='';
  proj.forEach(p=>{ dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="#2B2438"></circle>`; });

  return `<svg viewBox="0 0 ${VBW} ${VBH}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${pointsStr}" fill="#FFEFC2" stroke="#2B2438" stroke-width="4.5" stroke-linejoin="round"></polygon>
    ${diagSVG}${dots}${marksSVG}${angleLabelsSVG}${sideLabelsSVG}${diagLabelsSVG}
  </svg>`;
}

/* ---------------------------------------------------------
   상태 & 흐름
--------------------------------------------------------- */
let questions=[], current=0, score=0, userAnswers=[], answeredThis=false, startTime=0;

function startGame(){
  questions = generateQuestionSet();
  current=0; score=0; userAnswers=[];
  startTime = Date.now();
  renderQuiz();
}

function renderStart(){
  document.getElementById('cardRoot').innerHTML = `
    <div class="start-emoji">▱📐</div>
    <div class="start-title">이 사각형, 평행사변형일까?</div>
    <div class="start-desc">사각형이 하나씩 나와요. 주어진 화살표(평행 표시)·변의 길이·각의 크기·대각선 정보를 보고 평행사변형이 <b>맞는지</b>, <b>아닌지</b>, <b>알 수 없는지</b> 골라보세요.</div>
    <div class="rule-row">📏 <span><b>다음 5가지 조건 중 하나만 만족</b>해도 평행사변형이에요: ①두 쌍의 대변이 평행 ②두 쌍의 대변 길이가 같음 ③두 쌍의 대각 크기가 같음 ④한 쌍의 대변이 평행하고 길이도 같음 ⑤두 대각선이 서로 다른 것을 이등분. 그림 모양이 아니라 <b>표시된 정보</b>로만 판단하세요!</span></div>
    <div class="rule-row">🎯 <span>총 <b>20문제</b>! 다 풀면 정답률을 알려줄게요.</span></div>
    <button class="btn btn-primary" id="startBtn">게임 시작하기 →</button>
  `;
  document.getElementById('startBtn').onclick = startGame;
}

function renderQuiz(){
  answeredThis=false;
  const q = questions[current];
  const pct = Math.round((current)/questions.length*100);
  document.getElementById('cardRoot').innerHTML = `
    <div class="top-row">
      <span class="qcount">문제 ${current+1} / ${questions.length}</span>
      <span class="score-pill">맞은 개수 ${score}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="stage">${buildQuadSVG(q, current)}</div>
    <div class="scale-note">※ 그림은 참고용이에요. 표시된 화살표·길이·각도로만 판단하세요.</div>
    <div class="question-text">이 사각형은 평행사변형일까요?</div>
    <div class="choices" id="choicesRow">
      <div class="choice-btn yes" data-ans="yes">맞다</div>
      <div class="choice-btn no" data-ans="no">아니다</div>
      <div class="choice-btn unknown" data-ans="unknown">모른다</div>
    </div>
    <div class="explain-note" id="explainNote"></div>
  `;
  document.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.onclick = ()=> onAnswer(btn.dataset.ans, q);
  });
}

function onAnswer(choice, q){
  if(answeredThis) return;
  answeredThis = true;
  const correct = (choice === q.answer);
  if(correct) score++;
  userAnswers.push({correct});

  const row = document.getElementById('choicesRow');
  row.innerHTML = `<div class="feedback-inline ${correct?'right':'wrong'}">
    ${correct ? '정답이에요! 🎉' : '오답! 정답은 "'+LABELS[q.answer]+'"'}
  </div>`;
  const note = document.getElementById('explainNote');
  if(note) note.innerHTML = `<b>${LABELS[q.answer]}</b> · ${q.explain}`;

  setTimeout(()=>{
    current++;
    if(current >= questions.length) renderResult();
    else renderQuiz();
  }, 1150);
}

function formatElapsed(ms){
  const totalSec = Math.max(0, Math.round(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return m>0 ? `${m}분 ${s}초` : `${s}초`;
}

function renderResult(){
  const total = questions.length;
  const pct = Math.round(score/total*100);
  const elapsed = formatElapsed(Date.now()-startTime);
  let emoji, msg;
  if(pct>=90){emoji='🏆'; msg='완벽해요! 평행사변형 판별 마스터!';}
  else if(pct>=70){emoji='🌟'; msg='아주 잘했어요! 다섯 가지 조건이 확실히 잡혔네요.';}
  else if(pct>=50){emoji='😊'; msg='꽤 잘했어요! 조금만 더 연습해봐요.';}
  else {emoji='🌱'; msg='이제 시작이에요! 5가지 조건을 하나씩 다시 살펴볼까요?';}

  const dots = userAnswers.map((a,i)=>`<div class="dot ${a.correct?'right':'wrong'}"><span>${i+1}</span></div>`).join('');

  document.getElementById('cardRoot').innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <p class="result-score">${score} / ${total}</p>
    <div class="result-sub">정답률 ${pct}% · 걸린 시간 ${elapsed}</div>
    <div class="result-msg">${msg}</div>
    <div class="review-grid">${dots}</div>
    <button class="btn btn-primary" id="retryBtn">다시 도전하기 ↻</button>
  `;
  document.getElementById('retryBtn').onclick = startGame;
}

renderStart();
</script>
