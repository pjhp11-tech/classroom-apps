<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자로 즐기는 야구 게임</title>
<style>
  :root {
    --grass: #1f6b3a;
    --grass-dark: #154d29;
    --chalk: #ffffff;
    --ink: #1b2a22;
    --muted: #5c6b63;
    --paper: #f3f7f4;
    --line: #cfdcd3;
    --strike: #d93636;
    --ball: #2f7de1;
    --out: #7a8580;
    --win: #e0a100;
    --font: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.5;
  }
  .hero {
    background: var(--grass);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 48px, transparent 48px 96px);
    color: var(--chalk);
    padding: 28px 16px 56px;
    text-align: center;
  }
  .hero h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.2rem); letter-spacing: -0.02em; text-wrap: balance; }
  .hero p { margin: 8px 0 0; opacity: .9; }
  main {
    max-width: 560px;
    margin: -36px auto 40px;
    padding: 0 16px;
    display: grid;
    gap: 16px;
  }
  .card {
    background: var(--chalk);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  details summary { cursor: pointer; font-weight: 700; }
  details ul { margin: 10px 0 0; padding-left: 20px; color: var(--muted); }
  details li { margin: 4px 0; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
  .mode { font-size: 1rem; min-height: 46px; }
  .mode[aria-pressed="true"] { background: var(--grass); color: var(--chalk); border-color: var(--grass-dark); }
  .chances { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .chances strong { font-size: 1.05rem; }
  .balls { display: flex; gap: 6px; }
  .balls i {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--chalk);
    border: 2px solid var(--grass);
    position: relative;
  }
  .balls i.used { background: var(--line); border-color: var(--line); }
  .balls i.used::after {
    content: ""; position: absolute; inset: 3px;
    border-top: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    border-radius: 50%; opacity: .0;
  }

  .slots { display: flex; justify-content: center; gap: 12px; margin: 18px 0 14px; }
  .slot {
    width: 68px; height: 80px;
    display: grid; place-items: center;
    font-size: 2.2rem; font-weight: 800;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    font-variant-numeric: tabular-nums;
  }
  .slot.filled { border-color: var(--grass); background: var(--chalk); }
  .slot.next { border-color: var(--grass); border-style: dashed; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
  button {
    font: inherit; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--chalk); color: var(--ink);
    min-height: 52px; font-size: 1.25rem; font-weight: 700;
  }
  button:hover:not(:disabled) { background: var(--paper); }
  button:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .pad .act { font-size: 1rem; }
  .submit { background: var(--grass); color: var(--chalk); border-color: var(--grass-dark); }
  .submit:hover:not(:disabled) { background: var(--grass-dark); }
  .msg { min-height: 1.6em; text-align: center; margin: 12px 0 0; color: var(--strike); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  td.num { font-weight: 800; letter-spacing: .25em; font-size: 1.15rem; }
  .dg { cursor: pointer; border-radius: 4px; user-select: none; transition: opacity .15s; }
  .dg:hover { background: var(--paper); }
  .dg.dim { opacity: .22; }
  .hint { margin: 10px 0 0; font-size: .85rem; color: var(--muted); text-align: center; }
  td.empty { color: var(--line); }
  .tag {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: .9rem; font-weight: 700; color: var(--chalk); margin: 2px;
  }
  .tag.s { background: var(--strike); }
  .tag.b { background: var(--ball); }
  .tag.o { background: var(--out); }
  .tag.w { background: var(--win); color: #3a2a00; }

  .result { text-align: center; }
  .result h2 { margin: 0 0 6px; font-size: 1.4rem; }
  .result .answer { font-size: 2rem; font-weight: 800; letter-spacing: .3em; margin: 6px 0 12px; }
  .result button { padding: 0 28px; background: var(--grass); color: var(--chalk); border-color: var(--grass-dark); }
  @media (max-width: 400px) {
    .slot { width: 56px; height: 68px; font-size: 1.9rem; }
    td.num { letter-spacing: .15em; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .slot.filled { transition: border-color .15s; }
  }
</style>
</head>
<body>
<header class="hero">
  <h1>숫자로 즐기는 야구 게임</h1>
  <p id="subtitle"></p>
</header>

<main>
  <section class="card">
    <details>
      <summary>게임 방법 보기</summary>
      <ul>
        <li>컴퓨터는 1부터 9까지의 서로 다른 숫자로 <span class="nw"></span> 자리 수를 정했어요.</li>
        <li><b>스트라이크</b>: 숫자와 자리가 모두 맞아요.</li>
        <li><b>볼</b>: 숫자는 있지만 자리가 달라요.</li>
        <li><b>아웃</b>: 맞는 숫자가 하나도 없어요.</li>
        <li><span class="nw"></span> 자리가 모두 스트라이크면 승리! 기회는 모두 <span class="tw"></span>번이에요.</li>
      </ul>
    </details>
  </section>

  <section class="card modes" aria-label="난이도 선택">
    <button type="button" class="mode" data-n="3">세 자리 (7번)</button>
    <button type="button" class="mode" data-n="4">네 자리 (10번)</button>
  </section>

  <section class="card" aria-label="게임판">
    <div class="chances">
      <strong id="turnText">1번째 도전</strong>
      <div class="balls" id="balls" aria-hidden="true"></div>
    </div>

    <div class="slots" id="slots" aria-live="polite"></div>

    <div class="pad" id="pad"></div>
    <p class="msg" id="msg" role="alert"></p>
  </section>

  <section class="card" id="resultCard" hidden>
    <div class="result">
      <h2 id="resultTitle"></h2>
      <div class="answer" id="resultAnswer"></div>
      <button id="restart" type="button">다시 하기</button>
    </div>
  </section>

  <section class="card">
    <table aria-label="기록">
      <thead>
        <tr><th>회차</th><th>내가 말한 수</th><th>판정</th></tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
    <p class="hint">기록의 숫자를 누르면 같은 숫자가 모두 연해져요. 다시 누르면 돌아와요.</p>
  </section>
</main>

<script>
(function () {
  var CONFIG = { 3: 7, 4: 10 };
  var NUM = ["", "원", "투", "스리", "포"];
  var WORD = { 3: "세", 4: "네" };

  var N = 3;
  var MAX_TRIES = CONFIG[N];
  var answer, guesses, current, over;
  var faded = {};

  var slotsEl = document.getElementById("slots");
  var padEl = document.getElementById("pad");
  var msgEl = document.getElementById("msg");
  var historyEl = document.getElementById("history");
  var ballsEl = document.getElementById("balls");
  var turnText = document.getElementById("turnText");
  var resultCard = document.getElementById("resultCard");
  var resultTitle = document.getElementById("resultTitle");
  var resultAnswer = document.getElementById("resultAnswer");

  function makeAnswer() {
    var pool = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    var out = [];
    for (var i = 0; i < N; i++) {
      var k = Math.floor(Math.random() * pool.length);
      out.push(pool.splice(k, 1)[0]);
    }
    return out;
  }

  function judge(g, a) {
    var strike = 0, ball = 0;
    for (var i = 0; i < N; i++) {
      if (g[i] === a[i]) strike++;
      else if (a.indexOf(g[i]) !== -1) ball++;
    }
    return { strike: strike, ball: ball };
  }

  function judgeTags(r) {
    if (r.strike === N) return '<span class="tag w">' + NUM[N] + ' 스트라이크! 정답</span>';
    if (r.strike === 0 && r.ball === 0) return '<span class="tag o">아웃</span>';
    var html = "";
    if (r.strike > 0) html += '<span class="tag s">' + NUM[r.strike] + ' 스트라이크</span>';
    if (r.ball > 0) html += '<span class="tag b">' + NUM[r.ball] + ' 볼</span>';
    return html;
  }

  function buildPad() {
    var html = "";
    for (var d = 1; d <= 9; d++) {
      html += '<button type="button" data-d="' + d + '">' + d + "</button>";
    }
    html += '<button type="button" class="act" id="del">지우기</button>';
    html += '<button type="button" class="act submit" id="go">확인</button>';
    html += '<button type="button" class="act" id="clr">모두 지우기</button>';
    padEl.innerHTML = html;
  }

  function render() {
    // slots
    var s = "";
    for (var i = 0; i < N; i++) {
      var has = i < current.length;
      var cls = "slot" + (has ? " filled" : i === current.length && !over ? " next" : "");
      s += '<div class="' + cls + '">' + (has ? current[i] : "") + "</div>";
    }
    slotsEl.innerHTML = s;

    // pad state
    var btns = padEl.querySelectorAll("button[data-d]");
    for (var j = 0; j < btns.length; j++) {
      var dv = Number(btns[j].getAttribute("data-d"));
      btns[j].disabled = over || current.indexOf(dv) !== -1 || current.length >= N;
    }
    document.getElementById("del").disabled = over || current.length === 0;
    document.getElementById("clr").disabled = over || current.length === 0;
    document.getElementById("go").disabled = over || current.length !== N;

    // chances
    var b = "";
    for (var k = 0; k < MAX_TRIES; k++) b += '<i class="' + (k < guesses.length ? "used" : "") + '"></i>';
    ballsEl.innerHTML = b;
    var left = MAX_TRIES - guesses.length;
    turnText.textContent = over ? "게임 끝" : (guesses.length + 1) + "번째 도전 (남은 기회 " + left + "번)";

    // history
    var h = "";
    for (var r = 0; r < MAX_TRIES; r++) {
      if (r < guesses.length) {
        var g = guesses[r];
        h += "<tr><td>" + (r + 1) + '</td><td class="num">' + g.digits.map(function (d) {
          return '<span class="dg' + (faded[d] ? " dim" : "") + '" data-d="' + d + '">' + d + "</span>";
        }).join("") + "</td><td>" + judgeTags(g.result) + "</td></tr>";
      } else {
        h += '<tr><td class="empty">' + (r + 1) + '</td><td class="empty">- - -</td><td class="empty">&nbsp;</td></tr>';
      }
    }
    historyEl.innerHTML = h;
  }

  function addDigit(d) {
    if (over || current.length >= N || current.indexOf(d) !== -1) return;
    current.push(d);
    msgEl.textContent = "";
    render();
  }

  function removeDigit() {
    if (over || !current.length) return;
    current.pop();
    msgEl.textContent = "";
    render();
  }

  function clearAll() {
    if (over) return;
    current = [];
    msgEl.textContent = "";
    render();
  }

  function submit() {
    if (over) return;
    if (current.length !== N) {
      msgEl.textContent = WORD[N] + " 자리를 모두 입력해 주세요.";
      return;
    }
    var result = judge(current, answer);
    guesses.push({ digits: current.slice(), result: result });
    current = [];
    msgEl.textContent = "";

    if (result.strike === N) {
      over = true;
      resultTitle.textContent = guesses.length + "번 만에 맞혔어요! 승리!";
      resultAnswer.textContent = answer.join("");
      resultCard.hidden = false;
    } else if (guesses.length >= MAX_TRIES) {
      over = true;
      resultTitle.textContent = "아쉽지만 " + MAX_TRIES + "번 안에 맞히지 못했어요. 정답은";
      resultAnswer.textContent = answer.join("");
      resultCard.hidden = false;
    }
    render();
    if (over) resultCard.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function setLabels() {
    document.getElementById("subtitle").textContent =
      "컴퓨터가 생각한 " + WORD[N] + " 자리 수를 " + MAX_TRIES + "번 안에 맞혀 보세요.";
    var nw = document.querySelectorAll(".nw");
    for (var i = 0; i < nw.length; i++) nw[i].textContent = WORD[N];
    var tw = document.querySelectorAll(".tw");
    for (var j = 0; j < tw.length; j++) tw[j].textContent = MAX_TRIES;
    var ms = document.querySelectorAll(".mode");
    for (var m = 0; m < ms.length; m++) {
      ms[m].setAttribute("aria-pressed", Number(ms[m].getAttribute("data-n")) === N ? "true" : "false");
    }
  }

  function start() {
    MAX_TRIES = CONFIG[N];
    faded = {};
    setLabels();
    answer = makeAnswer();
    guesses = [];
    current = [];
    over = false;
    msgEl.textContent = "";
    resultCard.hidden = true;
    render();
  }

  padEl.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t || t.disabled) return;
    if (t.hasAttribute("data-d")) addDigit(Number(t.getAttribute("data-d")));
    else if (t.id === "del") removeDigit();
    else if (t.id === "clr") clearAll();
    else if (t.id === "go") submit();
  });

  document.getElementById("restart").addEventListener("click", start);

  historyEl.addEventListener("click", function (e) {
    var t = e.target.closest(".dg");
    if (!t) return;
    var d = t.getAttribute("data-d");
    faded[d] = !faded[d];
    render();
  });

  document.querySelector(".modes").addEventListener("click", function (e) {
    var t = e.target.closest(".mode");
    if (!t) return;
    var n = Number(t.getAttribute("data-n"));
    if (n === N) return;
    N = n;
    start();
  });

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= "1" && e.key <= "9") {
      if (current.indexOf(Number(e.key)) !== -1) msgEl.textContent = "같은 숫자는 한 번만 쓸 수 있어요.";
      addDigit(Number(e.key));
    } else if (e.key === "Backspace") {
      removeDigit();
    } else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement.id !== "go") return;
      e.preventDefault();
      submit();
    }
  });

  buildPad();
  start();
})();
</script>
</body>
</html>
