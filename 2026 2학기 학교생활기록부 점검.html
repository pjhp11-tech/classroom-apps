<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>2026학년도 2학기 학교생활기록부 안내</title>
<style>
  :root{
    --paper:#EAE1C8;
    --paper-deep:#DCCEA6;
    --panel:#F3ECD9;
    --ink:#241D12;
    --ink-soft:#4A4230;
    --seal:#A6342A;
    --pen-blue:#2F5DA8;
    --pen-green:#3F7355;
    --pen-purple:#6B4C8A;
    --pen-gold:#B5842B;
    --indigo:#178C9B;
    --line:#C9B98D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,35,23,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:500;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea, select{font-family:inherit;font-weight:inherit;}
  #app{max-width:960px;margin:0 auto;padding:14px 16px 40px;}
  @media (max-width:480px){
    #app{padding:10px 12px 32px;}
  }

  /* ---------- Header / approval strip ---------- */
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;margin-bottom:14px;flex-wrap:wrap;
  }
  .masthead .title-block{flex:1;min-width:220px;}
  .eyebrow{
    font-size:12px;letter-spacing:0.02em;color:var(--ink-soft);
    margin:0 0 4px;
  }
  h1.doc-title{
    font-size:clamp(19px,3vw,26px);
    line-height:1.25;margin:0;font-weight:800;color:var(--ink);
  }
  .doc-title .sub{display:block;font-size:0.56em;font-weight:600;color:var(--ink-soft);margin-top:3px;}
  .rule{
    height:3px;background:
      linear-gradient(to right, var(--ink) 0 40px, transparent 40px);
    margin:10px 0 0;
  }

  .approval-line{
    display:grid;grid-template-columns:repeat(4,44px);
    border:1.5px solid var(--ink);flex-shrink:0;
  }
  .approval-line div{
    border-left:1px solid var(--ink);
    display:flex;flex-direction:column;
  }
  .approval-line div:first-child{border-left:none;}
  .approval-line span{
    font-size:10px;text-align:center;padding:3px 0;
    border-bottom:1px solid var(--ink);color:var(--ink-soft);
    background:var(--panel);
  }
  .approval-line em{height:38px;font-style:normal;background:#fff;}

  /* ---------- Nav / back ---------- */
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;cursor:pointer;
    font-size:14px;color:var(--ink-soft);padding:6px 0;margin-bottom:14px;
    font-weight:600;
  }
  .back-btn:hover{color:var(--ink);}
  .back-btn svg{width:16px;height:16px;}

  .view-title{font-size:22px;font-weight:800;margin:0 0 4px;}
  .view-desc{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;}

  /* ---------- Home tiles ---------- */
  .home-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;
  }
  @media (max-width:720px){.home-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:560px){.home-grid{grid-template-columns:1fr 1fr;gap:8px;}}

  .tile{
    position:relative;background:var(--panel);
    border:1.5px solid var(--ink);
    padding:12px 10px 10px;cursor:pointer;
    box-shadow:3px 3px 0 rgba(42,35,23,0.18);
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;
  }
  .tile:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 rgba(42,35,23,0.2);}
  .tile:active{transform:translate(0,0);box-shadow:1px 1px 0 rgba(42,35,23,0.2);}
  .tile .tab{
    position:absolute;top:-8px;left:10px;background:var(--seal);
    color:#fff;font-size:9px;font-weight:700;padding:1px 7px;letter-spacing:.02em;
  }
  .tile.g2 .tab{background:var(--pen-blue);}
  .tile.g3 .tab{background:var(--pen-green);}
  .tile.g4 .tab{background:var(--pen-gold);}
  .tile svg.icon{width:18px;height:18px;color:var(--ink);margin-bottom:6px;}
  .tile h2{margin:0 0 5px;font-size:13px;font-weight:800;line-height:1.3;}
  .tile .go{font-size:10px;font-weight:700;color:var(--ink);}

  /* ---------- Calendar ---------- */
  .cal-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:700px){.cal-wrap{grid-template-columns:1fr;}}
  .month{
    background:var(--panel);border:1.5px solid var(--ink);
    box-shadow:6px 6px 0 rgba(42,35,23,0.14);
    padding:16px;
  }
  .month h3{margin:0 0 12px;font-size:16px;font-weight:800;text-align:center;}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .dow span{font-size:11px;text-align:center;color:var(--ink-soft);font-weight:700;padding-bottom:6px;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .day{
    position:relative;aspect-ratio:1/1;border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:4px;font-size:12.5px;color:var(--ink);cursor:default;
    background:transparent;
  }
  .day.blank{visibility:hidden;}
  .day.has-event{cursor:pointer;border:1px solid var(--line);background:#fff;font-weight:800;}
  .day.has-event:hover{box-shadow:inset 0 0 0 2px var(--ink);}
  .day.selected{outline:2px solid var(--ink);outline-offset:-2px;}
  .dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;}
  .dot{width:6px;height:6px;border-radius:50%;}

  .legend{
    display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:18px;padding:14px 16px;
    background:var(--panel);border:1px solid var(--line);font-size:12.5px;
  }
  .legend .item{display:flex;align-items:center;gap:6px;color:var(--ink-soft);}
  .legend .dot{width:9px;height:9px;}
  .swatch-box{display:inline-block;width:18px;height:18px;border:1px solid;}

  .day-panel{
    margin-top:0;background:#fff;border:1.5px solid var(--ink);
    box-shadow:6px 6px 0 rgba(42,35,23,0.16);padding:22px;
  }
  .day-panel h3{margin:0 0 4px;font-size:19px;font-weight:800;}
  .day-panel .date-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .event-card{border-top:1px solid var(--line);padding:14px 0;}
  .event-card:first-of-type{border-top:none;padding-top:0;}
  .event-card .tag-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .badge{
    display:inline-block;font-size:11px;font-weight:700;color:#fff;
    padding:2px 9px;
  }
  .owner{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .event-card h4{margin:0 0 8px;font-size:15px;font-weight:800;}
  .event-card ul{margin:0;padding-left:0;list-style:none;}
  .event-card li{
    position:relative;padding-left:16px;margin-bottom:7px;font-size:13.5px;
    line-height:1.6;color:var(--ink);
  }
  .event-card li::before{
    content:'';position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--ink-soft);
  }
  .empty-hint{font-size:13px;color:var(--ink-soft);padding:30px 10px;text-align:center;}

  .sheet-link-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:700;
    padding:9px 16px;margin-bottom:16px;
    text-decoration:none;border:1.5px solid var(--ink);
    box-shadow:3px 3px 0 rgba(42,35,23,0.2);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .sheet-link-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 rgba(42,35,23,0.22);}
  .sheet-link-btn:active{transform:translate(0,0);box-shadow:1px 1px 0 rgba(42,35,23,0.22);}

  .note-box{
    margin-top:22px;background:var(--panel);border:1px dashed var(--ink-soft);
    padding:16px 18px;
  }
  .note-box h4{margin:0 0 8px;font-size:14px;font-weight:800;}
  .note-box ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.65;}

  /* ---------- Guide grid ---------- */
  .guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  @media (max-width:380px){.guide-grid{grid-template-columns:repeat(2,1fr);}}
  .g-tile{
    background:#fff;border:1.5px solid var(--ink);
    padding:8px 5px;cursor:pointer;text-align:center;
    box-shadow:2px 2px 0 rgba(42,35,23,0.14);
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:auto;
  }
  .g-tile:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 rgba(42,35,23,0.18);}
  .g-tile:active{transform:translate(0,0);box-shadow:1px 1px 0 rgba(42,35,23,0.18);}
  .g-tile .swatch{width:12px;height:3px;}
  .g-tile svg.icon{width:15px;height:15px;color:var(--ink);}
  .g-tile h3{margin:0;font-size:10.5px;font-weight:800;line-height:1.25;}
  @media (max-width:480px){
    .g-tile{padding:6px 4px;gap:3px;}
    .g-tile svg.icon{width:13px;height:13px;}
    .g-tile h3{font-size:9.5px;}
  }

  .topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (max-width:360px){.topic-grid{grid-template-columns:1fr;}}
  .topic-tile{
    background:#fff;border:1.5px solid var(--ink);
    padding:16px 16px;cursor:pointer;text-align:left;
    box-shadow:5px 5px 0 rgba(42,35,23,0.12);
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex;flex-direction:column;gap:8px;
  }
  .topic-tile:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(42,35,23,0.16);}
  .topic-tile:active{transform:translate(0,0);box-shadow:3px 3px 0 rgba(42,35,23,0.16);}
  .topic-tile h3{margin:0;font-size:15px;font-weight:800;line-height:1.4;}

  /* 1줄 1개 아코디언 목록 (연수 세부항목) */
  .topic-list{display:flex;flex-direction:column;gap:10px;}
  .topic-item{
    background:#fff;border:1.5px solid var(--ink);
    box-shadow:4px 4px 0 rgba(42,35,23,0.12);
  }
  .topic-tile.wide{
    border:none;box-shadow:none;width:100%;
    display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;
  }
  .topic-tile.wide:hover, .topic-tile.wide:active{transform:none;box-shadow:none;}
  .topic-item.open .topic-tile.wide{border-bottom:1px solid var(--line);}
  .chev{font-size:12px;color:var(--ink-soft);flex-shrink:0;}
  .item-detail{padding:14px 16px;}
  .item-detail ul{margin:0;padding:0;list-style:none;}
  .item-detail li{
    position:relative;padding-left:16px;margin-bottom:8px;font-size:13.5px;line-height:1.6;color:var(--ink);
  }
  .item-detail li::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--ink-soft);}
  .item-detail li:last-child{margin-bottom:0;}

  /* 1줄 1개, 옆에 펼치기 (공유시트 탭) */
  .sheet-list{display:flex;flex-direction:column;gap:10px;}
  .sheet-row{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;}
  .topic-tile.sheet-tile{
    flex:0 0 auto;min-width:150px;
    display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;
  }
  .topic-tile.sheet-tile.open{background:var(--panel);}
  .sheet-detail{
    flex:1 1 240px;background:#fff;border:1.5px solid var(--ink);
    box-shadow:4px 4px 0 rgba(42,35,23,0.12);
    padding:12px 14px;display:flex;align-items:center;
  }

  .section li strong, .event-card li strong, .chip strong{
    font-weight:800;color:var(--ink);
  }
  .chip strong{font-weight:800;}

  .subblock{margin-bottom:18px;}
  .subblock:last-child{margin-bottom:0;}
  .subblock h5{
    margin:0 0 8px;font-size:12.5px;font-weight:800;color:var(--ink-soft);
    letter-spacing:.01em;
  }

  /* ---------- Guide detail ---------- */
  .detail-head{
    border-left:6px solid var(--ink);padding-left:16px;margin-bottom:22px;
  }
  .detail-head h2{margin:0 0 4px;font-size:21px;font-weight:800;}
  .detail-head p{margin:0;font-size:13.5px;color:var(--ink-soft);}
  .section{margin-bottom:26px;}
  .section h4{
    font-size:14.5px;font-weight:800;margin:0 0 10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .section ul{margin:0;padding:0;list-style:none;}
  .section li{
    position:relative;padding-left:18px;margin-bottom:9px;font-size:13.8px;
    line-height:1.65;color:var(--ink);
  }
  .section li::before{
    content:'';position:absolute;left:2px;top:8px;width:6px;height:6px;background:var(--ink-soft);
  }
  .section li.sub{margin-left:14px;font-size:13px;color:var(--ink-soft);}
  .section li.sub::before{background:var(--line);}

  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-size:12.5px;padding:5px 11px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);
  }
  .chip.ok{border-color:var(--pen-green);color:var(--pen-green);background:#F1F7F2;}
  .chip.no{border-color:var(--seal);color:var(--seal);background:#FBF1EF;}

  table.gtable{width:100%;border-collapse:collapse;font-size:13px;}
  table.gtable th,table.gtable td{
    border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;
  }
  table.gtable th{background:var(--panel);font-weight:700;}
  .table-scroll{overflow-x:auto;}

  .gtable.compact th,.gtable.compact td{padding:6px 5px;text-align:center;white-space:nowrap;}
  .gtable.compact th:first-child,.gtable.compact td:first-child{text-align:left;padding-left:8px;font-weight:700;}
  .inline-link{
    background:none;border:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;
    border-bottom:2px solid var(--seal);
  }
  .inline-link:hover{background:rgba(166,52,42,0.08);}
  .inline-panel{margin-top:8px;}
  .topic-tile.static{cursor:default;}
  .topic-tile.static:hover{transform:none;box-shadow:5px 5px 0 rgba(42,35,23,0.12);}
  .topic-tile.sheet-tile{flex:0 0 150px;width:150px;}
  .callout{
    background:#fff;border-left:4px solid var(--pen-gold);
    padding:10px 14px;font-size:13px;color:var(--ink-soft);margin-top:8px;
  }

  @media (max-width:480px){
    .view-title{font-size:18px;}
    .view-desc{font-size:12px;}
    .month{padding:10px;}
    .month h3{font-size:14px;}
    .day{font-size:10.5px;}
    .dow span{font-size:9.5px;}
    .legend{font-size:11px;padding:10px 12px;gap:6px 10px;}
    .day-panel{padding:14px;}
    .event-card h4{font-size:14px;}
    .event-card li{font-size:12.5px;}
    .detail-head{padding-left:12px;border-left-width:5px;}
    .detail-head h2{font-size:17px;}
    .detail-head p{font-size:12.5px;}
    .section li{font-size:13px;}
    .section h4{font-size:13px;}
    table.gtable{font-size:11.5px;}
    table.gtable th,table.gtable td{padding:6px 7px;}
    .chip{font-size:11.5px;padding:4px 9px;}
    .topic-tile{padding:12px;}
    .topic-tile h3{font-size:13.5px;}
  }

  /* ---------- AI 특기사항 작성 안내 ---------- */
  .ai-big{
    background:var(--panel);border:1.5px solid var(--ink);
    box-shadow:6px 6px 0 rgba(42,35,23,0.14);
    padding:18px;display:flex;flex-direction:column;gap:16px;
  }
  .step-card{
    background:#fff;border:1.5px solid var(--ink);
    box-shadow:3px 3px 0 rgba(42,35,23,0.12);
    padding:16px 16px 18px;
  }
  .step-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;user-select:none;}
  .step-head h3{flex:1;}
  .step-head .chev{font-size:12px;color:var(--ink-soft);flex-shrink:0;}
  .step-card.collapsed .step-head{margin-bottom:0;}
  .step-card.collapsed .step-body{display:none;}
  .ph{font-size:1.4em;font-weight:900;color:var(--seal);background:rgba(166,52,42,0.12);padding:0 3px;line-height:1;}
  .step-no{
    flex-shrink:0;width:28px;height:28px;background:var(--indigo);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;
  }
  .step-head h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.4;}
  .step-body ul{margin:0 0 8px;padding:0;list-style:none;}
  .step-body li{
    position:relative;padding-left:16px;margin-bottom:7px;font-size:13.5px;line-height:1.65;color:var(--ink);
  }
  .step-body li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;background:var(--ink-soft);}
  .step-body li.plus::before{content:'+';background:none;top:0;font-weight:800;color:var(--seal);width:auto;height:auto;}
  .step-body li ul{margin:6px 0 0;}
  .step-body a.ext{
    color:var(--pen-blue);font-weight:800;text-decoration:none;border-bottom:2px solid var(--pen-blue);
  }
  .step-body a.ext:hover{background:rgba(47,93,168,0.1);}
  .shots{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;align-items:flex-start;}
  .shot{margin:0;max-width:100%;}
  .shot.full{flex:1 1 100%;}
  .shot img{
    display:block;width:100%;max-width:100%;height:auto;border:1px solid var(--line);
    cursor:zoom-in;background:#fff;
  }
  .shot figcaption{font-size:11.5px;color:var(--ink-soft);margin-top:4px;font-weight:600;}
  .prompt-box{
    background:var(--panel);border:1px dashed var(--ink-soft);padding:12px 14px;margin-top:6px;
    font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;color:var(--ink);
  }
  .copy-btn{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    background:var(--ink);color:#fff;border:1.5px solid var(--ink);
    font-size:12.5px;font-weight:700;padding:6px 12px;cursor:pointer;
    box-shadow:2px 2px 0 rgba(42,35,23,0.2);
  }
  .copy-btn:active{transform:translate(1px,1px);box-shadow:none;}
  .prompt-note{font-size:12px;color:var(--ink-soft);margin:6px 0 0;}
  .lightbox{
    position:fixed;inset:0;background:rgba(36,29,18,0.82);z-index:999;
    display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;
  }
  .lightbox img{max-width:100%;max-height:100%;background:#fff;border:2px solid #fff;}
  @media (max-width:480px){
    .ai-big{padding:10px;gap:12px;}
    .step-card{padding:12px 12px 14px;}
    .step-head h3{font-size:14px;}
    .step-body li{font-size:12.5px;}
    .prompt-box{font-size:12px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============== DATA ============== */

const EVENTS = [
  { id:1, start:'2026-12-14', end:'2026-12-14', owner:'학급담임', tag:'출결마감', color:'var(--seal)',
    title:'1차 출결 마감',
    details:[
      '<strong>필수 선행 작업</strong> : 일출결마감 / 월출결마감 (12.14 기준 수업일수 <strong>174일</strong>)',
      '매일 일출결 마감을 해야 이수시간에 문제가 없음',
      '<strong>출결특기사항</strong> 작성 – 기재요령 [출결상황] 참고',
      '인정결석을 제외하고 64일 이상 결석한 학생이 있는지 확인'
    ]},

  { id:2, start:'2026-12-15', end:'2026-12-18', owner:'학급담임', tag:'입력', color:'var(--indigo)',
    title:'창의적 체험활동 입력',

function fmtDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function eventsByDate(){
  const map = {};
  EVENTS.forEach(ev=>{
    let d = new Date(ev.start+'T00:00:00');
    const end = new Date(ev.end+'T00:00:00');
    while(d<=end){
      const key = fmtDate(d);
      const dow = d.getDay(); // 0: 일요일, 6: 토요일
      const isWeekend = dow===0 || dow===6;
      const isHoliday = HOLIDAYS.has(key);
      if(!isWeekend && !isHoliday){
        (map[key] = map[key]||[]).push(ev);
      }
      d.setDate(d.getDate()+1);
    }
  });
  return map;
}

function tint(color, alpha){ return `rgba(${COLOR_RGB[color]||'0,0,0'},${alpha})`; }

function monthHTML(year, month /*0-index*/){
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = `${year}년 ${month+1}월`;
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = EV_MAP[key];
    const hasEvent = !!evs;
    const sel = state.selectedDate===key ? 'selected' : '';
    let style = '';
    if(hasEvent){
      const cols = [...new Set(evs.map(e=>e.color))];
      if(cols.length===1){
        style = `background:${tint(cols[0],0.3)};border-color:${tint(cols[0],0.8)};`;
      } else {
        const w = 100/cols.length;
        style = `background:linear-gradient(135deg, ${cols.map((c,i)=>`${tint(c,0.32)} ${i*w}% ${(i+1)*w}%`).join(',')});`;
      }
    }
    cells += `<div class="day ${hasEvent?'has-event':''} ${sel}" ${hasEvent?`style="${style}" onclick="goDayDetail('${key}')"`:''}>${d}</div>`;
  }
  return `<div class="month">
    <h3>${monthLabel}</h3>
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="days">${cells}</div>
  </div>`;
}

function blockBody(b){
  if(b.type==='bullets'){
    return `<ul>${b.items.map(it=>`<li>${it}</li>`).join('')}</ul>`;
  } else if(b.type==='chips'){
    return `<div class="chips">${b.items.map(it=>`<span class="chip ${b.style||''}">${it}</span>`).join('')}</div>`;
  } else if(b.type==='table'){
    return `<div class="table-scroll"><table class="gtable ${b.cls||''}">
      <thead><tr>${b.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${b.note ? `<div class="callout">${b.note.join('<br>')}</div>` : ''}`;
  }
  return '';
}

function sectionHTML(sec, hideHeading){
  const body = sec.type==='group'
    ? sec.blocks.map(b=>`<div class="subblock"><h5>${b.subheading}</h5>${blockBody(b)}</div>`).join('')
    : blockBody(sec);
  return `<div class="section">${hideHeading?'':`<h4>${sec.heading}</h4>`}${body}</div>`;
}

const AI_IMG_W = {p1:347,p2:1517,p3:892,p4:1462,p5:884,p6:1662,p7:1627,p8:1661};
function shot(key, caption, full){
  return `<figure class="shot full"><img src="${AI_IMGS[key]}" style="max-width:min(60%,${AI_IMG_W[key]}px)" alt="${caption||'안내 사진'}" onclick="openShot('${key}')">${caption?`<figcaption>${caption}</figcaption>`:''}</figure>`;
}
function openShot(key){
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.onclick = ()=>box.remove();
  box.innerHTML = `<img src="${AI_IMGS[key]}" alt="확대 사진">`;
  document.body.appendChild(box);
}
function copyAiPrompt(btn){
  const done = ()=>{ const o = btn.textContent; btn.textContent = '복사되었습니다 ✓'; setTimeout(()=>{btn.textContent = o;}, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(AI_PROMPT).then(done).catch(()=>fallbackCopy(done));
  } else { fallbackCopy(done); }
}
function fallbackCopy(done){
  const ta = document.createElement('textarea');
  ta.value = AI_PROMPT; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}
function toggleAiStep(head){
  const card = head.closest('.step-card');
  const collapsed = card.classList.toggle('collapsed');
  head.querySelector('.chev').textContent = collapsed ? '▼' : '▲';
}
function aiStep(no, title, body){
  return `<div class="step-card collapsed">
    <div class="step-head" onclick="toggleAiStep(this)" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleAiStep(this);}"><span class="step-no">${no}</span><h3>${title}</h3><span class="chev">▼</span></div>
    <div class="step-body">${body}</div>
  </div>`;
}
