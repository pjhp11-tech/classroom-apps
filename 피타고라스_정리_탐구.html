<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피타고라스 정리는 무엇일까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F1; --grid:#E7E0CF; --ink:#233129;
    --teal:#256B5A; --teal-dark:#184A3E;
    --coral:#E8722C; --coral-dark:#C25A19;
    --sun:#F2B705; --good:#2E8B4B; --bad:#D64545;
    --card:#FFFFFF; --shadow:0 6px 18px rgba(35,49,41,0.10);
    --sqA:#CFE6F7; --sqB:#FDE5BF; --sqC:#E1D7EE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif; color:var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
  }
  h1,h2,h3,.brand{font-family:'Baloo 2',sans-serif;}
  #topbar{
    position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap; padding:10px 18px; background:rgba(251,248,241,0.94);
    backdrop-filter:blur(4px); border-bottom:2px solid var(--grid);
  }
  .brand{font-size:18px; font-weight:700; color:var(--teal-dark);}
  .brand span{color:var(--coral);}
  #nav{display:flex; gap:8px;}
  #nav button{
    border:2px solid var(--teal); background:#fff; color:var(--teal-dark); border-radius:999px;
    padding:6px 14px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  }
  #nav button.on{background:var(--teal); color:#fff;}
  #stageContent{max-width:1080px; margin:0 auto; padding:22px 16px 60px;}

  .intro{display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; padding:40px 20px 10px;}
  .intro-badge{font-size:13px; font-weight:700; color:var(--teal-dark); background:#E4F0EA; padding:6px 14px; border-radius:999px; border:2px solid var(--teal);}
  .intro h1{font-size:clamp(26px,4vw,40px); margin:6px 0; color:var(--teal-dark); line-height:1.25;}
  .intro h1 em{font-style:normal; color:var(--coral);}
  .intro p{max-width:560px; font-size:16px; line-height:1.7; color:#3c473f;}
  .bigBtn{
    margin-top:10px; background:var(--coral); color:#fff; border:none; border-radius:16px; padding:16px 34px;
    font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:700; cursor:pointer; box-shadow:0 8px 0 var(--coral-dark);
  }
  .bigBtn:active{transform:translateY(4px); box-shadow:0 4px 0 var(--coral-dark);}
  .tealBtn{
    background:var(--teal); color:#fff; border:none; border-radius:14px; padding:11px 22px;
    font-family:'Baloo 2',sans-serif; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 var(--teal-dark);
  }
  .tealBtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--teal-dark);}
  .tealBtn:disabled{opacity:.4; cursor:default;}
  .ghostBtn{
    background:#fff; color:var(--teal-dark); border:2px solid var(--teal); border-radius:12px; padding:8px 14px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  }
  .ghostBtn.on{background:#E4F0EA;}

  .stageHead{margin-bottom:14px;}
  .stageTag{display:inline-block; font-size:13px; font-weight:700; color:#fff; background:var(--teal); padding:5px 12px; border-radius:8px; margin-bottom:8px;}
  .stageHead h2{font-size:24px; margin:0 0 6px; color:var(--teal-dark);}
  .stageHead p{margin:0; font-size:15px; line-height:1.7; color:#3c473f; max-width:820px;}
  .stageHead p b{color:var(--coral-dark);}

  .panelsRow{display:flex; gap:16px; flex-wrap:wrap; margin-top:16px;}
  .panelCard{
    flex:1 1 280px; min-width:260px; background:var(--card); border-radius:18px; box-shadow:var(--shadow);
    border:2px solid #EFE9D8; padding:12px 12px 10px;
  }
  .panelCard h3{margin:0 0 8px; font-size:15px; color:var(--teal-dark); display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .panelCard svg{width:100%; height:auto; display:block; border-radius:10px; background:#fff; touch-action:none;}
  .infoLine{margin-top:8px; font-size:13.5px; color:#4a554d; min-height:20px; font-weight:600;}
  .infoLine b{color:var(--coral-dark);}

  .card{background:#fff; border-radius:18px; box-shadow:var(--shadow); border:2px solid #EFE9D8; padding:18px 20px; margin-top:18px;}
  .card h3{margin:0 0 10px; color:var(--teal-dark); font-size:18px;}
  table.areaTbl{border-collapse:separate; border-spacing:6px; width:100%; max-width:640px;}
  .areaTbl th{background:#CDE5C3; color:var(--teal-dark); border-radius:10px; padding:8px 6px; font-size:15px; font-weight:800;}
  .areaTbl td{text-align:center; padding:0;}
  .areaTbl td input{
    width:100%; max-width:130px; height:40px; text-align:center; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px;
    border:2px solid #cfd6cd; border-radius:10px; background:#fff; color:var(--ink);
  }
  .areaTbl td input.ok{border-color:var(--good); background:#EAF7EE;}
  .areaTbl td input.bad{border-color:var(--bad); background:#FDECEC;}
  .areaTbl td .given{font-weight:800; font-size:17px; color:var(--teal-dark);}
  .rowActions{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:10px;}
  .feedback{font-size:14.5px; font-weight:700; min-height:22px;}
  .feedback.ok{color:var(--good);} .feedback.no{color:var(--bad);}
  .choices{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
  .choices button{
    background:#fff; border:2px solid var(--teal); color:var(--teal-dark); border-radius:12px; padding:10px 16px;
    font-family:'Baloo 2',sans-serif; font-size:17px; font-weight:700; cursor:pointer;
  }
  .choices button:hover{background:#E4F0EA;}
  .choices button.right{background:var(--good); border-color:var(--good); color:#fff;}
  .choices button.wrong{background:#FDECEC; border-color:var(--bad); color:var(--bad);}
  .sliderRow{display:flex; gap:22px; flex-wrap:wrap; align-items:center; margin:8px 0 4px;}
  .sliderRow label{font-weight:800; color:var(--teal-dark); font-size:15px; display:flex; align-items:center; gap:8px;}
  .sliderRow input[type=range]{width:150px; accent-color:var(--coral);}
  .eqBox{
    margin-top:8px; background:#FFF7E8; border:2px dashed var(--sun); border-radius:14px; padding:12px 16px;
    font-weight:800; color:#5c4300; font-size:16px; line-height:1.7;
  }
  .concl{
    background:#F4FBF6; border:2px solid #CFEAD8; border-radius:14px; padding:14px 16px; color:#1c4a30; font-weight:800; line-height:1.7; font-size:15.5px;
  }
  .concl .big{font-family:'Baloo 2',sans-serif; font-size:24px; color:var(--coral-dark);}
  .hidden{display:none !important;}

  /* svg */
  .vlabel{font-family:'Baloo 2',sans-serif; font-size:14px; font-weight:700; fill:#233129;}
  .sqLabel{font-family:'Baloo 2',sans-serif; font-size:13px; font-weight:800; fill:#233129;}
  .lenlabel{font-family:'Nunito',sans-serif; font-size:14px; font-weight:800;}
  .proofSvg{width:100%; height:auto; display:block; background:#fff; border-radius:12px;}
  .tri{transition:transform .9s ease, opacity .5s ease;}
  .fade{transition:opacity .5s ease;}

  .stepper{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;}
  .dots{display:flex; gap:6px; margin:0 6px;}
  .dots i{width:10px; height:10px; border-radius:50%; background:#d6d3c6; display:block;}
  .dots i.on{background:var(--coral);}
  .caption{margin-top:12px; background:#FFF7E8; border:2px dashed var(--sun); border-radius:14px; padding:12px 16px; font-size:15px; line-height:1.7; font-weight:700; color:#5c4300; min-height:70px;}
  .legend{font-size:13px; color:#5b655e; font-weight:700; margin-top:6px;}

  @media (max-width:640px){ .stageHead h2{font-size:20px;} }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">📐 피타고라스 정리는 <span>무엇</span>일까?</div>
  <div id="nav">
    <button data-go="intro">처음</button>
    <button data-go="p1">① 발견하기</button>
    <button data-go="p2">② 확인하기</button>
  </div>
</div>
<div id="stageContent"></div>

<script>
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},text){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(text!==undefined) e.textContent=text;
  return e;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
const root=document.getElementById('stageContent');
let view='intro';

function go(v){
  view=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===v));
  if(v==='intro') renderIntro();
  if(v==='p1') renderP1();
  if(v==='p2') renderP2();
  window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* =========================================================
   인트로
========================================================= */
function renderIntro(){
  root.innerHTML=`
    <div class="intro">
      <div class="intro-badge">중2 수학 · 피타고라스 정리</div>
      <h1>직각삼각형의 세 변 사이에는<br><em>어떤 관계</em>가 있을까요?</h1>
      <p>모눈종이 위에서 정사각형의 넓이를 직접 구해 보고(발견하기),
      닮은 삼각형을 맞붙여 그 관계가 항상 성립하는 이유를 확인해 보세요.</p>
      <svg viewBox="0 0 220 150" width="240" id="introSvg"></svg>
      <button class="bigBtn" id="startBtn">탐구 시작하기 →</button>
    </div>`;
  const s=document.getElementById('introSvg');
  drawFig(s,3,4,{cs:11,reveal:false,hint:false,labels:true});
  document.getElementById('startBtn').addEventListener('click',()=>go('p1'));
}

/* =========================================================
   ① 발견하기 : 모눈종이 위의 세 정사각형
   B=(0,0), C=(p,0), A=(p,q), 직각은 C
   ㉠ : BC 위 정사각형,  ㉡ : AC 위 정사각형,  ㉢ : AB 위 정사각형
========================================================= */
function drawFig(svg,p,q,o){
  const cs=o.cs||20;
  const xmin=-q, xmax=p+q, ymin=-p, ymax=p+q;
  const W=(xmax-xmin+2)*cs, H=(ymax-ymin+2)*cs;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  clear(svg);
  const X=x=>(x-xmin+1)*cs, Y=y=>(ymax+1-y)*cs;
  const pts=arr=>arr.map(([x,y])=>X(x)+','+Y(y)).join(' ');
  // 모눈
  for(let i=0;i<=xmax-xmin+2;i++) svg.appendChild(el('line',{x1:i*cs,y1:0,x2:i*cs,y2:H,stroke:'#AEB8BF','stroke-width':.9}));
  for(let j=0;j<=ymax-ymin+2;j++) svg.appendChild(el('line',{x1:0,y1:j*cs,x2:W,y2:j*cs,stroke:'#AEB8BF','stroke-width':.9}));
  // 정사각형 3개
  svg.appendChild(el('polygon',{points:pts([[0,0],[p,0],[p,-p],[0,-p]]),fill:'rgba(150,200,240,0.42)',stroke:'#5A8DB5','stroke-width':1.5}));
  svg.appendChild(el('polygon',{points:pts([[p,0],[p+q,0],[p+q,q],[p,q]]),fill:'rgba(250,195,110,0.42)',stroke:'#C9964A','stroke-width':1.5}));
  svg.appendChild(el('polygon',{points:pts([[0,0],[p,q],[p-q,p+q],[-q,p]]),fill:'rgba(185,160,230,0.42)',stroke:'#8E78B5','stroke-width':1.5}));
  // 힌트: ㉢을 둘러싼 큰 정사각형과 합동인 삼각형 4개
  if(o.hint){
    [[[-q,0],[0,0],[-q,p]],[[0,0],[p,0],[p,q]],[[p,q],[p,p+q],[p-q,p+q]],[[-q,p],[-q,p+q],[p-q,p+q]]].forEach(t=>{
      svg.appendChild(el('polygon',{points:pts(t),fill:'rgba(232,114,44,0.22)',stroke:'#E8722C','stroke-width':1}));
    });
    svg.appendChild(el('polygon',{points:pts([[-q,0],[p,0],[p,p+q],[-q,p+q]]),fill:'none',stroke:'#E8722C','stroke-width':1.6,'stroke-dasharray':'5,4'}));
  }
  // 직각삼각형
  svg.appendChild(el('polygon',{points:pts([[0,0],[p,0],[p,q]]),fill:'rgba(255,255,255,0.15)',stroke:'#333','stroke-width':2}));
  // 직각 표시
  const m=Math.min(7,cs*0.4);
  svg.appendChild(el('path',{d:`M ${X(p)-m} ${Y(0)} L ${X(p)-m} ${Y(0)-m} L ${X(p)} ${Y(0)-m}`,fill:'none',stroke:'#333','stroke-width':1.3}));
  // 정점 이름
  svg.appendChild(el('text',{x:X(p)+4,y:Y(q)-5,class:'vlabel'},'A'));
  svg.appendChild(el('text',{x:X(0)-14,y:Y(0)+3,class:'vlabel'},'B'));
  svg.appendChild(el('text',{x:X(p)+3,y:Y(0)+13,class:'vlabel'},'C'));
  // 정사각형 이름
  const names=[['㉠',p/2,-p/2,p*p],['㉡',p+q/2,q/2,q*q],['㉢',(p-q)/2,(p+q)/2,p*p+q*q]];
  names.forEach(([n,cx,cy,ar])=>{
    const t=el('text',{x:X(cx),y:Y(cy)+4,class:'sqLabel','text-anchor':'middle'}, o.reveal? `${n} ${ar}` : n);
    if(o.cs&&o.cs<14) t.setAttribute('font-size','9');
    svg.appendChild(t);
  });
}

const FIGS=[{p:2,q:1,given:{b:1,c:5}},{p:3,q:4,given:{}},{p:5,q:3,given:{}}];
const p1State={hint:[false,false,false], solved:false, rel:false};

function renderP1(){
  p1State.solved=false; p1State.rel=false;
  root.innerHTML=`
    <div class="stageHead">
      <span class="stageTag">① 발견하기 · 관찰하여 확인하기</span>
      <h2>피타고라스 정리는 무엇일까?</h2>
      <p>한 눈금의 길이가 <b>1</b>인 모눈종이 위에 세 직각삼각형 ABC와, 각 변을 한 변으로 하는 정사각형 <b>㉠, ㉡, ㉢</b>이 있어요.
      표를 완성하고, 세 정사각형의 넓이 사이의 관계를 찾아보세요.</p>
    </div>
    <div class="panelsRow" id="figRow"></div>
    <div class="card">
      <h3>📝 정사각형의 넓이를 구해 표를 완성해 보세요</h3>
      <table class="areaTbl" id="tbl"></table>
      <div class="rowActions">
        <button class="tealBtn" id="checkBtn">정답 확인</button>
        <div class="feedback" id="tblFb"></div>
      </div>
      <div class="legend">힌트: ㉢처럼 기울어진 정사각형은 [힌트 보기]를 눌러 큰 정사각형에서 삼각형을 빼 보세요.</div>
    </div>
    <div class="card hidden" id="relCard">
      <h3>🔍 ㉠, ㉡, ㉢의 넓이 사이의 관계는?</h3>
      <div class="choices" id="relChoices"></div>
      <div class="feedback" id="relFb"></div>
    </div>
    <div class="card hidden" id="exploreCard">
      <h3>🧪 다른 직각삼각형으로도 확인해 보세요</h3>
      <div class="sliderRow">
        <label>BC = <span id="pv">3</span><input type="range" id="ps" min="1" max="6" value="3"></label>
        <label>AC = <span id="qv">2</span><input type="range" id="qs" min="1" max="6" value="2"></label>
        <button class="ghostBtn" id="exHint">💡 힌트 보기</button>
      </div>
      <div class="panelsRow" style="margin-top:6px">
        <div class="panelCard" style="max-width:420px"><svg id="exSvg"></svg></div>
        <div style="flex:1 1 260px">
          <div class="eqBox" id="exEq"></div>
          <div class="concl" style="margin-top:12px">
            직각삼각형에서 직각을 낀 두 변 위의 정사각형 ㉠, ㉡의 넓이의 합은
            빗변 위의 정사각형 ㉢의 넓이와 같아요.
          </div>
          <div style="margin-top:14px"><button class="bigBtn" style="font-size:17px;padding:12px 26px" id="toP2">왜 그럴까? 확인하러 가기 →</button></div>
        </div>
      </div>
    </div>`;
  // 그림 3개
  const row=document.getElementById('figRow');
  FIGS.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='panelCard';
    d.innerHTML=`<h3><span>〈그림 ${i+1}〉</span><button class="ghostBtn" data-h="${i}">💡 힌트 보기</button></h3><svg id="fig${i}"></svg>`;
    row.appendChild(d);
  });
  const redraw=()=>FIGS.forEach((f,i)=>drawFig(document.getElementById('fig'+i),f.p,f.q,{hint:p1State.hint[i],reveal:p1State.solved}));
  redraw();
  row.querySelectorAll('[data-h]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.h; p1State.hint[i]=!p1State.hint[i]; b.classList.toggle('on',p1State.hint[i]);
    b.textContent=p1State.hint[i]?'💡 힌트 숨기기':'💡 힌트 보기'; redraw();
  }));
  // 표
  const tbl=document.getElementById('tbl');
  let h='<tr><th></th><th>㉠의 넓이</th><th>㉡의 넓이</th><th>㉢의 넓이</th></tr>';
  FIGS.forEach((f,i)=>{
    const exp=[f.p*f.p,f.q*f.q,f.p*f.p+f.q*f.q];
    h+=`<tr><th>〈그림 ${i+1}〉</th>`;
    ['a','b','c'].forEach((k,j)=>{
      if(f.given[k]!==undefined) h+=`<td><span class="given">${f.given[k]}</span></td>`;
      else h+=`<td><input type="number" inputmode="numeric" data-exp="${exp[j]}" id="t${i}${j}"></td>`;
    });
    h+='</tr>';
  });
  tbl.innerHTML=h;
  document.getElementById('checkBtn').addEventListener('click',()=>{
    const ins=[...tbl.querySelectorAll('input')];
    let all=true, empty=false;
    ins.forEach(inp=>{
      inp.classList.remove('ok','bad');
      if(inp.value===''){ empty=true; all=false; return; }
      if(+inp.value===+inp.dataset.exp) inp.classList.add('ok'); else { inp.classList.add('bad'); all=false; }
    });
    const fb=document.getElementById('tblFb');
    if(all){
      fb.className='feedback ok'; fb.textContent='모두 맞았어요! 👏 이제 관계를 찾아보세요.';
      p1State.solved=true; redraw();
      document.getElementById('relCard').classList.remove('hidden');
      document.getElementById('relCard').scrollIntoView({behavior:'smooth',block:'center'});
    } else {
      fb.className='feedback no';
      fb.textContent=empty?'빈칸을 모두 채워 주세요.':'빨간 칸을 다시 확인해 보세요. (정사각형의 넓이 = 한 변의 길이 × 한 변의 길이)';
    }
  });
  // 관계 선택
  const opts=[['㉠ + ㉡ = ㉢',true],['㉠ + ㉢ = ㉡',false],['㉡ + ㉢ = ㉠',false],['㉠ × ㉡ = ㉢',false]];
  const rc=document.getElementById('relChoices');
  opts.forEach(([t,ok])=>{
    const b=document.createElement('button'); b.textContent=t;
    b.addEventListener('click',()=>{
      const fb=document.getElementById('relFb');
      if(ok){
        b.classList.add('right'); fb.className='feedback ok';
        fb.textContent='맞아요! 세 그림 모두에서 (직각을 낀 두 변 위의 넓이의 합) = (빗변 위의 넓이)예요.';
        document.getElementById('exploreCard').classList.remove('hidden');
        updateEx();
      } else { b.classList.add('wrong'); fb.className='feedback no'; fb.textContent='표의 숫자로 계산해 보세요. 〈그림 1〉에서 4, 1, 5 사이의 관계는?'; }
    });
    rc.appendChild(b);
  });
  // 탐구
  let exHint=false;
  function updateEx(){
    const p=+document.getElementById('ps').value, q=+document.getElementById('qs').value;
    document.getElementById('pv').textContent=p; document.getElementById('qv').textContent=q;
    drawFig(document.getElementById('exSvg'),p,q,{cs:18,hint:exHint,reveal:true});
    document.getElementById('exEq').innerHTML=
      `㉠ = ${p}×${p} = <b>${p*p}</b><br>㉡ = ${q}×${q} = <b>${q*q}</b><br>㉢ = <b>${p*p+q*q}</b><br>`+
      `㉠ + ㉡ = ${p*p} + ${q*q} = ${p*p+q*q} = ㉢ ✔`;
  }
  document.getElementById('ps').addEventListener('input',updateEx);
  document.getElementById('qs').addEventListener('input',updateEx);
  document.getElementById('exHint').addEventListener('click',e=>{
    exHint=!exHint; e.target.classList.toggle('on',exHint); e.target.textContent=exHint?'💡 힌트 숨기기':'💡 힌트 보기'; updateEx();
  });
  document.getElementById('toP2').addEventListener('click',()=>go('p2'));
}

/* =========================================================
   ② 확인하기 : 삼각형을 클릭해 a배, b배, c배 닮은 삼각형을 만들고 맞붙이기
   step 0: 원래 삼각형 / 1: a배 / 2: +b배 / 3: +c배 (모두 회전 없이 원래 방향)
   step 4: [맞붙이기] → 원래 삼각형이 사라지고 회전하며 맞붙음 / 5: 결론
========================================================= */
const P2={a:3,b:4,step:0};
const VW=620, VH=380;

function renderP2(){
  P2.step=0;
  root.innerHTML=`
    <div class="stageHead">
      <span class="stageTag">② 확인하기 · 닮은 삼각형으로 확인하기</span>
      <h2>직각을 낀 두 변이 a, b, 빗변이 c일 때 a²+b²=c²이 성립할까?</h2>
      <p>직각삼각형의 세 변의 길이를 각각 <b>a배, b배, c배</b> 하여 닮은 삼각형 세 개를 만든 뒤,
      길이가 <b>ac</b>인 변끼리, <b>bc</b>인 변끼리 맞붙여 보아요.</p>
    </div>
    <div class="card" style="margin-top:8px">
      <svg id="proofSvg" class="proofSvg" viewBox="0 0 ${VW} ${VH}" style="cursor:pointer"></svg>
      <div class="legend">● 와 × 는 각각 같은 크기의 각을 나타내요. (● + × = 90°)</div>
      <div class="stepper">
        <button class="tealBtn" id="asmBtn">맞붙이기</button>
        <button class="tealBtn" id="concBtn">결론 보기</button>
        <button class="ghostBtn" id="resetBtn">↺ 처음부터</button>
        <div class="dots" id="dots"></div>
      </div>
      <div class="caption" id="caption"></div>
      <div class="concl hidden" id="finalBox"></div>
    </div>`;
  document.getElementById('proofSvg').addEventListener('click',()=>{
    if(P2.step<3){P2.step++; applyStep();}
  });
  document.getElementById('asmBtn').addEventListener('click',()=>{ if(P2.step===3){P2.step=4; applyStep();} });
  document.getElementById('concBtn').addEventListener('click',()=>{ if(P2.step===4){P2.step=5; applyStep();} });
  document.getElementById('resetBtn').addEventListener('click',()=>{ P2.step=0; applyStep(); });
  buildProof(); applyStep();
}

let proofRefs=null;

function buildProof(){
  const svg=document.getElementById('proofSvg'); clear(svg);
  const a=P2.a,b=P2.b,a2=a*a,b2=b*b,c2=a2+b2,c=Math.sqrt(c2),H=a*b;
  const S=10;                       // 단위 길이 1 = 10px
  const ybot=VH-32;                   // 떨어져 있을 때 세 삼각형의 밑변 높이
  const gap=2.5*S;
  // ---- 도우미 ----
  function centroid(v){ return [(v[0][0]+v[1][0]+v[2][0])/3,(v[0][1]+v[1][1]+v[2][1])/3]; }
  function edgeLabel(gr,p,q,txt,cen,sign,color,size){
    const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
    let nx=-(q[1]-p[1]),ny=(q[0]-p[0]); const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
    if((mx-cen[0])*nx+(my-cen[1])*ny<0){nx=-nx;ny=-ny;}
    const off=sign>0?14:-15;
    const t=el('text',{x:mx+nx*off,y:my+ny*off+5,class:'lenlabel','text-anchor':'middle',fill:color},txt);
    if(size) t.setAttribute('font-size',size);
    gr.appendChild(t); return t;
  }
  function xMark(gr,x,y){
    gr.appendChild(el('path',{d:`M ${x-4} ${y-4} L ${x+4} ${y+4} M ${x+4} ${y-4} L ${x-4} ${y+4}`,stroke:'#256B5A','stroke-width':2.5,'stroke-linecap':'round',fill:'none'}));
  }
  function inward(V,cen){
    const d=[cen[0]-V[0],cen[1]-V[1]],L=Math.hypot(...d)||1; const r=Math.min(20,L*0.35);
    return [V[0]+d[0]/L*r,V[1]+d[1]/L*r];
  }
  // 로컬 좌표(직각 꼭짓점 C=(0,0), B=(w,0), A=(0,-h))로 그린 삼각형
  function localTri(w,h,fill,stroke){
    const gr=el('g',{class:'tri'});
    gr.appendChild(el('polygon',{points:`0,0 ${w},0 0,${-h}`,fill:fill,stroke:stroke,'stroke-width':2,'stroke-linejoin':'round'}));
    const m=Math.min(10,w*0.3,h*0.3);
    gr.appendChild(el('path',{d:`M ${m} 0 L ${m} ${-m} L 0 ${-m}`,fill:'none',stroke:'#333','stroke-width':1.3}));
    const cen=[w/3,-h/3];
    const pa=inward([0,-h],cen); gr.appendChild(el('circle',{cx:pa[0],cy:pa[1],r:3.6,fill:'#E8722C'}));
    const pb=inward([w,0],cen); xMark(gr,pb[0],pb[1]);
    svg.appendChild(gr); return gr;
  }

  // ---- 세 삼각형의 크기 (원래 삼각형을 각각 a배, b배, c배) ----
  const defs=[
    {w:a*a*S, h:a*b*S, fill:'#CFE6F7', stroke:'#5A8DB5', col:'#2D5F86', lv:'ab', lb:'a²', lh:'ac'},
    {w:a*b*S, h:b*b*S, fill:'#FDE5BF', stroke:'#C9964A', col:'#9A6416', lv:'b²', lb:'ab', lh:'bc'},
    {w:a*c*S, h:b*c*S, fill:'rgba(225,215,238,0.9)', stroke:'#8E78B5', col:'#5B438A', lv:'bc', lb:'ac', lh:'c²'}
  ];
  const origW=a*40, origH=b*40, K=0.55, origTop=8;
    const totalW=defs.reduce((t,d)=>t+d.w,0)+gap*2;
  let xcur=(VW-totalW)/2;
  const tris=defs.map((d,i)=>{
    d.xs=xcur; xcur+=d.w+gap;
    d.gr=localTri(d.w,d.h,d.fill,d.stroke);
    // 떨어져 있을 때(회전 없음) 변의 길이 라벨
    const lg=el('g',{class:'fade'}); lg.style.opacity=0;
    const C=[d.xs,ybot],B=[d.xs+d.w,ybot],A=[d.xs,ybot-d.h],cen=centroid([A,B,C]);
    edgeLabel(lg,A,C,d.lv,cen,1,d.col);
    edgeLabel(lg,C,B,d.lb,cen,1,d.col);
    edgeLabel(lg,A,B,d.lh,cen,1,d.col);
    d.lg=lg; return d;
  });
  tris.forEach(d=>svg.appendChild(d.lg));

  // ---- 원래 삼각형에서 각 삼각형으로 향하는 배율 화살표 ----
  const sx=VW/2, sy=origTop+origH*K+24;
  ['a배','b배','c배'].forEach((txt,i)=>{
    const d=tris[i], ex=d.xs+6, ey=ybot-d.h-8;
    const cx=ex, cy=sy+(ey-sy)*0.55;
    const ag=el('g',{class:'fade'}); ag.style.opacity=0;
    const pth=el('path',{d:`M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}`,fill:'none',stroke:d.stroke,'stroke-width':2.6,'stroke-linecap':'round'});
    ag.appendChild(pth);
    // 화살촉
    let tx=ex-cx, ty=ey-cy; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    const hx=ex, hy=ey, nx=-ty, ny=tx;
    const head=el('polygon',{points:`${hx+tx*3},${hy+ty*3} ${hx-tx*11+nx*6},${hy-ty*11+ny*6} ${hx-tx*11-nx*6},${hy-ty*11-ny*6}`,fill:d.stroke});
    ag.appendChild(head);
    // 라벨 (곡선 한가운데)
    const mx=0.25*sx+0.5*cx+0.25*ex, my=0.25*sy+0.5*cy+0.25*ey;
    const side=(i===1)?1:((ex<sx-4)?-1:1);
    const albl=el('text',{x:mx+side*(i===2?34:22),y:my+5,class:'lenlabel','text-anchor':'middle',fill:d.col,'font-size':17},txt);
    ag.appendChild(albl);
    svg.appendChild(ag); ag.style.opacity=1;
    const len=pth.getTotalLength();
    pth.style.strokeDasharray=len; pth.style.strokeDashoffset=len;
    head.style.opacity=0; albl.style.opacity=0;
    d.ag={pth,head,albl,len};
  });

  // ---- 맞붙인 뒤의 위치 ----
  const x0=(VW-c2*S)/2, y0=(VH-H*S)/2;
  const phi=Math.atan2(b,a)*180/Math.PI;
  const asm=[
    `translate(${x0}px, ${y0+H*S}px) rotate(0deg) scale(1, 1)`,
    `translate(${x0+c2*S}px, ${y0+H*S}px) rotate(-90deg) scale(1, 1)`,
    `translate(${x0+a2*S}px, ${y0+H*S}px) rotate(${phi}deg) scale(-1, 1)`
  ];
  const sep=tris.map(d=>`translate(${d.xs}px, ${ybot}px) rotate(0deg) scale(1, 1)`);
  const sepSmall=tris.map(d=>`translate(${d.xs}px, ${ybot}px) rotate(0deg) scale(0.25, 0.25)`);

  // 맞붙인 뒤의 라벨
  const lblAsm=el('g',{class:'fade'}); lblAsm.style.opacity=0;
  {
    const Ab=[x0,y0],Cb=[x0,y0+H*S],Bb=[x0+a2*S,y0+H*S];
    const cb=centroid([Ab,Bb,Cb]);
    edgeLabel(lblAsm,Ab,Cb,'ab',cb,1,'#2D5F86');
    edgeLabel(lblAsm,Cb,Bb,'a²',cb,1,'#2D5F86');
    edgeLabel(lblAsm,Ab,Bb,'ac',cb,-1,'#2D5F86');
    const Bo=[x0+c2*S,y0],Co=[x0+c2*S,y0+H*S],Ao=[x0+a2*S,y0+H*S];
    const co=centroid([Ao,Bo,Co]);
    edgeLabel(lblAsm,Bo,Co,'ab',co,1,'#9A6416');
    edgeLabel(lblAsm,Co,Ao,'b²',co,1,'#9A6416');
    edgeLabel(lblAsm,Bo,Ao,'bc',co,-1,'#9A6416');
    const Bp=[x0,y0],Ap=[x0+c2*S,y0],Cp=[x0+a2*S,y0+H*S];
    edgeLabel(lblAsm,Bp,Ap,'c²',centroid([Bp,Ap,Cp]),1,'#5B438A');
  }
  svg.appendChild(lblAsm);

  // 결론 단계 강조선
  const hl=el('g',{class:'fade'}); hl.style.opacity=0;
  hl.appendChild(el('line',{x1:x0,y1:y0+H*S+6,x2:x0+c2*S,y2:y0+H*S+6,stroke:'#E8722C','stroke-width':4,'stroke-linecap':'round'}));
  hl.appendChild(el('line',{x1:x0,y1:y0-6,x2:x0+c2*S,y2:y0-6,stroke:'#E8722C','stroke-width':4,'stroke-linecap':'round'}));
  hl.appendChild(el('text',{x:x0+c2*S/2,y:y0+H*S+38,'text-anchor':'middle',class:'lenlabel',fill:'#C25A19','font-size':16},'아랫변 a² + b²'));
  hl.appendChild(el('text',{x:x0+c2*S/2,y:y0-34,'text-anchor':'middle',class:'lenlabel',fill:'#C25A19','font-size':16},'윗변 c²'));
  svg.appendChild(hl);

  // ---- 원래 삼각형 (회전하지 않은 그대로, 처음엔 가운데) ----
  const go0=el('g',{class:'fade'});
  go0.style.transition='opacity .5s ease, transform .8s ease';
  const Cc=[0,0],Bc=[origW,0],Ac=[0,-origH],cen0=centroid([Ac,Bc,Cc]);
  go0.appendChild(el('polygon',{points:`0,0 ${origW},0 0,${-origH}`,fill:'rgba(37,107,90,0.10)',stroke:'#233129','stroke-width':2.4,'stroke-linejoin':'round'}));
  go0.appendChild(el('path',{d:'M 12 0 L 12 -12 L 0 -12',fill:'none',stroke:'#333','stroke-width':1.3}));
  {
    const pa=inward(Ac,cen0); go0.appendChild(el('circle',{cx:pa[0],cy:pa[1],r:3.6,fill:'#E8722C'}));
    const pb=inward(Bc,cen0); xMark(go0,pb[0],pb[1]);
  }
  go0.appendChild(el('text',{x:-20,y:-origH+4,class:'vlabel','font-size':26},'A'));
  go0.appendChild(el('text',{x:origW+8,y:6,class:'vlabel','font-size':26},'B'));
  go0.appendChild(el('text',{x:-20,y:18,class:'vlabel','font-size':26},'C'));
  edgeLabel(go0,Cc,Bc,'a',cen0,1,'#184A3E',24);
  edgeLabel(go0,Ac,Cc,'b',cen0,1,'#184A3E',24);
  edgeLabel(go0,Ac,Bc,'c',cen0,1,'#184A3E',24);
  svg.appendChild(go0);
  const hint=el('text',{x:VW/2,y:VH-8,'text-anchor':'middle',class:'lenlabel',fill:'#C25A19','font-size':15},'👆 삼각형을 클릭해 보세요');
  hint.style.transition='opacity .4s ease';
  svg.appendChild(hint);

  proofRefs={tris,sep,sepSmall,asm,lblAsm,hl,go0,hint,
    origMid:`translate(${(VW-origW)/2}px, ${(VH+origH)/2}px) scale(1)`,
    origTop:`translate(${VW/2-K*origW/2}px, ${origTop+K*origH}px) scale(${K})`};
}

function applyStep(){
  const r=proofRefs; if(!r) return;
  const st=P2.step, asm=st>=4;
  // 원래 삼각형: 맞붙이기 전까지 남아 있고(첫 클릭 때 왼쪽으로 이동), 맞붙이기를 누르면 사라짐
  r.go0.style.opacity = st<4?1:0;
  r.go0.style.transform = st===0?r.origMid:r.origTop;
  r.hint.style.opacity = st===0?1:0;
  r.tris.forEach((d,i)=>{
    d.gr.style.opacity = st>=i+1?1:0;
    d.gr.style.transform = asm?r.asm[i]:(st>=i+1?r.sep[i]:r.sepSmall[i]);
    d.lg.style.opacity = (st>=i+1 && !asm)?1:0;
    {
      const show=(st>=i+1 && !asm), A=d.ag;
      // 새 삼각형이 먼저 만들어진 뒤, 화살표가 그려지고, 마지막에 화살촉과 '배' 글자가 나타남
      A.pth.style.transition = show?'stroke-dashoffset .7s ease .7s':'none';
      A.pth.style.strokeDashoffset = show?0:A.len;
      [A.head,A.albl].forEach(e=>{ e.style.transition = show?'opacity .3s ease 1.35s':'none'; e.style.opacity = show?1:0; });
      d.lg.style.transition = show?'opacity .4s ease .5s':'opacity .3s ease';
    }
  });
  r.lblAsm.style.transitionDelay = asm?'.8s':'0s';
  r.lblAsm.style.opacity = asm?1:0;
  r.hl.style.opacity = st===5?1:0;

  const caps=[
    `직각을 낀 두 변의 길이가 <b>a, b</b>이고 빗변의 길이가 <b>c</b>인 직각삼각형 ABC예요. <b>삼각형을 클릭</b>하면 세 변의 길이를 <b>a배</b> 한 삼각형이 만들어져요.`,
    `원래 삼각형(위쪽)의 세 변의 길이를 화살표처럼 <b>a배</b> 하여 닮은 삼각형을 만들었어요. 변의 길이는 <b>a², ab, ac</b>예요. 한 번 더 클릭하면 <b>b배</b> 한 삼각형이 만들어져요.`,
    `세 변의 길이를 <b>b배</b> 하여 닮은 삼각형을 만들었어요. 변의 길이는 <b>ab, b², bc</b>예요. 한 번 더 클릭하면 <b>c배</b> 한 삼각형이 만들어져요.`,
    `세 변의 길이를 <b>c배</b> 하여 닮은 삼각형을 만들었어요. 변의 길이는 <b>ac, bc, c²</b>예요. 이제 [맞붙이기]를 눌러 길이가 <b>ac</b>인 변끼리, <b>bc</b>인 변끼리 붙여 보세요.`,
    `삼각형들을 붙이기 좋은 방향으로 돌려서(보라색 삼각형은 뒤집어서) 길이가 <b>ac</b>인 변끼리, <b>bc</b>인 변끼리 맞붙였어요. 맞붙인 점에서 ×, 직각, ● 세 각이 모여 있고 ● + × = 90°이므로 (× + 90° + ●) = <b>180°</b> → 아랫변은 일직선이에요. 네 각이 모두 직각이니 전체는 <b>직사각형</b>이 돼요!`,
    `직사각형은 마주 보는 두 변의 길이가 같아요. 윗변은 <b>c²</b>, 아랫변은 <b>a² + b²</b>이므로 <b>a² + b² = c²</b>이 성립해요!`
  ];
  document.getElementById('caption').innerHTML=caps[st];
  document.getElementById('dots').innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i===st?'on':''}"></i>`).join('');
  document.getElementById('proofSvg').style.cursor = st<3?'pointer':'default';
  document.getElementById('asmBtn').disabled = st!==3;
  document.getElementById('concBtn').disabled = st!==4;
  const fin=document.getElementById('finalBox');
  if(st===5){
    fin.classList.remove('hidden');
    fin.innerHTML=`<div class="big">a² + b² = c²</div>
      직각삼각형에서 직각을 낀 두 변의 길이를 각각 a, b, 빗변의 길이를 c라고 하면
      <b>a² + b² = c²</b>이 성립해요. 이를 <b>피타고라스 정리</b>라고 합니다.
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="ghostBtn" id="againBtn">↺ 처음부터 다시 보기</button>
        <button class="ghostBtn" id="backP1">① 발견하기로 돌아가기</button>
      </div>`;
    document.getElementById('againBtn').addEventListener('click',()=>{P2.step=0; applyStep();});
    document.getElementById('backP1').addEventListener('click',()=>go('p1'));
  } else fin.classList.add('hidden');
}

go('intro');
</script>
</body>
