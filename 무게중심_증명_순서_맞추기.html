<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각형의 무게중심 증명 순서 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#EAFBF3; --bg-b:#E3F1FF;
    --paper:#5FBE8A; --paper-dark:#2E8A5C; --paper-line:#1E6B44; --paper-soft:#DFF6EA;
    --accent:#FF8B5E; --accent-dark:#E96A3A;
    --blue:#4C9BDE; --blue-dark:#2E76B8;
    --ink:#1E3A34; --muted:#5C7A72;
    --card:#FFFFFF; --card-line:#D7EEE3;
    --danger:#EE6B6B; --good:#2EA36B; --gold:#E8B93F;
  }
  *{box-sizing:border-box;}
  html,body{
    min-height:100%; margin:0; overflow-x:hidden; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:radial-gradient(circle at 8% 10%, rgba(255,255,255,.6), transparent 40%),
               linear-gradient(150deg,var(--bg-a),var(--bg-b));
    font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  }
  .app{min-height:100vh; width:100%; display:flex; flex-direction:column; padding:12px 20px 14px; gap:8px;}

  @media (max-width: 820px){
    .app{padding:10px 12px 16px; gap:10px;}
    .topbar{flex-wrap:wrap; row-gap:8px;}
    .propbar{flex:1 1 100%; order:2;}
    .topbar h1{order:1;}
    .stage-wrap{flex-direction:column; gap:10px;}
    .figpanel{flex:0 0 auto; width:100%;}
    .figpanel svg{height:190px; flex:none;}
    .poolpanel, .slotpanel{flex:0 0 auto; width:100%;}
    .pool{overflow:visible; max-height:none;}
    .card{width:100%;}
    .slots{flex:0 0 auto;}
    .slot{flex:0 0 auto; min-height:40px; padding:6px 8px;}
    .navbar{flex-wrap:wrap; row-gap:8px;}
    .navbar .left-btns{order:1;}
    .navbar .right-btns{order:2; margin-left:auto;}
    .feedback{order:3; flex:1 1 100%; text-align:left;}
  }

  .topbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .topbar h1{
    font-family:'Gowun Dodum',sans-serif; font-size:clamp(16px,1.9vw,23px); margin:0;
    color:var(--paper-dark); display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .propbar{
    flex:1 1 auto; background:#fff; border:1.4px solid var(--card-line); border-radius:14px;
    padding:8px 16px; font-size:13px; line-height:1.45; color:var(--ink); font-weight:500;
  }
  .propbar b{color:var(--accent-dark);}

  .stage-wrap{flex:1 1 auto; display:flex; gap:14px; min-height:0;}

  .figpanel{
    flex:0 0 22%; background:var(--card); border:1.5px solid var(--card-line); border-radius:20px;
    padding:14px 16px; display:flex; flex-direction:column; gap:8px; box-shadow:0 10px 24px -14px rgba(30,90,60,.25);
    min-height:0;
  }
  .figpanel .eyebrow{font-size:11px; font-weight:700; color:var(--blue-dark); background:#EAF4FD; padding:3px 9px; border-radius:999px; width:fit-content;}
  .figpanel svg{width:100%; flex:1 1 auto; min-height:0;}
  .figpanel .rule{font-size:12px; color:var(--muted); line-height:1.6;}
  .figcap{font-size:12px; font-weight:700; color:var(--blue-dark); line-height:1.45; min-height:2.9em;}
  .legend{display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:var(--muted);}
  .legend i{display:inline-block; width:18px; height:0; border-top:3px solid; vertical-align:middle; margin-right:6px;}

  .poolpanel, .slotpanel{
    background:var(--card); border:1.5px solid var(--card-line); border-radius:20px;
    display:flex; flex-direction:column; min-height:0; box-shadow:0 10px 24px -14px rgba(30,90,60,.25);
  }
  .poolpanel{flex:0 0 37%; padding:12px 14px;}
  .slotpanel{flex:1 1 auto; padding:12px 14px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; margin-bottom:6px;}
  .panel-head h2{font-family:'Gowun Dodum',sans-serif; font-size:15px; margin:0; color:var(--ink);}
  .panel-head .count{font-size:11.5px; color:var(--muted); font-weight:700;}

  .pool{
    flex:1 1 auto; display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px;
    overflow-y:auto; min-height:0;
  }
  .card{
    background:#FFF8EF; border:1.6px solid #F0DCC0; border-radius:12px;
    padding:8px 10px 8px 8px; font-size:12.2px; line-height:1.5; color:var(--ink);
    cursor:grab; display:flex; align-items:flex-start; gap:6px;
    width:calc(50% - 4px); user-select:none; transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .card .handle{color:#C9A46B; font-size:12px; margin-top:1px;}
  .card:hover{box-shadow:0 6px 14px -8px rgba(0,0,0,.25);}
  .card.selected{border-color:var(--accent); background:#FFEFE2; box-shadow:0 0 0 3px rgba(255,139,94,.25);}
  .card.dragging{opacity:.35;}

  .slots{flex:1 1 auto; display:flex; flex-direction:column; gap:5px; min-height:0; justify-content:space-between;}
  .slot{
    flex:1 1 0; display:flex; align-items:center; gap:8px; min-height:38px;
    border:1.8px dashed #CFE3D8; border-radius:12px; padding:4px 8px; background:#FAFEFC;
    transition:border-color .15s ease, background .15s ease;
  }
  .slot .slotnum{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:#B9D8C8; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
  }
  .slot .placeholder{font-size:11.5px; color:#9FB6AC;}
  .slot.over{border-color:var(--accent); background:#FFF3EA;}
  .slot .card{width:100%; cursor:pointer;}
  .slot.correct{border-style:solid; border-color:var(--good); background:#EEFBF3;}
  .slot.correct .slotnum{background:var(--good);}
  .slot.wrong{border-style:solid; border-color:var(--danger); background:#FDEEEE;}
  .slot.wrong .slotnum{background:var(--danger);}

  .navbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .navbar .left-btns, .navbar .right-btns{display:flex; gap:8px;}
  .navbar button{
    border:1.6px solid var(--card-line); background:#fff; color:var(--ink); font-weight:700; font-size:13px;
    padding:9px 18px; border-radius:12px; cursor:pointer; transition:all .15s ease; font-family:inherit;
  }
  .navbar button:hover{border-color:var(--paper); color:var(--paper-dark);}
  .navbar button.primary{background:var(--paper-dark); color:#fff; border-color:var(--paper-dark);}
  .navbar button.primary:hover{background:var(--paper); border-color:var(--paper);}
  .feedback{flex:1 1 auto; text-align:center; font-size:13.5px; font-weight:700; color:var(--muted);}
  .feedback.ok{color:var(--good);}
  .feedback.bad{color:var(--danger);}

  .conclusion-overlay{
    position:fixed; inset:0; background:rgba(20,50,40,.45); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .conclusion-overlay.show{display:flex;}
  .conclusion-card{
    background:#fff; border-radius:22px; padding:28px 34px; max-width:520px; text-align:center;
    box-shadow:0 24px 50px -20px rgba(0,0,0,.4);
  }
  .conclusion-card h2{font-family:'Gowun Dodum',sans-serif; color:var(--paper-dark); font-size:22px; margin:0 0 10px;}
  .conclusion-card p{font-size:14px; line-height:1.7; color:var(--ink); margin:0 0 18px;}
  .conclusion-card button{
    border:none; background:linear-gradient(135deg,var(--paper),var(--paper-dark)); color:#fff; font-weight:700;
    padding:10px 24px; border-radius:12px; cursor:pointer; font-size:14px; font-family:inherit;
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1>🧩 증명 순서 맞추기</h1>
    <div class="propbar" id="propbar"></div>
  </div>

  <div class="stage-wrap">
    <aside class="figpanel">
      <div class="eyebrow">주어진 도형</div>
      <svg id="figSvg" viewBox="0 0 300 220"></svg>
      <div class="figcap" id="figCap"></div>
      <div class="legend" id="legend"></div>
      <div class="rule" id="ruleText"></div>
    </aside>

    <section class="poolpanel">
      <div class="panel-head"><h2>🗂 카드 보관함</h2><span class="count" id="poolCount"></span></div>
      <div class="pool" id="pool"></div>
    </section>

    <section class="slotpanel">
      <div class="panel-head"><h2>📜 증명 순서 (1 → 9)</h2><span class="count" id="slotCount"></span></div>
      <div class="slots" id="slots"></div>
    </section>
  </div>

  <div class="navbar">
    <div class="left-btns">
      <button id="resetBtn">🔁 다시 섞기</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="right-btns">
      <button class="primary" id="checkBtn">✔ 정답 확인</button>
    </div>
  </div>
</div>

<div class="conclusion-overlay" id="overlay">
  <div class="conclusion-card">
    <h2>🎉 증명 완성!</h2>
    <p>삼각형의 세 중선은 <b>한 점(무게중심)</b>에서 만나고,<br>
    그 점은 세 중선의 길이를 각 꼭짓점으로부터<br>
    <b>2 : 1</b>로 나눕니다.</p>
    <button id="closeOverlay">계속하기</button>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent=null){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function ol(id){ return `<span style="text-decoration:overline;">${id}</span>`; }
const DEFAULT_MSG='카드를 클릭하거나 드래그해서 증명 순서대로 배치해 보세요.';

/* ---------------- proposition + figure ---------------- */
document.getElementById('propbar').innerHTML =
  `<b>성질.</b> 삼각형의 세 중선은 한 점에서 만나고, 그 점은 세 중선의 길이를 각 꼭짓점으로부터 각각 <b>2 : 1</b>이 되도록 나눈다.`;
document.getElementById('ruleText').innerHTML =
  `△ABC의 세 중선 ${ol('AD')}, ${ol('BE')}, ${ol('CF')}가 한 점에서 만나고, 그 점이 각 중선을 꼭짓점으로부터 2 : 1로 나눔을 증명해 봅시다.`;

/* ---------------- figure (changes with the clicked card) ---------------- */
const FA={x:120,y:24}, FB={x:30,y:192}, FC={x:270,y:192};
const fmid=(P,Q)=>({x:(P.x+Q.x)/2,y:(P.y+Q.y)/2});
const FD=fmid(FB,FC), FE=fmid(FA,FC), FF=fmid(FA,FB);
const FG={x:(FA.x+FB.x+FC.x)/3, y:(FA.y+FB.y+FC.y)/3};

const FIG_MODE={S1:'g1',S2:'g1',S3:'g1',S4:'g1',S5:'g2',S6:'g2',S7:'ad'};
const MODE_INFO={
  base:{cap:'카드를 클릭하면 그 단계에 맞는 도형이 나타나요. (기본: △ABC의 세 중선)',
        legend:[['#E96A3A','중선 AD'],['#2E76B8','중선 BE'],['#2EA36B','중선 CF']]},
  g1:{cap:'중선 AD, BE의 교점 G, 선분 DE, △ABG와 △EDG',
        legend:[['#8C6EC8','△ABG'],['#FF8B5E','△EDG']]},
  g2:{cap:'중선 AD, CF의 교점 G′, 선분 DF, △DFG′와 △AG′C',
        legend:[['#FF8B5E','△DFG′'],['#2EA36B','△AG′C']]},
  ad:{cap:'중선 AD 위의 두 점 G와 G′',
        legend:[['#E96A3A','중선 AD']]}
};

function renderFigure(mode){
  mode = mode || 'base';
  const svg = document.getElementById('figSvg');
  svg.innerHTML='';
  const A=FA,B=FB,C=FC,D=FD,E=FE,F=FF,G=FG;
  const pts=(...p)=>p.map(q=>q.x+','+q.y).join(' ');
  const line=(P,Q,color,w,extra={})=>el('line',Object.assign({x1:P.x,y1:P.y,x2:Q.x,y2:Q.y,stroke:color,'stroke-width':w,'stroke-linecap':'round'},extra),svg);
  const lbl=(p,txt,dx,dy)=>{ el('text',{x:p.x+dx,y:p.y+dy,'font-size':15,'font-weight':700,fill:'var(--ink)'},svg).textContent=txt; };
  function tick(p1,p2,count){
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI;
    const rad=ang*Math.PI/180, spacing=7;
    for(let i=0;i<count;i++){
      const off=(i-(count-1)/2)*spacing;
      el('path',{d:'M-3,-4 L3,4',fill:'none',stroke:'#1E3A34','stroke-width':1.6,'stroke-linecap':'round',
        transform:`translate(${mx+Math.cos(rad)*off},${my+Math.sin(rad)*off}) rotate(${ang})`},svg);
    }
  }
  const dot=(p,r,fill)=>el('circle',{cx:p.x,cy:p.y,r:r,fill:fill},svg);

  if(mode==='g1'){
    el('polygon',{points:pts(A,B,G),fill:'rgba(140,110,200,.38)',stroke:'#8C6EC8','stroke-width':1.5,'stroke-linejoin':'round'},svg);
    el('polygon',{points:pts(E,D,G),fill:'rgba(255,139,94,.45)',stroke:'#FF8B5E','stroke-width':1.5,'stroke-linejoin':'round'},svg);
  } else if(mode==='g2'){
    el('polygon',{points:pts(D,F,G),fill:'rgba(255,139,94,.45)',stroke:'#FF8B5E','stroke-width':1.5,'stroke-linejoin':'round'},svg);
    el('polygon',{points:pts(A,G,C),fill:'rgba(46,163,107,.38)',stroke:'#2EA36B','stroke-width':1.5,'stroke-linejoin':'round'},svg);
  }

  el('polygon',{points:pts(A,B,C),fill:(mode==='base'||mode==='ad')?'var(--paper-soft)':'none',stroke:'var(--paper-line)','stroke-width':2,'stroke-linejoin':'round'},svg);

  if(mode==='base'){
    line(A,D,'#E96A3A',2.2); line(B,E,'#2E76B8',2.2); line(C,F,'#2EA36B',2.2);
    tick(B,D,2); tick(D,C,2); tick(A,E,1); tick(E,C,1); tick(A,F,3); tick(F,B,3);
    dot(G,4,'var(--ink)');
    lbl(A,'A',-5,-8); lbl(B,'B',-18,14); lbl(C,'C',6,14);
    lbl(D,'D',-5,18); lbl(E,'E',8,2); lbl(F,'F',-20,2); lbl(G,'G',8,-5);
  }
  else if(mode==='g1'){
    line(A,D,'#E96A3A',2.2); line(B,E,'#2E76B8',2.2);
    line(D,E,'#E96A3A',2.6,{'stroke-dasharray':'6 4'});
    tick(B,D,2); tick(D,C,2); tick(A,E,1); tick(E,C,1);
    dot(G,4,'var(--ink)');
    lbl(A,'A',-5,-8); lbl(B,'B',-18,14); lbl(C,'C',6,14);
    lbl(D,'D',-5,18); lbl(E,'E',8,2); lbl(G,'G',-17,5);
  }
  else if(mode==='g2'){
    line(A,D,'#E96A3A',2.2); line(C,F,'#2EA36B',2.2);
    line(D,F,'#E96A3A',2.6,{'stroke-dasharray':'6 4'});
    tick(B,D,2); tick(D,C,2); tick(A,F,3); tick(F,B,3);
    dot(G,4,'var(--ink)');
    lbl(A,'A',-5,-8); lbl(B,'B',-18,14); lbl(C,'C',6,14);
    lbl(D,'D',-5,18); lbl(F,'F',-20,2); lbl(G,'G′',8,-6);
  }
  else if(mode==='ad'){
    tick(B,D,2); tick(D,C,2);
    line(A,D,'rgba(233,106,58,.3)',9);
    line(A,D,'#E96A3A',3.4);
    el('circle',{cx:G.x,cy:G.y,r:9,fill:'none',stroke:'#2E76B8','stroke-width':2},svg);
    dot(G,4.5,'var(--ink)');
    line({x:G.x+6,y:G.y-6},{x:G.x+34,y:G.y-26},'#1E3A34',1);
    line({x:G.x+8,y:G.y+4},{x:G.x+34,y:G.y+22},'#2E76B8',1);
    el('text',{x:G.x+37,y:G.y-24,'font-size':15,'font-weight':700,fill:'var(--ink)'},svg).textContent='G';
    el('text',{x:G.x+37,y:G.y+28,'font-size':15,'font-weight':700,fill:'#2E76B8'},svg).textContent='G′';
    const m1=fmid(A,G), m2=fmid(G,D);
    el('text',{x:m1.x-22,y:m1.y+4,'font-size':13,'font-weight':700,fill:'#E96A3A'},svg).textContent='2';
    el('text',{x:m2.x-22,y:m2.y+4,'font-size':13,'font-weight':700,fill:'#E96A3A'},svg).textContent='1';
    lbl(A,'A',-5,-8); lbl(B,'B',-18,14); lbl(C,'C',6,14); lbl(D,'D',-5,18);
  }

  const info=MODE_INFO[mode];
  document.getElementById('figCap').textContent=info.cap;
  document.getElementById('legend').innerHTML=info.legend.map(l=>`<span><i style="border-color:${l[0]}"></i>${l[1]}</span>`).join('');
}
function showFigure(stepId){ renderFigure(FIG_MODE[stepId]||'base'); }

/* ---------------- proof steps ---------------- */
const STEPS = [
  {id:'S1', html:`△ABC에서 두 중선 ${ol('AD')}, ${ol('BE')}의 교점을 G라고 하자.`},
  {id:'S2', html:`두 점 D, E는 각각 두 변 BC, AC의 중점이므로 ${ol('AB')} ∥ ${ol('DE')}, ${ol('DE')} = ½${ol('AB')}이다.`},
  {id:'S3', html:`따라서 △GAB ∽ △GDE (AA 닮음)이고 닮음비는 ${ol('AB')} : ${ol('DE')} = 2 : 1이므로 ${ol('AG')} : ${ol('GD')} = ${ol('BG')} : ${ol('GE')} = 2 : 1이다.`},
  {id:'S4', html:`즉, 점 G는 두 중선 AD와 BE를 각각 꼭짓점으로부터 그 길이가 2 : 1이 되도록 나누는 점이다.`},
  {id:'S5', html:`같은 방법으로 △ABC에서 두 중선 AD, CF의 교점을 G′이라 하면 △G′AC ∽ △G′DF (AA 닮음)이고 ${ol('AG′')} : ${ol('G′D')} = ${ol('CG′')} : ${ol('G′F')} = 2 : 1이다.`},
  {id:'S6', html:`즉, 점 G′은 두 중선 AD와 CF를 각각 꼭짓점으로부터 그 길이가 2 : 1이 되도록 나누는 점이다.`},
  {id:'S7', html:`이때 점 G와 점 G′은 모두 중선 AD를 꼭짓점 A로부터 그 길이를 2 : 1로 나누는 점이므로 점 G와 점 G′은 일치한다.`},
  {id:'S8', html:`따라서 △ABC의 세 중선은 한 점에서 만난다.`},
  {id:'S9', html:`또한 그 점은 세 중선의 길이를 각 꼭짓점으로부터 각각 2 : 1이 되도록 나눈다.`},
];
const correctOrder = STEPS.map(s=>s.id);
const cardsById = {};

const poolEl = document.getElementById('pool');
const slotsEl = document.getElementById('slots');
const poolCountEl = document.getElementById('poolCount');
const slotCountEl = document.getElementById('slotCount');
const feedbackEl = document.getElementById('feedback');

let selectedCard = null;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildCard(step){
  const c = document.createElement('div');
  c.className='card';
  c.draggable=true;
  c.dataset.id=step.id;
  c.innerHTML = `<span class="handle">⠿</span><span>${step.html}</span>`;
  c.addEventListener('click', ()=>onCardClick(c));
  c.addEventListener('dragstart', (e)=>{ e.dataTransfer.setData('text/plain', step.id); c.classList.add('dragging'); });
  c.addEventListener('dragend', ()=> c.classList.remove('dragging'));
  cardsById[step.id]=c;
  return c;
}

function buildSlots(){
  slotsEl.innerHTML='';
  STEPS.forEach((s,i)=>{
    const slot=document.createElement('div');
    slot.className='slot';
    slot.dataset.index=i;
    const num=document.createElement('div');
    num.className='slotnum'; num.textContent=(i+1);
    const ph=document.createElement('div');
    ph.className='placeholder'; ph.textContent='여기에 카드를 놓으세요';
    slot.appendChild(num); slot.appendChild(ph);
    slot.addEventListener('dragover', (e)=>{ e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
    slot.addEventListener('drop', (e)=>{
      e.preventDefault(); slot.classList.remove('over');
      const card = cardsById[e.dataTransfer.getData('text/plain')];
      if(card) placeInSlot(card, slot);
    });
    slot.addEventListener('click', (e)=>{
      if(e.target.closest('.card')) return;
      if(selectedCard){ placeInSlot(selectedCard, slot); clearSelection(); }
    });
    slotsEl.appendChild(slot);
  });
}

function slotHasCard(slot){ return slot.querySelector('.card') !== null; }

function placeInSlot(card, slot){
  const sourceParent = card.parentElement;
  const existing = slot.querySelector('.card');
  if(existing && existing!==card){ sourceParent.appendChild(existing); }
  const ph = slot.querySelector('.placeholder');
  if(ph) ph.remove();
  slot.appendChild(card);
  refreshEmptyPlaceholders();
  clearFeedbackStyles();
  updateCounts();
}

function sendToPool(card){
  poolEl.appendChild(card);
  refreshEmptyPlaceholders();
  clearFeedbackStyles();
  updateCounts();
}

function refreshEmptyPlaceholders(){
  document.querySelectorAll('.slot').forEach(slot=>{
    if(!slotHasCard(slot) && !slot.querySelector('.placeholder')){
      const ph=document.createElement('div');
      ph.className='placeholder'; ph.textContent='여기에 카드를 놓으세요';
      slot.appendChild(ph);
    }
  });
}

function onCardClick(card){
  showFigure(card.dataset.id);
  if(card.parentElement.classList.contains('slot')){
    sendToPool(card); clearSelection(); return;
  }
  if(selectedCard===card){ clearSelection(); return; }
  clearSelection();
  selectedCard=card;
  card.classList.add('selected');
}
function clearSelection(){
  if(selectedCard) selectedCard.classList.remove('selected');
  selectedCard=null;
}

poolEl.addEventListener('dragover',(e)=>e.preventDefault());
poolEl.addEventListener('drop',(e)=>{
  e.preventDefault();
  const card=cardsById[e.dataTransfer.getData('text/plain')];
  if(card) sendToPool(card);
});

function updateCounts(){
  const poolN = poolEl.querySelectorAll('.card').length;
  poolCountEl.textContent = poolN+'장 남음';
  slotCountEl.textContent = (STEPS.length-poolN)+' / '+STEPS.length+' 배치됨';
}

function clearFeedbackStyles(){
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('correct','wrong'));
  feedbackEl.className='feedback';
  feedbackEl.textContent=DEFAULT_MSG;
}

function init(){
  poolEl.innerHTML=''; slotsEl.innerHTML=''; clearSelection();
  shuffle(STEPS).forEach(s=> poolEl.appendChild(buildCard(s)));
  buildSlots();
  clearFeedbackStyles();
  updateCounts();
  renderFigure('base');
}

document.getElementById('resetBtn').addEventListener('click', init);

document.getElementById('checkBtn').addEventListener('click', ()=>{
  const slotEls = document.querySelectorAll('.slot');
  let correctCount=0, filledCount=0;
  slotEls.forEach((slot,i)=>{
    slot.classList.remove('correct','wrong');
    const card=slot.querySelector('.card');
    if(!card) return;
    filledCount++;
    if(card.dataset.id===correctOrder[i]){ slot.classList.add('correct'); correctCount++; }
    else slot.classList.add('wrong');
  });
  if(filledCount<STEPS.length){
    feedbackEl.className='feedback bad';
    feedbackEl.textContent=`아직 ${STEPS.length-filledCount}칸이 비어 있어요. 모든 카드를 배치해 주세요.`;
    return;
  }
  if(correctCount===STEPS.length){
    feedbackEl.className='feedback ok';
    feedbackEl.textContent='정답이에요! 증명을 완성했어요 🎉';
    document.getElementById('overlay').classList.add('show');
  } else {
    feedbackEl.className='feedback bad';
    feedbackEl.textContent=`${correctCount} / ${STEPS.length}칸이 맞았어요. 빨간 칸을 다시 확인해 보세요.`;
  }
});

document.getElementById('closeOverlay').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
});

init();
</script>
</body>
</html>
